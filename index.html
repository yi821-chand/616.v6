        if (d < min && d > 0.001) { e.x = o.x + (vx / d) * min; e.y = o.y + (vy / d) * min; }
      }
    }

    // ---------------- 受击 / 死亡 / 掉落 ----------------
    // 怪物受伤 (所有伤害来源共用)。force: 击退力度; hx, hy: 命中点 (用于命中火花)
    // opts (可选): { source: 伤害来源 ('bolt' 玩家子弹 / 'crimsonBurst' 血债爆发 ...), tint: 'crimson' 闪红而不是闪白,
    //               textColor: 伤害数字颜色, spark: false 不生成子弹命中火花 }
    hurtEnemy(e, dmg, dirx, diry, force = G.COMBAT.bolt.knockback, hx = e.x, hy = e.y - e.AI.hitH, opts = {}) {
      if (e.state === 'dead' || e.air) return;
      // Boss 用的三个通用开关: shield 无敌 (怒吼时) / dmgMul 受伤倍率 (眩晕时) / hpFloor 血量下限 (不会一下跳过阶段)
      if (e.shield) { this.shieldSpark(hx, hy); return; }
      if (e.dmgMul) dmg *= e.dmgMul;
      const F = G.COMBAT.hitfx;
      if (e.hpLagT <= 0) e.hpLag = Math.max(e.hpLag, e.hp);   // 记录掉血前的血量, 用于血条残影
      e.hp -= dmg; e.hpShowT = 2.5; e.hpLagT = F.hpLagDelay;
      if (e.hpFloor != null && e.hp < e.hpFloor) e.hp = e.hpFloor;
      e.flash = F.flashTime;            // 闪白 (绘制时按曲线淡出)
      e.flashTint = opts.tint || null;  // 闪红等其他受击颜色
      e.hitT = F.freeze;                // 这只怪的动画定格一下
      // 击退: 按怪物体重缩放; 正在攻击时减弱; 叠加后限制最大值, 防止被连续命中滑出很远
      const committed = e.state === 'windup' || e.state === 'dash' || e.state === 'aim' || e.state === 'lunge';
      const chained = e.sinceHit < F.chainWindow;   // 连续命中: 第一下打得最重, 后面递减
      const k = force * (e.M.kbScale != null ? e.M.kbScale : 1) * (committed ? F.committedKbScale : 1) * (chained ? F.chainKbScale : 1);
      e.kbx += dirx * k; e.kby += diry * k;
      const km = Math.hypot(e.kbx, e.kby), cap = F.maxKnockback * (e.M.kbScale != null ? Math.min(1, e.M.kbScale) : 1);
      if (km > cap) { e.kbx *= cap / km; e.kby *= cap / km; }
      // 硬直: 只打断走路, 不打断攻击动作
      // 硬直只在一轮连击的第一下触发; 精英 (很重) 不吃硬直
      if (!chained && !committed && e.state !== 'jump' && (e.M.kbScale == null || e.M.kbScale >= 0.5)) e.stun = F.stun;
      e.sinceHit = 0;
      // 伤害数字: 连续命中同一只怪时合并成一个数字并"弹"一下, 不会刷屏
      const lt = e.lastText;
      if (lt && lt.t < F.mergeTextTime && this.texts.includes(lt)) { lt.val += dmg; lt.str = fmtDmg(lt.val); lt.t = 0.05; lt.pop = 1; if (opts.textColor) lt.color = opts.textColor; }
      else { e.lastText = this.text(e.x + rand(-6, 6), e.y - e.AI.hitH - 26, fmtDmg(dmg), opts.textColor || '#ffe9a8'); e.lastText.val = dmg; }
      if (opts.spark !== false) this.hitSpark(hx, hy, dirx, diry, e);
      if (G.Sfx) G.Sfx.play(isBig(e) ? 'heavy' : 'hit', { pitch: e.hp <= 0 ? 0.75 : rand(0.92, 1.08) });
      if (e.state === 'wander' || e.state === 'search') { e.state = 'chase'; e.alertT = 0.7; }
      const source = opts.source || 'bolt';
      G.Items.emit('hit', { cb: this, enemy: e, source, dmg, killed: e.hp <= 0, hx, hy, dirx, diry, shard: !!opts.shard, lance: !!opts.lance, reflected: !!opts.reflected, bolt: opts.bolt || null });
      if (e.hp <= 0) this.killEnemy(e, source);
    }

    // 通用范围伤害: (x, y) 为地面坐标, 俯视角下按椭圆判定。返回被命中的敌人列表。
    // opts: { source, meta (附加信息, 原样传给事件), knockback, tint, textColor, onHit(e, dx, dy) 每个目标的表现回调 }
    // 对每个目标: 先派发 'aoeHit' 事件 (伤害结算前, 可以施加状态), 再走 hurtEnemy 结算伤害
    areaDamage(x, y, radius, dmg, opts = {}) {
      const targets = this.enemies.filter((e) => e.state !== 'dead' && !e.air && e.spawnT <= 0 &&
        Math.hypot(e.x - x, (e.y - y) * 1.25) <= radius + e.r);
      for (const e of targets) {
        if (e.state === 'dead') continue;   // 可能已被同一次结算中更早的效果打死
        if (e.shield) { this.shieldSpark(e.x, e.y - e.AI.hitH); continue; }   // 无敌中 (Boss 怒吼)
        G.Items.emit('aoeHit', { cb: this, enemy: e, source: opts.source, meta: opts.meta, x, y, radius });
        const dx = e.x - x, dy = e.y - y, l = Math.hypot(dx, dy) || 1;
        this.hurtEnemy(e, dmg, dx / l, dy / l, opts.knockback != null ? opts.knockback : G.COMBAT.bolt.knockback, e.x, e.y - e.AI.hitH,
          { source: opts.source, tint: opts.tint, textColor: opts.textColor, spark: false });
        if (opts.onHit) opts.onHit(e, dx / l, dy / l);
      }
      // 道具的范围伤害 (猩红爆发、幽魂、奇点...) 也能打碎范围内的石瓮
      for (const o of this.world.objects.slice()) {
        if (!o.def.breakable || o.broken || Math.hypot(o.x - x, (o.y - y) * 1.25) > radius + 16) continue;
        const dx = o.x - x, dy = o.y - y, l = Math.hypot(dx, dy) || 1;
        this.damageBreakable(o, dmg, dx / l, dy / l);
      }
      return targets;
    }

    // 命中火花: 一个短促的十字闪光 + 少量沿子弹方向飞溅的碎屑 (一半是怪物自身颜色)
    hitSpark(x, y, dx, dy, e) {
      if (this.impacts.length < 40) this.impacts.push({ x, y, t: 0, life: 0.1, big: isBig(e) });
      const cols = e ? G.CharArt.colors[e.type] : null;
      const base = Math.atan2(dy, dx);
      for (let i = 0; i < 6; i++) {
        const back = i < 2;                        // 少量反弹火花, 其余顺着子弹方向穿出去
        const a = base + (back ? Math.PI : 0) + rand(-0.7, 0.7), sp = rand(back ? 60 : 110, back ? 140 : 260);
        this.addPart({ x, y, z: 0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: i % 2 ? rand(40, 120) : 0, g: i % 2 ? 500 : 0,
          life: rand(0.14, 0.26), t: 0, c: back || !cols ? (i % 2 ? '#e6ffff' : '#7ef0ff') : cols[i % cols.length], s: 3 });
      }
    }

    // 无敌时被打中: 紫白色的格挡火花
    shieldSpark(x, y) {
      if (this.impacts.length < 40) this.impacts.push({ x, y, t: 0, life: 0.08, big: false });
      for (let i = 0; i < 3; i++) {
        const a = rand(0, Math.PI * 2), sp = rand(80, 180);
        this.addPart({ x, y, z: 0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: 0, g: 0, life: 0.18, t: 0, c: i % 2 ? '#d8c2ff' : '#ffffff', s: 3 });
      }
      if (G.Sfx) G.Sfx.play('wall');
    }

    killEnemy(e, source = 'bolt') {
      if (e._killed) return;   // 死亡只结算一次 (掉落、击杀数、道具 kill 事件都不会重复)
      e._killed = true;
      e.state = 'dead'; e.deathT = 0; e.vx = e.vy = 0; e.blink = false;
      this.kills++;
      const cols = G.CharArt.colors[e.type], big = e.r / 16;
      const n = Math.round(16 * big);
      for (let i = 0; i < n; i++) {
        const a = rand(0, Math.PI * 2), sp = rand(60, 220) * Math.sqrt(big);
        this.addPart({ x: e.x, y: e.y - 6, z: rand(4, 16) + (e.type === 'eye' ? 24 : 0), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, vz: rand(80, 260), g: 700,
          life: rand(0.4, 0.8), t: 0, c: cols[i % cols.length], s: i % 3 === 0 ? 6 : 3 });
      }
      const sc = { slime: 'rgba(92,20,53,', beetle: 'rgba(40,90,30,', eye: 'rgba(90,30,80,', elite: 'rgba(70,12,50,', boss: 'rgba(80,6,36,' }[e.type] || 'rgba(70,12,50,';
      this.splats.push({ x: e.x, y: e.y - 2, t: 0, life: 5, rx: rand(20, 26) * big, ry: rand(8, 11) * big, c: sc });
      this.scene.shake = Math.max(this.scene.shake, isBig(e) ? 12 : 3);
      // 掉落: 魂晶 (计数) + 概率掉落回血爱心
      const D = e.M.drops;
      const souls = randi(D.soul[0], D.soul[1]);
      for (let i = 0; i < souls; i++) this._drop('soul', e.x, e.y);
      if (Math.random() < D.heart) this._drop('heart', e.x, e.y);
      if (e.type === 'elite') G.Display.toast(`击败了 ${e.M.name}!`, 1500);
      if (e.AI.onDeath) e.AI.onDeath(e, this);   // 怪物自己的死亡演出 (例如 Boss 倒下时召唤物溃散)
      G.Items.emit('kill', { cb: this, enemy: e, source });   // 道具事件: 敌人死亡 (例如血偿在这里排队爆发)
    }

    _drop(kind, x, y, extra) {
      const a = rand(0, Math.PI * 2), sp = rand(60, 150);
      this.drops.push(Object.assign({ kind, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.7, z: 10, vz: rand(140, 220), t: 0, life: kind === 'item' ? 1e9 : 20, magnet: false }, extra));
    }

    // ---------------- 每帧更新 ----------------
    update(dt) {
      const p = this.scene.player, B = G.COMBAT.bolt;
      this.partBudget = G.COMBAT.hitfx.particleBudget;
      G.Items.tick();
      this.flowT -= dt;
      if (!p.dead) this._updateFlow(p.x, p.y);

      // ---- 玩家子弹 (分步移动, 高速也不会穿墙) ----
      // 子弹种类 (第 15 版): 普通子弹 / lance 贯穿箭 / shard 分裂小子弹 / reflected 反射弹, 各自能触发什么见 js/arsenal.js 顶部
      const clash = this.ebolts.length > 0 && G.Items.wants('clash');   // 只有拿了逆鳞护符才检测子弹对撞
      for (const b of this.bolts) {
        const sp = Math.hypot(b.vx, b.vy);
        const steps = Math.max(1, Math.ceil((sp * dt) / 8));
        const range = b.range || B.range;
        b.age += dt;
        if (b.life && b.age > b.life) { b.dead = true; this.puff(b.x, b.y, '#b98cff', 2); continue; }   // 小子弹有自己的存在时间
        b.trail.unshift({ x: b.x, y: b.y }); if (b.trail.length > (b.lance ? 7 : 4)) b.trail.pop();
        for (let s = 0; s < steps && !b.dead; s++) {
          const px = b.x, py = b.y;
          b.x += (b.vx * dt) / steps; b.y += (b.vy * dt) / steps; b.dist += (sp * dt) / steps;
          const dmg = b.dmg != null ? b.dmg : B.damage;
          const hw = this._hitsWorld(b.x, b.y + 28);
          if (hw) {
            // 打到可破坏障碍物 (石瓮): 造成伤害; 墙和普通障碍物照旧挡住子弹
            if (hw.def && hw.def.breakable) this.damageBreakable(hw, dmg, b.vx / sp, b.vy / sp);
            // 道具可以让子弹反弹 (折射镜): 处理函数调用 reflect() 并设 bounce = true
            const ctx = { cb: this, bolt: b, x: b.x, y: b.y, bounce: false, reflect: () => this._reflectBolt(b, px, py, hw) };
            G.Items.emit('boltWall', ctx);
            if (ctx.bounce) { if (G.Sfx) G.Sfx.play('wall'); continue; }
            this._boltHit(b, '#9d82d0'); if (G.Sfx) G.Sfx.play('wall'); break;
          }
          // 子弹对撞 (逆鳞护符): 地面坐标比较 (玩家子弹离地 28, 敌弹离地 h)
          if (clash && !b.reflected) {
            for (const eb of this.ebolts) {
              if (eb.dead || Math.hypot(b.x - eb.x, b.y + 28 - (eb.y + eb.h)) > eb.r + (b.radius || B.radius) + 4) continue;
              const ctx = { cb: this, bolt: b, ebolt: eb, consume: false };
              G.Items.emit('clash', ctx);
              if (ctx.consume) { b.dead = true; break; }
            }
            if (b.dead) break;
          }
          for (const e of this.enemies) {
            if (e.state === 'dead' || e.spawnT > 0 || e.air || e.id === b.ignore) continue;
            if (b.pierce && b.hitIds.has(e.id)) continue;   // 贯穿箭: 同一个敌人只命中一次
            if (Math.hypot(b.x - e.x, b.y - (e.y - e.AI.hitH)) < e.r + (b.shard ? 4 : b.radius || B.radius)) {
              if (b.pierce) { b.hitIds.add(e.id); if (b.hitIds.size >= b.pierce) b.dead = true; }
              else b.dead = true;
              if (e.shield) { this.shieldSpark(b.x, b.y); b.dead = true; break; }   // 无敌中: 子弹被弹开, 不触发任何道具效果
              // 道具事件: 伤害结算之前 (例如血债在这里打标记, 打死它的这一发也能触发后续效果)
              // 所有玩家子弹的 source 都是 'bolt', 用 shard / lance / reflected 标记区分种类
              const kind = { shard: !!b.shard, lance: !!b.lance, reflected: !!b.reflected, bolt: b };
              G.Items.emit('beforeHit', Object.assign({ cb: this, enemy: e, source: 'bolt', dmg }, kind));
              this.hurtEnemy(e, dmg, b.vx / sp, b.vy / sp, B.knockback * (b.shard ? 0.5 : b.lance ? 1.4 : 1), b.x, b.y, Object.assign({ source: 'bolt' }, kind));
              break;
            }
          }
          if (!b.dead && b.dist > range) { b.dead = true; this.puff(b.x, b.y, b.lance ? '#e6ffff' : '#3f8fb0', 4); }
        }
      }
      this.bolts = this.bolts.filter((b) => !b.dead);

      // ---- 敌方投射物: 撞墙/障碍消失, 碰到玩家造成伤害 (闪避无敌时穿过) ----
      for (const b of this.ebolts) {
        b.t += dt;
        const sp = Math.hypot(b.vx, b.vy), steps = Math.max(1, Math.ceil((sp * dt) / 8));
        for (let s = 0; s < steps && !b.dead; s++) {
          b.x += (b.vx * dt) / steps; b.y += (b.vy * dt) / steps; b.dist += (sp * dt) / steps;
          if (this._hitsWorld(b.x, b.y + b.h)) { b.dead = true; this.puff(b.x, b.y, b.col[1], 5); break; }
          if (!p.dead && p.dash <= 0 && Math.hypot(b.x - p.cx, b.y - p.cy) < b.r + 13) {
            b.dead = true; this.puff(b.x, b.y, b.col[1], 6);
            p.hurt(b.dmg, b.x - b.vx, b.y - b.vy, this.scene);
            break;
          }
          if (b.dist > b.range) { b.dead = true; this.puff(b.x, b.y, b.col[1], 3); }
        }
      }
      this.ebolts = this.ebolts.filter((b) => !b.dead);

      // ---- 敌人 ----
      for (const e of this.enemies) this._updateEnemy(e, dt, p);
      G.Items.run('update', this, dt);   // 各流派运行时 (例如血债计时 + 爆发队列)
      // 敌人之间互相推开; 敌人不与玩家重叠 (空中的精英除外)
      for (let i = 0; i < this.enemies.length; i++) {
        const a = this.enemies[i]; if (a.state === 'dead' || a.air) continue;
        for (let j = i + 1; j < this.enemies.length; j++) {
          const b = this.enemies[j]; if (b.state === 'dead' || b.air) continue;
          const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
          if (d < min && d > 0.001) {
            // 体型大的被推得少
            const wa = b.r / (a.r + b.r), wb = a.r / (a.r + b.r), push = min - d;
            this._move(a, (-dx / d) * push * wa, (-dy / d) * push * wa); this._move(b, (dx / d) * push * wb, (dy / d) * push * wb);
          }
        }
        if (!p.dead) {
          const dx = a.x - p.x, dy = a.y - p.y, d = Math.hypot(dx, dy), min = a.r + C.PLAYER_RADIUS;
          if (d < min && d > 0.001) this._move(a, (dx / d) * (min - d), (dy / d) * (min - d));
        }
      }
      this.enemies = this.enemies.filter((e) => !(e.state === 'dead' && e.deathT > 0.45));

      // ---- 刷下一波 ----
      if (this.waveMode() && this.enemies.length === 0 && !p.dead) {
        this.waveT += dt;
        if (this.waveT > G.COMBAT.respawnDelay) { this.waveT = 0; this.spawnWave(false); }
      } else this.waveT = 0;

      // ---- 掉落物: 弹出 -> 落地 -> 靠近后吸向玩家 -> 拾取 ----
      for (const d of this.drops) {
        d.t += dt;
        d.vz -= 700 * dt; d.z = Math.max(0, d.z + d.vz * dt); if (d.z === 0) d.vz = 0;
        const dist = Math.hypot(p.x - d.x, p.y - 10 - d.y);
        const wantHeart = d.kind !== 'heart' || p.hp < p.maxHp;   // 满血时爱心不吸过来
        if (!p.dead && d.t > 0.4 && wantHeart && dist < G.COMBAT.pickupRadius) d.magnet = true;
        if (d.magnet && !p.dead) {
          const sp = 420 + d.t * 200;
          d.vx = ((p.x - d.x) / dist) * sp; d.vy = ((p.y - 10 - d.y) / dist) * sp;
        } else { d.vx *= Math.exp(-dt * 5); d.vy *= Math.exp(-dt * 5); }
        const ox = d.x, oy = d.y;
        d.x += d.vx * dt; d.y += d.vy * dt;
        if (!d.magnet && this.world.isWall(Math.floor(d.x / T), Math.floor(d.y / T))) { d.x = ox; d.y = oy; d.vx = d.vy = 0; }
        if (!p.dead && dist < 22 && d.t > 0.3 && wantHeart) {
          d.dead = true;
          if (d.kind === 'soul') { this.souls++; }
          else if (d.kind === 'item') { G.Items.grant(d.item); this.text(p.cx, p.cy - 40, G.Items.get(d.item).name, '#ff6a7a'); }
          else { p.heal(2); this.text(p.cx, p.cy - 30, '+1♥', '#ff8aa0'); }
          this.puff(d.x, d.y - 6, d.kind === 'soul' ? '#b98cff' : '#ff6a80', 4);
        }
        if (d.t > d.life) d.dead = true;
      }
      this.drops = this.drops.filter((d) => !d.dead);

      // ---- 粒子 / 数字 / 尸体痕迹 / 冲击波 ----
      for (const q of this.parts) {
        q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt;
        q.vz -= q.g * dt; q.z = Math.max(0, q.z + q.vz * dt);
        q.vx *= Math.exp(-dt * 3); q.vy *= Math.exp(-dt * 3);
      }
      this.parts = this.parts.filter((q) => q.t < q.life);
      for (const t of this.texts) { t.t += dt; t.pop = Math.max(0, t.pop - dt * 8); }
      for (const im of this.impacts) im.t += dt;
      this.impacts = this.impacts.filter((im) => im.t < im.life);
      this.texts = this.texts.filter((t) => t.t < 0.8);
      for (const s of this.splats) s.t += dt;
      this.splats = this.splats.filter((s) => s.t < s.life);
      for (const r of this.rings) r.t += dt;
      for (const o of this.world.objects) if (o.hitT > 0) o.hitT -= dt;   // 石瓮受击抖动
      this.rings = this.rings.filter((r) => r.t < r.life);
    }

    // 投射物撞墙 / 撞大型障碍物 (gy 为投射物对应的地面坐标)
    // 返回: false / true (墙) / 被撞到的障碍物对象
    _hitsWorld(x, gy) {
      if (this.world.isWall(Math.floor(x / T), Math.floor(gy / T))) return true;
      for (const o of this.world.objects) {
        const so = o.def.solid; if (!so || so.r < 10) continue;
        if (Math.hypot(x - o.x, gy - (o.y + (so.oy || 0))) < so.r + 3) return o;
      }
      return false;
    }

    // ---------------- 可破坏障碍物 (G.BREAKABLE) ----------------
    // 只有玩家的攻击 (子弹 / 道具的范围伤害) 会调用这里; 敌人的投射物只会被挡住
    damageBreakable(o, dmg, dx = 0, dy = 0) {
      if (o.broken) return;
      o.hp -= dmg; o.hitT = 0.14;
      const ratio = o.hp / o.maxHp;
      o.img = G.Placeholders.get(ratio > 0.67 ? 'ph_urn' : ratio > 0.34 ? 'ph_urn_c1' : 'ph_urn_c2');
      for (let i = 0; i < 4; i++) {
        const a = Math.atan2(-dy, -dx) + rand(-0.9, 0.9), sp = rand(60, 160);
        this.addPart({ x: o.x, y: o.y - 18, z: 6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, vz: rand(60, 160), g: 600, life: rand(0.25, 0.45), t: 0, c: i % 2 ? '#6e4fa0' : '#9d82d0', s: 3 });
      }
      if (o.hp <= 0) this.breakBreakable(o);
    }

    // 摧毁: 移出地图物件 (碰撞、视线、子弹阻挡一起消失), 碎块特效, 按概率掉魂晶 (每个只判定一次)
    breakBreakable(o) {
      if (o.broken) return;
      o.broken = true;
      const objs = this.world.objects, i = objs.indexOf(o);
      if (i >= 0) objs.splice(i, 1);
      this._buildBlocked(); this.flow = null;
      const cols = ['#2e1d45', '#4b3270', '#6e4fa0', '#9d82d0', '#2f6f8f'];
      for (let k = 0; k < 18; k++) {
        const a = rand(0, Math.PI * 2), sp = rand(70, 230);
        this.addPart({ x: o.x, y: o.y - 14, z: rand(4, 20), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, vz: rand(100, 240), g: 700, life: rand(0.4, 0.75), t: 0, c: cols[k % cols.length], s: k % 3 === 0 ? 6 : 3 });
      }
      this.splats.push({ x: o.x, y: o.y - 4, t: 0, life: 6, rx: 22, ry: 9, c: 'rgba(30,18,46,' });
      this.impacts.push({ x: o.x, y: o.y - 18, t: 0, life: 0.12, big: true });
      this.scene.shake = Math.max(this.scene.shake, 3);
      if (G.Sfx) G.Sfx.play('heavy', { pitch: 1.3 });
      this.brokenCount = (this.brokenCount || 0) + 1;
      const B = G.BREAKABLE;
      if (Math.random() < B.soulChance) {
        const n = randi(B.souls[0], B.souls[1]);
        for (let k = 0; k < n; k++) this._drop('soul', o.x, o.y - 4);
        o.dropped = n;
      } else o.dropped = 0;
    }

    // 子弹反弹: 退回撞墙前的位置, 按撞到的面翻转速度 (墙格: 按轴判断; 圆形障碍物: 按法线镜像)
    _reflectBolt(b, px, py, hit) {
      const T2 = T;
      if (hit && hit !== true) {
        const so = hit.def.solid, nx = b.x - hit.x, ny = b.y + 28 - (hit.y + (so.oy || 0)), l = Math.hypot(nx, ny) || 1;
        const d = (b.vx * nx + b.vy * ny) / l;
        b.vx -= 2 * d * nx / l; b.vy -= 2 * d * ny / l;
      } else {
        const w = this.world, wx = w.isWall(Math.floor(b.x / T2), Math.floor((py + 28) / T2)), wy = w.isWall(Math.floor(px / T2), Math.floor((b.y + 28) / T2));
        if (wx) b.vx = -b.vx;
        if (wy) b.vy = -b.vy;
        if (!wx && !wy) { b.vx = -b.vx; b.vy = -b.vy; }   // 正好撞在墙角
      }
      b.x = px; b.y = py;
      b.trail.length = 0;
    }

    _boltHit(b, color) { b.dead = true; this.puff(b.x, b.y, color, 5); }
    puff(x, y, c, n) {
      for (let i = 0; i < n; i++) {
        const a = rand(0, Math.PI * 2), sp = rand(40, 160);
        if (!this.addPart({ x, y, z: 0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: 0, g: 0, life: rand(0.15, 0.3), t: 0, c: i % 2 ? c : '#e6ffff', s: 3 })) break;
      }
    }

    // 通用状态 (游荡 / 搜索 / 丢失目标) 在这里处理, 其余交给各怪物自己的 think()
    _updateEnemy(e, dt, p) {
      // 定格期间动画不前进 (只这一只怪), 其余计时照常
      if (e.hitT > 0) e.hitT -= dt; else e.animT += dt;
      e.sinceHit += dt;
      e.flash = Math.max(0, e.flash - dt); e.hpShowT = Math.max(0, e.hpShowT - dt);
      // 血条残影: 停留一会儿后平滑收缩到当前血量
      if (e.hpLagT > 0) e.hpLagT -= dt;
      else if (e.hpLag > e.hp) e.hpLag = Math.max(e.hp, e.hpLag - Math.max(e.maxHp * 0.8, 6) * dt);
      e.alertT = Math.max(0, e.alertT - dt); e.cd = Math.max(0, e.cd - dt); e.cd2 = Math.max(0, e.cd2 - dt);
      if (e.state === 'dead') { e.deathT += dt; return; }
      if (e.spawnT > 0) { e.spawnT -= dt; return; }   // 出生时短暂淡入, 不行动

      const M = e.M, kd = Math.exp(-dt * 9);
      e.kbx *= kd; e.kby *= kd;
      const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 0.001;
      const per = { dx, dy, d, canSee: !p.dead && d < M.sight && this.los(e.x, e.y, p.x, p.y, false) };
      let mv = null;

      if (e.state === 'wander') {
        if (per.canSee) { e.state = 'chase'; e.alertT = 0.7; }
        else {
          e.timer -= dt;
          if (!e.goal && e.timer <= 0) {
            for (let k = 0; k < 6; k++) {
              const gx = e.home.x + rand(-130, 130), gy = e.home.y + rand(-130, 130);
              if (!this.blocked[Math.floor(gy / T) * this.world.w + Math.floor(gx / T)] && this.los(e.x, e.y, gx, gy, true, e.r)) { e.goal = { x: gx, y: gy }; break; }
            }
            e.timer = rand(1, 2.2);
          }
          if (e.goal) {
            const gx = e.goal.x - e.x, gy = e.goal.y - e.y, gl = Math.hypot(gx, gy);
            if (gl < 8 || e.timer <= -3) { e.goal = null; e.timer = rand(0.8, 2); }
            else mv = { mx: gx / gl, my: gy / gl, speed: M.wanderSpeed };
          }
        }
      } else if (e.state === 'search') {
        if (per.canSee) e.state = 'chase';
        else if (!e.lastSeen) e.state = 'wander';
        else {
          const gx = e.lastSeen.x - e.x, gy = e.lastSeen.y - e.y, gl = Math.hypot(gx, gy);
          e.timer -= dt;
          if (gl < 20 || e.timer <= 0) { e.state = 'wander'; e.home = { x: e.x, y: e.y }; e.goal = null; e.timer = 1; }
          else {
            const f = this.los(e.x, e.y, e.lastSeen.x, e.lastSeen.y, true, e.r) ? { x: gx / gl, y: gy / gl } : this._flowDir(e) || { x: 0, y: 0 };
            mv = { mx: f.x, my: f.y, speed: M.speed * 0.8 };
          }
        }
      }
      if (e.state === 'chase') {
        if (p.dead) { e.state = 'wander'; e.home = { x: e.x, y: e.y }; }
        else {
          if (per.canSee) { e.lastSeen = { x: p.x, y: p.y }; e.lostT = 0; } else e.lostT += dt;
          // 地牢房间里的怪 (e.roomAggro) 和玩家被关在同一个房间: 一直追 (看不到时沿寻路场绕过来), 不会丢失目标
          if (!e.roomAggro && (e.lostT > 3 || d > M.loseSight)) { e.state = 'search'; e.timer = 4; }
        }
      }
      // 追击及各怪物特有状态 (蓄力、冲刺、瞄准、跳跃...) 交给怪物自己
      if (e.stun > 0) {
        // 硬直: 停下脚步, 只保留击退带来的位移 (仍走正常碰撞)
        e.stun -= dt; mv = null;
      } else if (e.state !== 'wander' && e.state !== 'search') {
        if (p.dead && e.state !== 'jump') { e.state = 'wander'; e.home = { x: e.x, y: e.y }; e.blink = false; }
        else mv = e.AI.think(e, dt, this, p, per) || mv;
      }

      // 速度平滑 (冲刺/跳跃类为瞬时速度)
      if (e.slowT > 0) { e.slowT -= dt; if (mv && !mv.instant) mv = Object.assign({}, mv, { speed: mv.speed * (1 - (e.slowAmt || 0)) }); }   // 减速 (魂火足迹)
      const tvx = mv ? mv.mx * mv.speed : 0, tvy = mv ? mv.my * mv.speed : 0;
      const k = mv && mv.instant ? 1 : Math.min(1, dt * (e.stun > 0 ? 20 : 10));
      e.vx += (tvx - e.vx) * k; e.vy += (tvy - e.vy) * k;
      const ox = e.x, oy = e.y;
      this._move(e, (e.vx + e.kbx) * dt, (e.vy + e.kby) * dt);
      // 被墙/障碍挡住的时间 (冲刺撞墙、走位换方向用)
      const want = Math.hypot(e.vx, e.vy) * dt, got = Math.hypot(e.x - ox, e.y - oy);
      e.blockedT = want > 1 && got < want * 0.35 ? e.blockedT + dt : 0;
      const faceX = Math.abs(e.vx) > 8 ? e.vx : (per.canSee ? dx : 0);
      if (Math.abs(faceX) > 0.05) e.face = faceX > 0 ? 1 : -1;
      if (Math.hypot(e.vx, e.vy) > 10) e.hopT += dt * (e.state === 'chase' ? 2.6 : 1.6);
    }

    // ---------------- 绘制 ----------------
    // 地面层: 尸体痕迹、各怪物的预警 (蓄力方向、瞄准圈、落点)、冲击波
    drawGround(ctx, snap) {
      for (const s of this.splats) {
        const a = Math.min(1, (s.life - s.t) / 1.5) * 0.6;
        ctx.fillStyle = `${s.c}${a})`;
        ctx.beginPath(); ctx.ellipse(snap(s.x), snap(s.y), s.rx, s.ry, 0, 0, Math.PI * 2); ctx.fill();
      }
      for (const e of this.enemies) if (e.state !== 'dead' && e.AI.drawGround) e.AI.drawGround(ctx, e, snap);
      G.Items.run('drawGround', ctx, this, snap);
      for (const r of this.rings) {
        const k = r.t / r.life;
        ctx.strokeStyle = `rgba(${r.color || '255,120,140'},${1 - k})`; ctx.lineWidth = (r.w || 6) * (1 - k) + 2;
        ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r * (0.5 + k * 0.7), r.r * 0.55 * (0.5 + k * 0.7), 0, 0, Math.PI * 2); ctx.stroke();
      }
    }

    // 立体排序用: 敌人 + 掉落物, 返回 {y, draw}
    drawables(snap) {
      const out = this.enemies.map((e) => ({ y: e.y, draw: (ctx) => this._drawEnemy(ctx, e, snap) }));
      for (const d of this.drops) out.push({ y: d.y, draw: (ctx) => this._drawDrop(ctx, d, snap) });
      return out;
    }

    _drawEnemy(ctx, e, snap) {
      const { f, lift = 0 } = e.AI.frame(e);
      const sr = e.r * 1.05 * (e.air ? Math.max(0.5, 1 - e.z / 240) : 1);
      ctx.fillStyle = 'rgba(8,4,16,0.4)';
      ctx.beginPath(); ctx.ellipse(snap(e.x), snap(e.y), sr, sr * 0.38, 0, 0, Math.PI * 2); ctx.fill();
      const x = snap(e.x - f.w / 2), y = snap(e.y - f.h + 6 - lift);
      if (e.state === 'dead') {
        const k = Math.min(1, e.deathT / 0.45);
        ctx.globalAlpha = 1 - k;
        const h = f.h * (1 - k * 0.7);
        ctx.drawImage(f.img, x - k * 8, snap(e.y + 6 - lift - h), f.w + k * 16, h);
        ctx.drawImage(f.white, x - k * 8, snap(e.y + 6 - lift - h), f.w + k * 16, h);
        ctx.globalAlpha = 1;
        return;
      }
      if (e.spawnT > 0) ctx.globalAlpha = 1 - e.spawnT / 0.5;
      ctx.drawImage(f.img, x, y);
      // 受击闪白: 前 40% 纯白, 之后平滑淡出; 和蓄力预警的闪烁取较强的一个, 不会互相打架
      const F = G.COMBAT.hitfx, fk = e.flash / F.flashTime;
      const flashA = e.flash > 0 ? (fk > 0.6 ? 1 : fk / 0.6) : 0;
      const blinkA = e.blink && Math.floor(e.animT / 0.06) % 2 === 0 ? 0.55 : 0;
      const wa = Math.max(flashA, blinkA);
      if (wa > 0.02) { ctx.globalAlpha = wa; ctx.drawImage(flashA >= blinkA && e.flashTint ? tintFrame(f, e.flashTint) : f.white, x, y); }
      ctx.globalAlpha = 1;
      const top = e.y - f.h + 6 - lift;
      if (e.alertT > 0) {
        const bx = snap(e.x), by = snap(top - 26 - (0.7 - e.alertT) * 10);
        ctx.fillStyle = '#140b1f'; ctx.fillRect(bx - 4, by - 1, 9, 21);
        ctx.fillStyle = '#ffe066'; ctx.fillRect(bx - 2, by + 1, 5, 11); ctx.fillRect(bx - 2, by + 14, 5, 4);
      }
      // 血条: 精英一直显示 (更长 + 名字), 普通怪受击后显示
      const elite = e.type === 'elite';
      if (e.AI.drawOver) e.AI.drawOver(ctx, e, snap, top);
      if (e.AI.screenBar) { G.Items.run('drawEnemy', ctx, e, snap, top); return; }   // Boss 的血条画在屏幕底部
      if (e.hpShowT > 0 || elite) {
        const w = elite ? 90 : 36, bx = snap(e.x - w / 2), by = snap(top - 10);
        ctx.fillStyle = '#140b1f'; ctx.fillRect(bx - 2, by - 2, w + 4, elite ? 10 : 8);
        ctx.fillStyle = '#4a1a2c'; ctx.fillRect(bx, by, w, elite ? 6 : 4);
        if (e.hpLag > e.hp) { ctx.fillStyle = '#fff1d6'; ctx.fillRect(bx, by, Math.round((w * Math.min(e.maxHp, e.hpLag)) / e.maxHp), elite ? 6 : 4); }
        ctx.fillStyle = elite && e.enraged ? '#ff8a3a' : '#ff5a6e'; ctx.fillRect(bx, by, Math.max(0, Math.round((w * e.hp) / e.maxHp)), elite ? 6 : 4);
        if (elite) {
          ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.textAlign = 'center';
          ctx.lineWidth = 3; ctx.strokeStyle = '#140b1f'; ctx.strokeText(e.M.name, snap(e.x), by - 8);
          ctx.fillStyle = '#ffd23f'; ctx.fillText(e.M.name, snap(e.x), by - 8); ctx.textAlign = 'start';
        }
      }
      G.Items.run('drawEnemy', ctx, e, snap, top);   // 流派附加在敌人身上的标记 (例如血债符号)
    }

    _drawDrop(ctx, d, snap) {
      const blink = d.life - d.t < 3 && Math.floor(d.t / 0.12) % 2 === 0;
      if (blink) return;
      const bob = d.z > 0 ? d.z : Math.round(Math.sin(d.t * 5) * 1.5) * 2 + 2;
      const x = snap(d.x), y = snap(d.y - bob), u = 3;
      ctx.fillStyle = 'rgba(8,4,16,0.35)'; ctx.fillRect(x - 6, snap(d.y) - 1, 12, 3);
      if (d.kind === 'item') {
        // 道具: 发光底座 + 像素图标, 更大更显眼
        ctx.fillStyle = 'rgba(232,36,63,0.25)'; ctx.fillRect(x - 15, y - 27, 30, 30);
        G.Items.drawIcon(ctx, d.item, x, y, 4);
      } else if (d.kind === 'soul') {
        // 魂晶: 小菱形
        const rows = [[0, 0], [-1, 1], [-2, 2], [-1, 1], [0, 0]];
        rows.forEach(([a, b], i) => {
          for (let k = a; k <= b; k++) {
            ctx.fillStyle = k === a || k === b || i === 0 || i === 4 ? '#140b1f' : (i < 2 && k <= 0 ? '#efe0ff' : '#b98cff');
            ctx.fillRect(x + k * u - u / 2, y + (i - 4) * u, u, u);
          }
        });
      } else {
        const H = ['.oo.oo.', 'ohhxxxo', 'oxxxxxo', '.oxxxo.', '..oxo..', '...o...'];
        H.forEach((row, j) => [...row].forEach((ch, i) => {
          if (ch === '.') return;
          ctx.fillStyle = ch === 'o' ? '#140b1f' : ch === 'h' ? '#ffb3c0' : '#e2334f';
          ctx.fillRect(x + (i - 3.5) * u, y + (j - 6) * u, u, u);
        }));
      }
    }

    // 顶层: 子弹、敌方投射物、粒子、伤害数字
    drawTop(ctx, snap) {
      for (const b of this.bolts) {
        if (b.shard) {   // 裂变小子弹: 更小, 偏紫, 和主子弹区分
          const x = snap(b.x), y = snap(b.y);
          ctx.fillStyle = 'rgba(185,140,255,0.4)'; ctx.fillRect(x - 6, y - 6, 12, 12);
          ctx.fillStyle = '#d8c2ff'; ctx.fillRect(x - 3, y - 3, 6, 6);
          continue;
        }
        // 配色: 普通 青 / 反弹过 金紫 / 反射弹 猩红 / 贯穿箭 白色长矛
        const pal = b.lance ? ['230,255,255', 'rgba(200,250,255,0.4)', '#e6ffff'] : b.reflected ? ['232,36,90', 'rgba(255,80,120,0.35)', '#ff5a7a']
          : b.bounces ? ['220,170,90', 'rgba(255,210,120,0.35)', '#ffd27a'] : ['63,143,176', 'rgba(126,240,255,0.35)', '#7ef0ff'];
        b.trail.forEach((t, i) => {
          const s = (b.lance ? 12 : 9) - i * (b.lance ? 1.5 : 2); ctx.fillStyle = `rgba(${pal[0]},${0.7 - i * (b.lance ? 0.09 : 0.15)})`;
          ctx.fillRect(snap(t.x) - s / 2, snap(t.y) - s / 2, s, s);
        });
        const x = snap(b.x), y = snap(b.y), big = b.lance ? 3 : 0;
        ctx.fillStyle = pal[1]; ctx.fillRect(x - 9 - big, y - 9 - big, 18 + big * 2, 18 + big * 2);
        ctx.fillStyle = pal[2]; ctx.fillRect(x - 6 - big, y - 6 - big, 12 + big * 2, 12 + big * 2);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 3, y - 3, 6, 6);
      }
      for (const b of this.ebolts) {
        const x = snap(b.x), y = snap(b.y), r = Math.round(b.r / 3) * 3, pulse = Math.floor(b.t * 10) % 2 ? 3 : 0;
        // 地面投影, 帮助判断弹道
        ctx.fillStyle = 'rgba(8,4,16,0.3)'; ctx.fillRect(x - r / 2, snap(b.y + b.h) - 2, r, 4);
        ctx.fillStyle = b.col[0]; ctx.fillRect(x - r - 3 - pulse, y - r - 3 - pulse, (r + 3 + pulse) * 2, (r + 3 + pulse) * 2);
        ctx.fillStyle = b.col[1]; ctx.fillRect(x - r, y - r, r * 2, r * 2);
        ctx.fillStyle = b.col[2]; ctx.fillRect(x - r / 2, y - r / 2, r, r);
      }
      // 命中闪光: 像素十字, 2 帧由大到小
      for (const im of this.impacts) {
        const k = im.t / im.life, u = 3, n = (k < 0.5 ? 3 : 2) + (im.big ? 1 : 0);
        const x = snap(im.x), y = snap(im.y);
        ctx.fillStyle = k < 0.5 ? '#ffffff' : '#bff8ff';
        ctx.fillRect(x - u * n, y - u / 2, u * n * 2, u); ctx.fillRect(x - u / 2, y - u * n, u, u * n * 2);
        if (k < 0.5) { ctx.fillStyle = 'rgba(126,240,255,0.5)'; ctx.fillRect(x - u * 1.5, y - u * 1.5, u * 3, u * 3); }
      }
      for (const q of this.parts) {
        ctx.globalAlpha = Math.max(0, 1 - q.t / q.life);
        ctx.fillStyle = q.c; ctx.fillRect(snap(q.x - q.s / 2), snap(q.y - q.z - q.s / 2), q.s, q.s);
      }
      ctx.globalAlpha = 1;
      G.Items.run('drawTop', ctx, snap);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 4; ctx.strokeStyle = '#140b1f';
      for (const t of this.texts) {
        const k = t.t / 0.8, y = t.y - k * 28;
        // 新数字 / 合并后的数字放大一下再回落
        ctx.font = `bold ${Math.round(20 + t.pop * 8)}px ui-monospace, Menlo, Consolas, monospace`;
        ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
        ctx.strokeText(t.str, snap(t.x), snap(y)); ctx.fillStyle = t.color; ctx.fillText(t.str, snap(t.x), snap(y));
      }
      ctx.globalAlpha = 1; ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
    }

    // 给光照系统用的光源
    lights() {
      const out = [];
      for (const b of this.bolts) out.push({ x: b.x, y: b.y, r: b.shard ? 45 : 95, a: 0.9, color: b.shard ? '185,140,255' : '90,220,255' });
      for (const b of this.ebolts) out.push({ x: b.x, y: b.y, r: 80, a: 0.8, color: b.col[3] });
      for (const e of this.enemies) {
        if (e.state === 'dead' || !e.AI.light) continue;
        const L = e.AI.light(e);
        out.push({ x: e.x, y: e.y - 14 + (L.oy || 0), r: L.r, a: 0.55, color: L.color });
      }
      for (const d of this.drops) out.push({ x: d.x, y: d.y - 8, r: d.kind === 'item' ? 80 : 40, a: 0.5, color: d.kind === 'soul' ? '185,140,255' : '255,100,130' });
      for (const L of G.Items.lights(this)) out.push(L);
      return out;
    }

    aliveCount() { return this.enemies.filter((e) => e.state !== 'dead').length; }
  }

  // 受击变色剪影 (由白色剪影着色生成, 每帧只生成一次并缓存在帧对象上)
  const TINTS = { crimson: '#ff2a48', soul: '#a8f0ff', void: '#c38bff' };
  function tintFrame(f, name) {
    const key = '_' + name;
    if (!f[key]) {
      const c = document.createElement('canvas'); c.width = f.white.width; c.height = f.white.height;
      const g = c.getContext('2d'); g.drawImage(f.white, 0, 0);
      g.globalCompositeOperation = 'source-in'; g.fillStyle = TINTS[name] || '#ffffff'; g.fillRect(0, 0, c.width, c.height);
      f[key] = c;
    }
    return f[key];
  }

  function segDist(x0, y0, x1, y1, px, py) {
    const vx = x1 - x0, vy = y1 - y0, l2 = vx * vx + vy * vy;
    let t = l2 ? ((px - x0) * vx + (py - y0) * vy) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(x0 + vx * t - px, y0 + vy * t - py);
  }

  G.Combat = Combat;
  // 调试用 (浏览器控制台): G.debugSpawn('elite') 在玩家附近生成一只怪物
  G.debugSpawn = (type) => { const S = G.SceneTest, p = S.player; return S.combat.spawn(type, p.x + 220, p.y); };
})();

</script>
  <script>
// 构筑流派: 猩红债主
// 核心循环: 血债 (命中概率打上血债) -> 血偿 (带血债的敌人死亡时爆发范围伤害)
//          -> 猩红锁链 (爆发命中的敌人概率被传染血债) -> 它们死后继续爆发, 连锁清场
//
// 结构 (接入通用道具系统 js/items.js):
//   - 三件道具用 G.Items.define() 登记, 各自只监听一个战斗事件:
//       血债 -> beforeHit (子弹命中, 伤害前)   血偿 -> kill (敌人死亡)   猩红锁链 -> aoeHit (爆发命中, 伤害前)
//   - 本文件的 G.Crimson 是流派的"运行时": 血债状态、爆发队列、连锁计数、特效绘制, 用 G.Items.registerSystem() 注册
//   - 伤害全部走现有接口: combat.areaDamage() -> combat.hurtEnemy() -> combat.killEnemy()
//   - 数值全部在 js/config.js 的 G.CRIMSON
//
// 防止重复结算 / 无限递归:
//   1) killEnemy() 对每个敌人只执行一次 (e._killed), 血债另用 e.debtSettled 再保险一次
//   2) 爆发不在死亡时立刻递归结算, 而是放进队列, 由 update() 按时间逐个处理 (每帧有上限)
//   3) 每轮连锁有独立记录: 爆发次数上限 chainMaxBursts、传播代数上限 chainMaxDepth
//   4) 道具事件本身也有嵌套深度上限 (见 items.js)
(function () {
  const rand = (a, b) => a + Math.random() * (b - a);
  const RED = '#e8243f', RED_L = '#ff6a7a', RED_D = '#7a0f22';
  const SOURCE = 'crimsonBurst';   // 血债爆发的伤害来源标记

  const CR = G.Crimson = {
    queue: [],        // 待结算的爆发 {x, y, chain, depth, t}
    chains: {},       // 每轮连锁的计数 {id: {bursts, spreads, maxDepth, label, age}}
    tethers: [],      // 传播轨迹特效 (猩红能量从爆发点划向被传染的敌人)
    fx: [],           // 爆发特效 (引爆闪光 / 喷发 / 断裂冲击波 / 碎片 / 光线 / 残烬)
    hits: [],         // 被爆发命中的敌人的受击特效
    nextChain: 1,
    stats: { marks: 0, bursts: 0, spreads: 0, longestChain: 0, capped: 0 },

    // clearAll = 新的一局 (统计也清零)
    reset(clearAll) {
      this.queue = []; this.chains = {}; this.tethers = []; this.fx = []; this.hits = [];
      if (clearAll) this.stats = { marks: 0, bursts: 0, spreads: 0, longestChain: 0, capped: 0 };
    },

    // 兼容旧的调试入口
    grantAll() { G.Items.grantSet('crimson'); },
    get owned() { return { bullet: G.Items.has('bullet'), mask: G.Items.has('mask'), chain: G.Items.has('chain') }; },

    // ---------- 标记 ----------
    newChain() {
      const id = this.nextChain++;
      this.chains[id] = { bursts: 0, spreads: 0, maxDepth: 0, label: null, age: 0 };
      return id;
    },
    // 已有血债的敌人不会叠层, 只刷新持续时间
    mark(cb, e, chainId, depth) {
      if (e.state === 'dead') return false;
      if (e.debt) { e.debt.t = G.CRIMSON.markDuration; return false; }
      e.debt = { chain: chainId, depth, t: G.CRIMSON.markDuration, born: 0 };
      this.stats.marks++;
      cb.puff(e.x, e.y - e.AI.hitH, RED, 4);
      if (G.Sfx) G.Sfx.play('mark');
      return true;
    },

    // 带血债的敌人死亡 -> 排队爆发 (由"血偿"的 kill 事件调用)
    queueBurst(cb, e) {
      if (!e.debt || e.debtSettled) return false;
      e.debtSettled = true;
      const C = G.CRIMSON, ch = this.chains[e.debt.chain];
      if (!ch) return false;
      if (ch.bursts >= C.chainMaxBursts) { this.stats.capped++; return false; }   // 本轮连锁已达上限
      ch.bursts++;   // 入队即占名额, 保证上限严格生效
      // 同一代的爆发错开一点点时间, 连锁读起来是一节一节传出去的
      this.queue.push({ x: e.x, y: e.y, chain: e.debt.chain, depth: e.debt.depth, t: e.debt.depth === 0 ? C.burstDelay * 0.5 : C.burstDelay + Math.random() * 0.1 });
      return true;
    },

    // 爆发命中的敌人 -> 传染血债 (由"猩红锁链"的 aoeHit 事件调用)
    spread(cb, e, meta) {
      const C = G.CRIMSON, ch = this.chains[meta.chain];
      if (!ch || e.debt || meta.depth + 1 > C.chainMaxDepth || ch.bursts >= C.chainMaxBursts) return false;
      if (Math.random() >= C.spreadChance) return false;
      if (!this.mark(cb, e, meta.chain, meta.depth + 1)) return false;
      ch.spreads++; this.stats.spreads++;
      if (this.tethers.length < 24) this.tethers.push(this._makeTether(meta.x, meta.y - 14, e));
      return true;
    },

    // ---------- 每帧更新 ----------
    update(cb, dt) {
      const C = G.CRIMSON;
      // 标记计时 (到期消失)
      for (const e of cb.enemies) {
        if (!e.debt || e.state === 'dead') continue;
        e.debt.t -= dt; e.debt.born += dt;
        if (e.debt.t <= 0) e.debt = null;
      }
      // 爆发队列: 到时间的按顺序结算, 每帧有上限, 多余的顺延
      let done = 0;
      for (const b of this.queue) b.t -= dt;
      this.queue.sort((a, b) => a.t - b.t);
      while (this.queue.length && this.queue[0].t <= 0 && done < C.maxBurstsPerFrame) {
        this.burst(cb, this.queue.shift());
        done++;
      }
      for (const t of this.tethers) t.t += dt;
      this.tethers = this.tethers.filter((t) => t.t < t.life);
      for (const f of this.fx) {
        f.t += dt;
        // 第 4 阶段 碎裂消散: 冲击波快结束时撒出少量向上飘散的残烬 (走全局粒子预算)
        if (!f.embers && f.t > 0.16) { f.embers = true; this._embers(cb, f); }
      }
      this.fx = this.fx.filter((f) => f.t < f.life);
      for (const h of this.hits) h.t += dt;
      this.hits = this.hits.filter((h) => h.t < h.life && h.e);
      // 清理已经结束的连锁记录
      for (const id in this.chains) {
        const ch = this.chains[id]; ch.age += dt;
        if (ch.age > 12 && !this.queue.some((q) => q.chain == id)) delete this.chains[id];
      }
    },

    // 一次猩红爆发: 范围伤害 + (有锁链时) 传播血债
    burst(cb, b) {
      const C = G.CRIMSON, ch = this.chains[b.chain] || { bursts: 1, spreads: 0, maxDepth: 0 };
      const amp = 1 + Math.min(C.escalateMax, b.depth * C.escalatePerDepth);   // 连锁越深越强 (仅表现)
      const R = C.burstRadius;
      this.stats.bursts++;
      ch.maxDepth = Math.max(ch.maxDepth, b.depth);
      this.stats.longestChain = Math.max(this.stats.longestChain, ch.bursts);

      // 表现: 生成一组多阶段爆发特效 (见 _makeBurstFx), 震屏 + 分层音效; 都随连锁深度增强但有上限
      if (this.fx.length >= 14) this.fx.shift();   // 同屏爆发特效上限, 最旧的先结束
      this.fx.push(this._makeBurstFx(b.x, b.y, R, amp, b.depth));
      cb.scene.shake = Math.max(cb.scene.shake, Math.min(9, 4 + b.depth * 1.2));
      if (G.Sfx) G.Sfx.play('burst', { pitch: Math.max(0.6, 1 - b.depth * 0.07), layers: Math.min(3, 1 + Math.floor(b.depth / 2)) });
      // 连锁计数文字: 同一轮连锁只用一个文字, 不断刷新
      if (ch.bursts >= 2) {
        const str = `连锁 ×${ch.bursts}`;
        if (ch.label && cb.texts.includes(ch.label)) { ch.label.str = str; ch.label.x = b.x; ch.label.y = b.y - 70; ch.label.t = 0; ch.label.pop = 1; }
        else ch.label = cb.text(b.x, b.y - 70, str, RED_L);
      }

      // 结算: 走通用范围伤害。每个目标先派发 aoeHit 事件 (猩红锁链在这里传染血债, 所以被这次爆发炸死的敌人也会继续爆发),
      // 再走 hurtEnemy (击退/硬直/伤害数字照旧, 闪白换成闪红)
      cb.areaDamage(b.x, b.y, R, C.burstDamage, {
        source: SOURCE, meta: { chain: b.chain, depth: b.depth, x: b.x, y: b.y },
        knockback: C.burstKnockback, tint: 'crimson', textColor: '#ff5a6e',
        onHit: (e, dx, dy) => { if (this.hits.length < 40) this.hits.push({ e, t: 0, life: 0.24, dx, dy, amp }); },
      });
      // 道具事件: 爆炸结算完成 (例如回响在这里积累能量 / 额外触发一次)
      G.Items.emit('explode', { cb, kind: 'crimson', x: b.x, y: b.y, radius: R, dmg: C.burstDamage, echo: false,
        replay: (scale) => this.echoBurst(cb, b, scale) });
    },

    // 回响副本: 在同一位置再爆一次, 伤害按 scale 缩放; 不占连锁名额、不传播血债 (meta 为空, 猩红锁链不会响应)
    echoBurst(cb, b, scale) {
      const C = G.CRIMSON, R = C.burstRadius, amp = 0.85;
      if (this.fx.length >= 14) this.fx.shift();
      this.fx.push(this._makeBurstFx(b.x, b.y, R, amp, 0));
      cb.scene.shake = Math.max(cb.scene.shake, 4);
      if (G.Sfx) G.Sfx.play('burst', { pitch: 1.15, layers: 1 });
      cb.areaDamage(b.x, b.y, R, C.burstDamage * scale, {
        source: SOURCE, meta: null, knockback: C.burstKnockback * 0.6, tint: 'crimson', textColor: '#ff9aa8',
        onHit: (e, dx, dy) => { if (this.hits.length < 40) this.hits.push({ e, t: 0, life: 0.24, dx, dy, amp }); },
      });
      G.Items.emit('explode', { cb, kind: 'crimson', x: b.x, y: b.y, radius: R, dmg: C.burstDamage * scale, echo: true });
    },

    // ---------- 爆发特效 ----------
    // 一次爆发由 4 个短阶段组成 (总长约 0.5 秒, 不留持续光圈):
    //   ① 引爆 0~0.12s : 敌人身体位置一次白→红的像素闪光 + 向四周喷射的血线 (身体高度)
    //   ② 冲击 0.02~0.32s: 地面上 不规则、断裂的猩红弧段 由内向外扩散并逐渐碎开; 同时 尖锐碎片 沿地面射出, 径向光线一闪而过
    //   ③ 命中 : 被波及的敌人闪红 + 脚下受击圈 + 背向爆心的血线 (见 hits)
    //   ④ 消散 0.16s 起: 少量残烬向上飘散后消失
    // 所有地面部分按俯视角压扁 (y × 0.55), 画在角色下面; 身体高度的部分很短, 不遮挡角色
    _makeBurstFx(x, y, R, amp, depth) {
      const rr = R * amp, arcs = [], shards = [], rays = [], jets = [];
      // 断裂弧段: 绕一圈随机切成若干段, 每段半径略有偏差 -> 不规则边缘
      let a = rand(0, Math.PI * 2);
      const end = a + Math.PI * 2;
      while (a < end - 0.2) {
        const span = rand(0.22, 0.55), gap = rand(0.08, 0.3);
        arcs.push({ a0: a, a1: Math.min(end, a + span), off: rand(-0.08, 0.08), lag: rand(0, 0.04) });
        a += span + gap;
      }
      const nShard = 9 + Math.min(8, depth * 2);
      for (let i = 0; i < nShard; i++) shards.push({ a: (i / nShard) * Math.PI * 2 + rand(-0.2, 0.2), d: rand(0.75, 1.15), s: Math.random() < 0.35 ? 9 : 6 });
      const nRay = 6 + Math.min(4, depth);
      for (let i = 0; i < nRay; i++) rays.push({ a: (i / nRay) * Math.PI * 2 + rand(-0.25, 0.25), len: rand(0.55, 1.0) });
      for (let i = 0; i < 8; i++) jets.push({ a: (i / 8) * Math.PI * 2 + rand(-0.3, 0.3), sp: rand(380, 560) * amp });
      return { x, y, cy: y - 14, R: rr, amp, depth, t: 0, life: 0.5, arcs, shards, rays, jets, embers: false, thick: depth >= 2 ? 15 : 12 };
    },

    _embers(cb, f) {
      const n = 6 + Math.min(6, f.depth * 2);
      for (let i = 0; i < n; i++) {
        const a = rand(0, Math.PI * 2), r = rand(0.3, 0.9) * f.R;
        cb.addPart({ x: f.x + Math.cos(a) * r, y: f.y + Math.sin(a) * r * 0.55, z: rand(2, 10), vx: Math.cos(a) * rand(10, 40), vy: Math.sin(a) * rand(5, 20),
          vz: rand(40, 110), g: -30, life: rand(0.22, 0.4), t: 0, c: i % 3 ? RED_D : RED, s: 3 });
      }
    },

    // 传播轨迹: 一道带折线的猩红能量从爆发点快速划向目标 (0.1 秒到达), 之后尾巴追上头部收束到目标身上
    _makeTether(x0, y0, e) {
      const pts = [];
      for (let i = 1; i <= 4; i++) pts.push({ k: i / 5, off: rand(-10, 10) });
      return { x0, y0, e, t: 0, life: 0.3, travel: 0.1, pts };
    },

    // ---------- 绘制 ----------
    // 地面层 (角色下面): 血债光圈 + 爆发的冲击波/碎片/光线 + 受击圈
    drawGround(ctx, cb, snap) {
      const now = performance.now() / 1000;
      for (const e of cb.enemies) {
        if (!e.debt || e.state === 'dead') continue;
        const pulse = 0.5 + Math.sin(now * 7 + e.id) * 0.5, fade = Math.min(1, e.debt.t / 1.5);
        const rx = e.r + 8 + pulse * 3;
        ctx.strokeStyle = `rgba(232,36,63,${(0.45 + pulse * 0.35) * fade})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(snap(e.x), snap(e.y), rx, rx * 0.42, 0, 0, Math.PI * 2); ctx.stroke();
      }
      const sq = (x, y, s) => ctx.fillRect(snap(x) - s / 2, snap(y) - s / 2, s, s);
      for (const f of this.fx) {
        const t = f.t;
        // 爆心焦痕: 很小、很快淡掉
        if (t < 0.4) {
          ctx.globalAlpha = (1 - t / 0.4) * 0.55; ctx.fillStyle = '#3a0612';
          ctx.beginPath(); ctx.ellipse(snap(f.x), snap(f.y), f.R * 0.22, f.R * 0.12, 0, 0, Math.PI * 2); ctx.fill();
        }
        // 径向光线: 0~0.14s 一闪而过, 从爆心射向外圈
        if (t < 0.14) {
          const k = t / 0.14, a = 1 - k;
          ctx.globalAlpha = a * 0.9;
          for (const r of f.rays) {
            const r0 = f.R * 0.15, r1 = f.R * r.len * Math.min(1, 0.4 + k * 1.6);
            for (let d = r0; d < r1; d += 5) {
              ctx.fillStyle = d > r1 - 12 ? '#ffffff' : k < 0.4 ? '#ffb3bf' : RED_L;   // 光线尖端最亮
              sq(f.x + Math.cos(r.a) * d, f.y + Math.sin(r.a) * d * 0.55, d > r1 - 12 ? 6 : 3);
            }
          }
        }
        // 断裂冲击波: 0.02~0.32s, easeOutCubic 扩散, 越往外越细, 弧段两端逐渐收缩 -> 碎开
        const p = (t - 0.02) / 0.3;
        if (p > 0 && p < 1) {
          const e = 1 - Math.pow(1 - p, 3);
          const thick = Math.max(6, Math.round((f.thick * (1 - 0.6 * p)) / 3) * 3);
          const alpha = p < 0.55 ? 1 : 1 - (p - 0.55) / 0.45;
          // 每条弧段 3 遍: 深色描边 (在紫色地面上拉开对比) -> 猩红主体 -> 外沿亮边
          for (let pass = 0; pass < 3; pass++) {
            ctx.globalAlpha = pass === 0 ? alpha * 0.7 : alpha;
            ctx.fillStyle = pass === 0 ? '#22030d' : pass === 1 ? (p < 0.3 ? RED_L : RED) : (p < 0.4 ? '#ffffff' : '#ffc2cb');
            for (const arc of f.arcs) {
              const pp = Math.max(0, p - arc.lag);
              const r = f.R * (0.22 + 0.78 * (1 - Math.pow(1 - pp, 3))) * (1 + arc.off);
              const shrink = (arc.a1 - arc.a0) * 0.42 * p;            // 弧段两端收缩 -> 冲击波逐渐碎开
              const a0 = arc.a0 + shrink, a1 = arc.a1 - shrink;
              const size = pass === 0 ? thick + 6 : pass === 1 ? thick : 3;
              const rr = pass === 2 ? r + thick * 0.5 : r;
              const step = Math.max(0.02, (size * 0.6) / rr);
              for (let aa = a0; aa <= a1; aa += step) sq(f.x + Math.cos(aa) * rr, f.y + Math.sin(aa) * rr * 0.55, size);
            }
          }
          void e;
        }
        // 尖锐碎片: 沿地面射出, 尖端亮、尾部暗, 指向运动方向
        if (t < 0.34) {
          const k = t / 0.34, d = 1 - Math.pow(1 - k, 2.2);
          ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
          for (const sh of f.shards) {
            const dist = f.R * sh.d * (0.1 + 0.95 * d), cx = Math.cos(sh.a), cy = Math.sin(sh.a) * 0.55;
            const x = f.x + cx * dist, y = f.y + cy * dist;
            ctx.fillStyle = '#22030d'; sq(x - cx * sh.s * 1.2, y - cy * sh.s * 1.2, sh.s + 6);       // 描边
            ctx.fillStyle = '#ffffff'; sq(x, y, sh.s);                                                 // 尖端
            ctx.fillStyle = RED_L; sq(x - cx * sh.s * 1.1, y - cy * sh.s * 1.1, sh.s);
            ctx.fillStyle = RED; sq(x - cx * sh.s * 2.2, y - cy * sh.s * 2.2, Math.max(3, sh.s - 3));
          }
        }
      }
      // 受击圈: 被波及的敌人脚下一圈快速扩散的猩红像素圈
      for (const h of this.hits) {
        const e = h.e; if (!e) continue;
        const k = h.t / h.life, r = e.r + 6 + k * 14;
        ctx.globalAlpha = 1 - k; ctx.fillStyle = RED_L;
        const step = 6 / r;
        for (let a = 0; a < Math.PI * 2; a += step) if (Math.floor(a / step) % 3 !== 2) sq(e.x + Math.cos(a) * r, e.y + Math.sin(a) * r * 0.45, 3);
      }
      ctx.globalAlpha = 1;
    },

    // 头顶的血债符号: 像素倒三角 + 中心血滴, 上下浮动; 快到期时闪烁
    drawEnemy(ctx, e, snap, top) {
      if (!e.debt || e.state === 'dead') return;
      const d = e.debt;
      if (d.t < 1.5 && Math.floor(d.t * 8) % 2 === 0) return;
      const u = 3, bob = Math.round(Math.sin(d.born * 5) * 1.5) * u;
      const pop = d.born < 0.18 ? 1 + (0.18 - d.born) * 4 : 1;   // 刚打上时放大一下
      const cx = snap(e.x), cy = snap(top - 34 - (e.type === 'elite' ? 18 : 0) + bob);   // 在血条和伤害数字上方, 不互相遮挡
      const rows = ['ooooooo', 'orrrrro', '.orwro.', '.orrro.', '..oro..', '...o...'];
      const s = u * pop;
      rows.forEach((row, j) => [...row].forEach((ch, i) => {
        if (ch === '.') return;
        ctx.fillStyle = ch === 'o' ? '#2a0410' : ch === 'w' ? '#ffd0d6' : RED;
        ctx.fillRect(cx + (i - 3.5) * s, cy + (j - 3) * s, s, s);
      }));
    },

    // 身体高度 (角色上面, 时间都很短): 传播轨迹、引爆闪光、喷射血线、受击血线
    drawTop(ctx, snap) {
      const sq = (x, y, s) => ctx.fillRect(snap(x) - s / 2, snap(y) - s / 2, s, s);
      // 传播轨迹
      for (const tr of this.tethers) {
        const e = tr.e, x1 = e.x, y1 = e.y - e.AI.hitH;
        const head = Math.min(1, tr.t / tr.travel);                              // 头部位置 0~1
        const tail = tr.t < tr.travel ? Math.max(0, head - 0.55) : Math.min(1, (tr.t - tr.travel) / (tr.life - tr.travel)); // 尾部追上
        const nx = -(y1 - tr.y0), ny = x1 - tr.x0, nl = Math.hypot(nx, ny) || 1;
        const P = (k) => {   // 折线上的点 (带锯齿偏移, 两端为 0)
          let off = 0;
          for (let i = 0; i < tr.pts.length; i++) {
            const a = tr.pts[i], b0 = i ? tr.pts[i - 1] : { k: 0, off: 0 }, b1 = tr.pts[i + 1] || { k: 1, off: 0 };
            if (k <= a.k) { off = b0.off + (a.off - b0.off) * ((k - b0.k) / (a.k - b0.k)); break; }
            if (!tr.pts[i + 1]) off = a.off + (0 - a.off) * ((k - a.k) / (1 - a.k));
          }

    },

  <script>
// 四件通用道具: 裂变 / 引魂灯 / 奇点 / 回响
//
// 全部基于现有道具事件系统 (js/items.js), 不修改战斗核心:
//   裂变  -> hit 事件      : 普通子弹命中后用 combat.fireBolt() 生成小子弹 (小子弹仍是玩家子弹, 会触发 beforeHit/hit/kill 等其他道具)

//   奇点  -> kill 事件     : 生成奇点; 吸引用 combat._move() (走正常碰撞), 爆炸走 combat.areaDamage() (来源 'singularity')
//   回响  -> explode 事件  : 任何道具爆炸 (血债爆发 / 幽魂 / 奇点) 结算后积累能量, 满了让下一次爆炸调用 replay() 额外触发一次
// 数值全部在 js/config.js 的 G.RELIC。
//
// 防止无限连锁 / 重复结算:
//   - 小子弹带 shard 标记, 裂变不会响应小子弹 -> 不会二次分裂; 小子弹有射程、存在时间、场上数量上限
//   - 幽魂炸死的敌人 (来源 'ghost') 不会再生成幽魂; 幽魂有数量上限和存在时间
//   - 奇点炸死的敌人 (来源 'singularity') 不会再生成奇点; 同时存在的奇点有上限
//   - 回响副本带 echo 标记: 不积累能量、不会再触发回响; 副本延迟执行 (队列), 不在事件里递归
//   - 敌人死亡本身只结算一次 (combat.killEnemy)
(function () {
  const rand = (a, b) => a + Math.random() * (b - a);
  const RC = () => G.RELIC;
  const SOUL = '#a8f0ff', SOUL_D = '#2e6f8a', VOID = '#c38bff', VOID_D = '#2a0a44';

  let NEXT = 1;
  const R = G.Relics = {
    ghosts: [],       // 幽魂 {id, x, y(地面), h(离地高度), vx, vy, t, trail}
    sings: [],        // 奇点 {id, x, y, t}
    fx: [],           // 爆炸特效 {kind, x, y, r, t, life, echo}
    echoQueue: [],    // 回响副本 {t, fn}
    energy: 0, armed: false,
    stats: { shards: 0, ghosts: 0, ghostBlasts: 0, sings: 0, singBlasts: 0, pulledHits: 0, echoes: 0, energyGained: 0 },

    reset(clearAll) {
      this.ghosts = []; this.sings = []; this.fx = []; this.echoQueue = [];
      if (clearAll) {
        this.energy = 0; this.armed = false;
        for (const k in this.stats) this.stats[k] = 0;
      }
    },

    // ---------- 引魂灯: 幽魂 ----------
    spawnGhost(x, y) {
      if (this.ghosts.length >= RC().lantern.maxGhosts) return false;
      this.ghosts.push({ id: NEXT++, x, y, h: 26, vx: rand(-60, 60), vy: rand(-80, -30), t: 0, trail: [] });
      this.stats.ghosts++;
      return true;
    },
    ghostBlast(cb, x, y, scale, echo) {
      const L = RC().lantern;
      this.stats.ghostBlasts++;
      this.fx.push({ kind: 'ghost', x, y, r: L.blastRadius, t: 0, life: 0.35, echo });
      for (let i = 0; i < 10; i++) {
        const a = rand(0, Math.PI * 2), sp = rand(80, 200);
        cb.addPart({ x, y: y - 20, z: rand(0, 10), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, vz: rand(40, 120), g: 200, life: rand(0.25, 0.45), t: 0, c: i % 2 ? SOUL : '#ffffff', s: 3 });
      }
      if (G.Sfx) G.Sfx.play('hit', { pitch: 1.6 });
      cb.areaDamage(x, y, L.blastRadius, L.damage * scale, {
        source: 'ghost', knockback: L.knockback * scale, tint: 'soul', textColor: SOUL,
        onHit: (e) => { if (e.pulledT > 0) this.stats.pulledHits++; },   // 统计: 幽魂炸到了正被奇点吸引的敌人
      });
      G.Items.emit('explode', { cb, kind: 'ghost', x, y, radius: L.blastRadius, dmg: L.damage * scale, echo: !!echo,

    },

    // ---------- 奇点 ----------
    spawnSing(x, y) {

    },
    singBlast(cb, x, y, scale, echo) {
      const S = RC().singularity;
      this.stats.singBlasts++;
      this.fx.push({ kind: 'sing', x, y, r: S.blastRadius, t: 0, life: 0.4, echo });
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * Math.PI * 2, sp = rand(160, 300);
        cb.addPart({ x, y: y - 10, z: rand(0, 8), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.55, vz: rand(30, 100), g: 400, life: rand(0.25, 0.4), t: 0, c: i % 3 ? VOID : '#ffffff', s: i % 4 ? 3 : 6 });
      }
      cb.scene.shake = Math.max(cb.scene.shake, 6);
      if (G.Sfx) G.Sfx.play('burst', { pitch: 1.3, layers: 1 });
      cb.areaDamage(x, y, S.blastRadius, S.damage * scale, { source: 'singularity', knockback: S.knockback * scale, tint: 'void', textColor: VOID });
      G.Items.emit('explode', { cb, kind: 'singularity', x, y, radius: S.blastRadius, dmg: S.damage * scale, echo: !!echo,
        replay: echo ? null : (s) => this.singBlast(cb, x, y, s, true) });
    },

    // ---------- 每帧更新 ----------
    update(cb, dt) {
      const L = RC().lantern, S = RC().singularity;
      // 幽魂: 追最近的敌人, 碰到就自爆; 没有目标时漂浮, 超时消散
      for (const g of this.ghosts) {
        g.t += dt;
        g.trail.unshift({ x: g.x, y: g.y - g.h }); if (g.trail.length > 6) g.trail.pop();
        let best = null, bd = L.seekRadius;
        for (const e of cb.enemies) {
          if (e.state === 'dead' || e.air || e.spawnT > 0) continue;
          const d = Math.hypot(e.x - g.x, e.y - g.y);
          if (d < bd) { bd = d; best = e; }
        }
        if (best) {
          const dx = best.x - g.x, dy = best.y - g.y, l = Math.hypot(dx, dy) || 1;
          const k = Math.min(1, dt * 6);   // 平滑转向
          g.vx += ((dx / l) * L.speed - g.vx) * k; g.vy += ((dy / l) * L.speed - g.vy) * k;
          if (l < best.r + 12) { g.dead = true; this.ghostBlast(cb, g.x, g.y, 1, false); continue; }
        } else { g.vx *= Math.exp(-dt * 2); g.vy *= Math.exp(-dt * 2); }
        g.x += g.vx * dt; g.y += g.vy * dt;   // 幽魂穿墙飞行
        if (g.t > L.life) { g.dead = true; cb.puff(g.x, g.y - g.h, SOUL, 4); }
      }
      this.ghosts = this.ghosts.filter((g) => !g.dead);

      // 奇点: 吸引周围敌人 (精英减弱, Boss 免疫), 到时间爆炸
      for (const s of this.sings) {
        s.t += dt;
        for (const e of cb.enemies) {
          if (e.state === 'dead' || e.air || e.spawnT > 0) continue;
          const dx = s.x - e.x, dy = s.y - e.y, d = Math.hypot(dx, dy);
          if (d > S.pullRadius || d < 6) continue;
          const f = e.M.boss ? S.bossFactor : e.type === 'elite' ? S.eliteFactor : 1;
          if (f <= 0) continue;
          const sp = S.pullSpeed * f * (0.45 + 0.55 * (1 - d / S.pullRadius));
          cb._move(e, (dx / d) * sp * dt, (dy / d) * sp * dt);   // 走正常碰撞, 不会被拉进墙里
          e.pulledT = 0.15;
        }
        if (s.t >= S.pullTime) { s.dead = true; this.singBlast(cb, s.x, s.y, 1, false); }
      }
      this.sings = this.sings.filter((s) => !s.dead);
      for (const e of cb.enemies) if (e.pulledT > 0) e.pulledT -= dt;

      // 回响副本 (延迟执行)
      for (const q of this.echoQueue) q.t -= dt;
      const due = this.echoQueue.filter((q) => q.t <= 0);
      this.echoQueue = this.echoQueue.filter((q) => q.t > 0);
      for (const q of due) q.fn();

      for (const f of this.fx) f.t += dt;
      this.fx = this.fx.filter((f) => f.t < f.life);
    },

    // ---------- 绘制 ----------
    drawGround(ctx, cb, snap) {
      const sq = (x, y, s) => ctx.fillRect(snap(x) - s / 2, snap(y) - s / 2, s, s);
      const S = RC().singularity, now = performance.now() / 1000;
      for (const s of this.sings) {
        const k = s.t / S.pullTime;

        const rr = S.pullRadius * (1 - 0.25 * k), n = 36;
        for (let i = 0; i < n; i += 2) { const a = (i / n) * Math.PI * 2 + now * 1.5; sq(s.x + Math.cos(a) * rr, s.y + Math.sin(a) * rr * 0.55, 3); }
        // 螺旋吸入的粒子

          ctx.fillStyle = i % 3 ? VOID : '#ffffff'; sq(s.x + Math.cos(a) * r, s.y + Math.sin(a) * r * 0.55, 3);
        }

      }
      // 爆炸冲击 (地面, 不规则像素圈)
      for (const f of this.fx) {
        const k = f.t / f.life, r = f.r * (0.3 + 0.7 * (1 - Math.pow(1 - k, 3)));
        ctx.globalAlpha = (1 - k) * (f.echo ? 0.7 : 1);
        const col = f.kind === 'ghost' ? SOUL : VOID, step = 7 / r;
        for (let a = 0; a < Math.PI * 2; a += step) {
          if (Math.floor(a / step) % 4 === 3) continue;   // 断开, 不是完整圆环
          ctx.fillStyle = '#140b1f'; sq(f.x + Math.cos(a) * r, f.y + Math.sin(a) * r * 0.55, 9);
          ctx.fillStyle = col; sq(f.x + Math.cos(a) * r, f.y + Math.sin(a) * r * 0.55, 6);
        }
        if (f.echo && k < 0.6) {   // 回响副本: 外圈多一道淡白色残影
          ctx.fillStyle = '#ffffff';
          for (let a = 0; a < Math.PI * 2; a += step * 3) sq(f.x + Math.cos(a) * (r + 10), f.y + Math.sin(a) * (r + 10) * 0.55, 3);
        }
      }
      ctx.globalAlpha = 1;
    },

    drawTop(ctx, snap) {
      const sq = (x, y, s) => ctx.fillRect(snap(x) - s / 2, snap(y) - s / 2, s, s);
      for (const g of this.ghosts) {
        const fade = Math.min(1, (RC().lantern.life - g.t) / 0.6), bob = Math.round(Math.sin(g.t * 6) * 1) * 3;
        g.trail.forEach((p, i) => { ctx.globalAlpha = (0.5 - i * 0.08) * fade; ctx.fillStyle = SOUL; sq(p.x, p.y + bob, 6 - Math.min(3, i)); });
        ctx.globalAlpha = fade;
        const x = g.x, y = g.y - g.h + bob;
        ctx.fillStyle = SOUL_D; sq(x, y, 24); sq(x, y + 12, 15);
        ctx.fillStyle = SOUL; sq(x, y, 18); sq(x, y + 10, 9);
        ctx.fillStyle = '#ffffff'; sq(x - 3, y - 3, 9);
        ctx.fillStyle = '#12304a'; sq(x - 4, y + 1, 3); sq(x + 4, y + 1, 3);   // 眼睛
      }

      const S = RC().singularity, now = performance.now() / 1000;
      for (const s of this.sings) {

      }

        ctx.globalAlpha = 1 - k; ctx.fillStyle = k < 0.5 ? '#ffffff' : f.kind === 'ghost' ? SOUL : VOID;
        ctx.fillRect(snap(f.x) - r, snap(f.y - 20) - 3, r * 2, 6); ctx.fillRect(snap(f.x) - 3, snap(f.y - 20) - r, 6, r * 2);

    lights() {
      const out = [];

      for (const s of this.sings) out.push({ x: s.x, y: s.y - 10, r: 120, a: 0.6, color: '180,120,255' });
      for (const f of this.fx) if (f.t < 0.2) out.push({ x: f.x, y: f.y - 20, r: f.r * 1.2, a: 0.8, color: f.kind === 'ghost' ? '150,230,255' : '180,120,255' });

    },
  };
  G.Items.registerSystem(R);

  // ---------------- 道具定义 ----------------
  const pct = (v) => Math.round(v * 100) + '%';

  G.Items.define({
    id: 'fission', name: '裂变', set: 'relic',
    desc: () => { const F = RC().fission; return `子弹命中时 ${pct(F.chance)} 概率分裂成 ${F.count} 枚小子弹 (伤害 ${pct(F.dmgRatio)}, 可触发其他道具, 不会再分裂)`; },
    icon: { rows: ['..o..', '.ovo.', 'ovwvo', '.ovo.', 'o.o.o', 'v...v'], pal: { o: '#2a0a44', v: '#b98cff', w: '#ffffff' } },
    on: {
      hit(ctx) {
        const F = RC().fission;
        if (ctx.source !== 'bolt' || ctx.shard) return;              // 只响应玩家子弹; 小子弹不会再分裂
        // 贯穿箭: 一支箭最多触发 G.ARSENAL.string.maxSplits 次分裂 (穿一排怪时不会刷出一大片)
        if (ctx.lance && ctx.bolt && (ctx.bolt.splits || 0) >= G.ARSENAL.string.maxSplits) return;
        if (Math.random() >= F.chance) return;
        if (ctx.lance && ctx.bolt) ctx.bolt.splits = (ctx.bolt.splits || 0) + 1;
        const cb = ctx.cb, cur = cb.bolts.filter((b) => b.shard).length;
        if (cur >= F.maxShards) return;
        const base = Math.atan2(ctx.diry, ctx.dirx), sp = (F.spreadDeg * Math.PI) / 180;
        for (let i = 0; i < F.count; i++) {
          const a = base + (i - (F.count - 1) / 2) * sp;
          cb.fireBolt(ctx.hx, ctx.hy, Math.cos(a), Math.sin(a), { shard: true, dmg: ctx.dmg * F.dmgRatio, range: F.range, life: F.life, speed: F.speed, ignore: ctx.enemy.id });
        }
        R.stats.shards += F.count;
        cb.puff(ctx.hx, ctx.hy, '#b98cff', 4);

      },

  G.Items.define({

    icon: { rows: ['.ooo.', 'o.s.o', 'oswso', 'ossso', '.ooo.', '..o..'], pal: { o: '#2a2010', s: '#a8f0ff', w: '#ffffff' } },
    on: {
      kill(ctx) {
        if (ctx.source === 'ghost') return;                          // 幽魂炸死的敌人不再生成幽魂

  G.Items.define({
    id: 'singularity', name: '奇点', set: 'relic',
    desc: () => { const S = RC().singularity; return `击杀时 ${pct(S.chance)} 概率生成奇点, 吸引附近敌人 ${S.pullTime} 秒后爆炸 (${S.damage} 点伤害, 精英吸引减弱)`; },
    icon: { rows: ['.vvv.', 'v.o.v', 'vooov', 'v.o.v', '.vvv.'], pal: { o: '#1a0630', v: '#c38bff' } },
    on: {
      kill(ctx) {
        if (ctx.source === 'singularity') return;                    // 奇点炸死的敌人不再生成奇点
        if (Math.random() >= RC().singularity.chance) return;
        return R.spawnSing(ctx.enemy.x, ctx.enemy.y);
      },

  G.Items.define({
    id: 'echo', name: '回响', set: 'relic',
    desc: () => { const E = RC().echo; return `血债爆发 / 幽魂 / 奇点爆炸积累能量, 满 ${E.energyMax} 点后下一次爆炸额外触发一次 (${pct(E.dmgScale)} 伤害)`; },
    icon: { rows: ['.o.o.', 'owowo', 'owwwo', '.owo.', '..o..'], pal: { o: '#1d2a3a', w: '#e8f4ff' } },
    status: () => (R.armed ? '就绪' : `${R.energy}/${RC().echo.energyMax}`),
    on: {
      explode(ctx) {
        const E = RC().echo;
        if (ctx.echo || !ctx.replay) return;                         // 回响副本: 不积累能量, 不会再回响
        if (R.armed) {
          // 满能量: 这次爆炸额外触发一次 (延迟, 伤害降低); 消耗能量, 这次爆炸本身不再计能量
          R.armed = false; R.energy = 0; R.stats.echoes++;
          R.echoQueue.push({ t: E.delay, fn: () => ctx.replay(E.dmgScale) });
          ctx.cb.text(ctx.x, ctx.y - 60, '回响!', '#e8f4ff');
          return true;
        }
        const gain = E.gain[ctx.kind] || 0;
        if (!gain) return;
        R.energy = Math.min(E.energyMax, R.energy + gain); R.stats.energyGained += gain;
        if (R.energy >= E.energyMax) { R.armed = true; ctx.cb.text(ctx.x, ctx.y - 60, '回响就绪', '#e8f4ff'); }
      },
    },
  });
})();

  <script>
// 第 15 版: 四件射术道具 —— 改变"怎么射、射什么、怎么走", 而不是单纯加数值
//   折射镜     -> boltWall 事件 : 普通子弹撞墙 / 障碍物后反弹 (每次伤害 ×1.35)
//   寂静之弦   -> fire 事件     : 停火一段时间后, 下一发变成贯穿箭 (穿透、高伤、远射程)
//   逆鳞护符   -> clash 事件    : 玩家子弹打中敌方投射物, 把它原路反射成玩家子弹
//   魂火足迹   -> 运行时 update : 移动时身后留下魂火, 灼烧并减速踩上去的敌人
// 数值全部在 js/config.js 的 G.ARSENAL。三个新事件只由战斗系统 / 玩家派发, 道具处理函数里不会再派发它们。
//
// 子弹种类与优先级 (所有玩家子弹的伤害来源都是 'bolt', 用标记区分):
//   种类         | 寂静之弦变箭 | 折射镜反弹 | 逆鳞反射敌弹       | 血债标记          | 裂变分裂
//   普通子弹     | 是 (开火时)  | 最多 2 次  | 是, 自身被消耗     | 30% 概率          | 35% 概率
//   贯穿箭 lance | -            | 最多 1 次  | 是, 自身不消耗     | 每个敌人必定标记  | 每支箭最多 2 次
//   小子弹 shard | 否           | 否         | 是, 自身被消耗     | 30% 概率          | 否 (不会二次分裂)
//   反射弹       | 否           | 最多 2 次  | 否 (不会再被反射)  | 30% 概率          | 35% 概率 (分出的是小子弹)
//   魂火 (来源 'trail') 不是子弹: 不派发 beforeHit, 不触发血债 / 裂变 / 反弹 / 反射; 魂火烧死敌人照常派发 kill (引魂灯、奇点、血偿)
//
// 防递归 / 性能保护:
//   - 反弹次数记在子弹身上 (bounces), 达到上限就照常消失
//   - 反射弹带 reflected 标记, 不会再触发对撞; 逆鳞护符每帧最多反射 G.ARSENAL.reflect.perFrame 发 (道具系统 perFrame 限制)
//   - 贯穿箭有命中上限 (maxPierce) 和分裂上限 (maxSplits); 贯穿箭、小子弹、反射弹都不会派发 fire, 所以不会再变成箭
//   - 魂火段数有上限, 同一个敌人每 tick 秒最多灼烧一次; 魂火不是爆炸, 不给回响积累能量
//   - 子弹对撞检测只有拥有逆鳞护符时才进行 (G.Items.wants('clash'))
(function () {
  const rand = (a, b) => a + Math.random() * (b - a);
  const AC = () => G.ARSENAL;
  const SOUL = '#a8f0ff';

  const AR = G.Arsenal = {
    charge: 0, charged: false,     // 寂静之弦: 距离上次开火的时间 / 是否蓄满
    segs: [], lastPos: null,       // 魂火足迹
    cb: null,
    stats: { lances: 0, lanceHits: 0, bounces: 0, reflects: 0, trailSegs: 0, trailHits: 0 },

    reset(clearAll) {
      this.segs = []; this.lastPos = null; this.charge = 0; this.charged = false;
      if (clearAll) for (const k in this.stats) this.stats[k] = 0;
    },

    update(cb, dt) {
      this.cb = cb;
      const p = cb.scene.player, I = G.Items;
      // ---- 寂静之弦: 停火计时 ----
      if (I.has('string') && !p.dead) {
        this.charge += dt;
        if (!this.charged && this.charge >= AC().string.idle) {
          this.charged = true;
          if (G.Sfx) G.Sfx.play('mark', { pitch: 0.7 });
          for (let i = 0; i < 6; i++) { const a = rand(0, Math.PI * 2); cb.addPart({ x: p.cx + Math.cos(a) * 20, y: p.cy + Math.sin(a) * 14, z: 0, vx: -Math.cos(a) * 60, vy: -Math.sin(a) * 40, vz: 0, g: 0, life: 0.3, t: 0, c: '#e6ffff', s: 3 }); }
        }
      } else { this.charged = false; this.charge = 0; }

      // ---- 魂火足迹 ----
      const T = AC().trail;
      if (I.has('trail') && !p.dead && p.moving) {
        if (!this.lastPos || Math.hypot(p.x - this.lastPos.x, p.y - this.lastPos.y) >= T.step) {
          this.segs.push({ x: p.x, y: p.y, t: 0, seed: Math.random() * 10 });
          this.lastPos = { x: p.x, y: p.y }; this.stats.trailSegs++;
          if (this.segs.length > T.maxSegments) this.segs.shift();
        }
      }
      for (const s of this.segs) s.t += dt;
      this.segs = this.segs.filter((s) => s.t < T.life);
      if (this.segs.length) {
        for (const e of cb.enemies) {
          if (e.trailT > 0) e.trailT -= dt;
          if (e.state === 'dead' || e.air || e.spawnT > 0) continue;
          let on = false;
          for (const s of this.segs) if (Math.hypot(e.x - s.x, (e.y - s.y) * 1.25) < T.radius + e.r * 0.6) { on = true; break; }
          if (!on) continue;
          e.slowT = T.slowTime; e.slowAmt = T.slow;
          if (e.trailT > 0) continue;
          e.trailT = T.tick; this.stats.trailHits++;
          // 来源 'trail': 不是子弹, 不会触发血债 / 裂变; 击杀照常派发 kill
          cb.hurtEnemy(e, T.damage, 0, 0, 0, e.x, e.y - e.AI.hitH, { source: 'trail', tint: 'soul', textColor: SOUL, spark: false });
        }
      }
    },

    // 魂火: 贴地的蓝色像素火苗, 快熄灭时变小
    // 性能: 颜色固定, 只改 globalAlpha; 坐标取整; 分三遍画 (底光 / 火苗 / 火尖), 避免每段反复解析颜色字符串
    drawGround(ctx, cb, snap) {
      const n = this.segs.length; if (!n) return;
      const T = AC().trail, now = performance.now() / 1000, rw = Math.round(T.radius * 0.8 / 3) * 3;
      // 相邻两段距离只有 20, 火苗隔一段画一次就足够连贯
      const geo = this.segs.filter((s, i) => i % 2 === 0 || i === n - 1).map((s) => {
        const k = 1 - s.t / T.life, x = Math.round(snap(s.x)), y = Math.round(snap(s.y));
        return { k, x, y, h: [0, 1, 2].map((i) => Math.round((6 + Math.sin(now * 12 + s.seed + i * 2) * 3 + 6 * k) / 3) * 3) };
      });
      ctx.fillStyle = '#3f8fb0';
      for (const g of geo) { ctx.globalAlpha = 0.2 * g.k; ctx.fillRect(g.x - rw * 1.4, g.y - 6, rw * 2.8, 12); ctx.fillRect(g.x - rw, g.y - 9, rw * 2, 18); }
      ctx.fillStyle = '#a8f0ff';
      for (const g of geo) { ctx.globalAlpha = 0.75 * g.k; for (let i = 0; i < 3; i++) ctx.fillRect(g.x + (i - 1) * 9 - 3, g.y - g.h[i], 6, g.h[i]); }
      ctx.fillStyle = '#ffffff';
      for (const g of geo) { ctx.globalAlpha = 0.8 * g.k; for (let i = 0; i < 3; i++) ctx.fillRect(g.x + (i - 1) * 9 - 1, g.y - g.h[i], 3, 3); }
      ctx.globalAlpha = 1;
    },

    // 寂静之弦蓄满: 玩家周围一圈微光
    drawTop(ctx, snap) {
      if (!this.charged || !this.cb) return;
      const p = this.cb.scene.player; if (p.dead) return;
      const t = performance.now() / 1000;
      ctx.strokeStyle = `rgba(230,255,255,${0.55 + Math.sin(t * 8) * 0.2})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(snap(p.cx), snap(p.cy + 4), 22, 26, 0, 0, Math.PI * 2); ctx.stroke();
    },

    lights() {
      const out = [];
      for (let i = 0; i < this.segs.length; i += 4) { const s = this.segs[i]; out.push({ x: s.x, y: s.y - 8, r: 70, a: 0.5 * (1 - s.t / AC().trail.life), color: '120,210,255' }); }
      return out;
    },
  };
  G.Items.registerSystem(AR);

  // ---------------- 四件道具 ----------------
  const pct = (v) => Math.round(v * 100) + '%';
  const B = () => G.COMBAT.bolt;

  G.Items.define({
    id: 'prism', name: '折射镜', set: 'arsenal',
    desc: () => { const P = AC().prism; return `子弹撞墙或障碍物会反弹 (最多 ${P.maxBounces} 次, 贯穿箭 ${P.lanceBounces} 次), 每次反弹伤害 ×${P.dmgMul}`; },
    icon: { rows: ['...o...', '..oyo..', '.oyvyo.', 'oyvwvyo', '.oyvyo.', '..oyo..', '...o...'], pal: { o: '#2a1a10', y: '#ffd27a', v: '#b98cff', w: '#ffffff' } },
    on: {
      boltWall(ctx) {
        const P = AC().prism, b = ctx.bolt;
        if (b.shard) return;                                          // 小子弹不反弹
        if (b.bounces >= (b.lance ? P.lanceBounces : P.maxBounces)) return;
        b.bounces++;
        ctx.reflect(); ctx.bounce = true;
        b.dmg = (b.dmg != null ? b.dmg : B().damage) * P.dmgMul;
        b.dist = Math.max(0, b.dist - (b.range || B().range) * P.rangeRefill);
        AR.stats.bounces++;
        ctx.cb.puff(b.x, b.y, '#ffd27a', 3);
        return true;
      },
    },
  });

  G.Items.define({
    id: 'string', name: '寂静之弦', set: 'arsenal',
    desc: () => { const S = AC().string; return `停火 ${S.idle} 秒后, 下一发变成贯穿箭 (${S.damage} 点伤害, 穿透敌人, 射程 ×${S.speedMul})`; },
    icon: { rows: ['.oo....', 'o..o..w', 'o...oww', 'o...ww.', 'o..o.w.', '.oo....'], pal: { o: '#e6ffff', w: '#7ef0ff' } },
    status: () => (AR.charged ? '蓄满' : ''),
    on: {
      fire(ctx) {
        if (!AR.charged) { AR.charge = 0; return; }                   // 连射: 每一发都重新计时
        const S = AC().string, b = B();
        AR.charged = false; AR.charge = 0; AR.stats.lances++;
        Object.assign(ctx.opts, { lance: true, pierce: S.maxPierce, dmg: S.damage, speed: b.speed * S.speedMul, range: b.range * S.rangeMul, radius: S.radius });
        ctx.cb.scene.shake = Math.max(ctx.cb.scene.shake, 3);
        if (G.Sfx) G.Sfx.play('heavy', { pitch: 1.4 });
        return true;
      },
      hit(ctx) { if (ctx.lance) AR.stats.lanceHits++; },
    },
  });

  G.Items.define({
    id: 'reflect', name: '逆鳞护符', set: 'arsenal',
    desc: () => { const R = AC().reflect; return `子弹可以击中敌方投射物, 把它原路反射成你的子弹 (${R.damage} 点伤害)`; },
    icon: { rows: ['.ooooo.', 'orrrrro', 'orrwrro', 'orwrwro', '.orrro.', '..oro..', '...o...'], pal: { o: '#2a0410', r: '#e8243f', w: '#ffd0d6' } },
    perFrame: 6,                     // 每帧最多反射几发 (和 G.ARSENAL.reflect.perFrame 一致)
    on: {
      clash(ctx) {
        const b = ctx.bolt, eb = ctx.ebolt, R = AC().reflect, cb = ctx.cb;
        if (b.reflected || eb.dead) return;                           // 反射弹不会再反射
        eb.dead = true;
        const sp = Math.hypot(eb.vx, eb.vy) || 1;
        cb.fireBolt(eb.x, eb.y + eb.h - 28, -eb.vx / sp, -eb.vy / sp, { reflected: true, dmg: R.damage, speed: sp * R.speedMul, range: R.range });
        ctx.consume = !b.lance;                                       // 贯穿箭不被消耗
        AR.stats.reflects++;
        cb.puff(eb.x, eb.y, '#ff5a7a', 5);
        if (G.Sfx) G.Sfx.play('mark', { pitch: 1.3 });
        return true;
      },
    },
  });

  G.Items.define({
    id: 'trail', name: '魂火足迹', set: 'arsenal',
    desc: () => { const T = AC().trail; return `移动时身后留下魂火 (${T.life} 秒), 敌人踩上去每 ${T.tick} 秒受 ${T.damage} 点伤害并减速 ${pct(T.slow)}`; },
    icon: { rows: ['...b...', '..bwb..', '..bwb..', '.bbwbb.', 'bbwwwbb', '.bbbbb.'], pal: { b: '#3f8fb0', w: '#a8f0ff' } },
    on: {},                          // 效果在运行时 update 里 (只要拥有就生效)
  });
})();

  <script>
// HUD: 像素心形生命值 + 波次/剩余敌人。用 DOM 放置 (自动避开刘海屏安全区), 心形用小画布逐像素绘制
(function () {
  const HEART = [
    '.oo.oo.',
    'ohhoxxo',
    'ohxxxxo',
    'oxxxxxo',
    '.oxxxo.',
    '..oxo..',
    '...o...',
  ];
  class Hud {
    constructor(scene) {
      this.scene = scene;
      this.canvas = document.getElementById('hearts');
      this.info = document.getElementById('wave-info');
      this.relics = document.getElementById('relics');
      this.last = '';
    }
    update() {
      const p = this.scene.player, cb = this.scene.combat;
      const key = p.hp + '/' + p.maxHp + '/' + Math.floor(p.invuln * 10 % 2);
      if (key !== this.last) { this.last = key; this.drawHearts(p); }
      const dg = this.scene.dungeon, room = dg && dg.cur;
      const txt = room
        ? `${room.name} · 剩余 ${cb.aliveCount()} · 击杀 ${cb.kills} · 魂晶 ${cb.souls} · 已清理 ${dg.clearedCount()}/${dg.combatTotal()}`
        : `第 ${cb.wave} 波 · 剩余 ${cb.aliveCount()} · 击杀 ${cb.kills} · 魂晶 ${cb.souls}`;
      if (this.info.textContent !== txt) this.info.textContent = txt;
      // 已获得的道具
      const rel = G.Items.owned().map((d) => { const st = d.status ? d.status() : ''; return st ? d.name + ' ' + st : d.name; }).join(' · ');
      if (this.relics && this.relics.textContent !== rel) { this.relics.textContent = rel; this.relics.style.display = rel ? '' : 'none'; }
    }
    drawHearts(p) {
      const n = Math.ceil(p.maxHp / 2), u = 3, gap = 2;
      const c = this.canvas, w = n * (7 * u + gap), h = 7 * u;
      if (c.width !== w) { c.width = w; c.height = h; c.style.width = w * 1.15 + 'px'; c.style.height = h * 1.15 + 'px'; }
      const g = c.getContext('2d');
      g.clearRect(0, 0, w, h);
      for (let i = 0; i < n; i++) {
        const fill = Math.max(0, Math.min(2, p.hp - i * 2));    // 0 空 / 1 半 / 2 满
        HEART.forEach((row, y) => [...row].forEach((ch, x) => {
          if (ch === '.') return;
          let col = '#140b1f';
          if (ch !== 'o') {
            const filled = fill === 2 || (fill === 1 && x <= 3);
            col = filled ? (ch === 'h' ? '#ffb3c0' : '#e2334f') : '#3a2440';
          }
          g.fillStyle = col; g.fillRect(i * (7 * u + gap) + x * u, y * u, u, u);
        }));
      }
    }
  }
  G.Hud = Hud;
})();
