<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0812" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="逃离616" />
  <title>逃离616</title>
  <style>
/* 《逃离616》基础样式: 铺满屏幕、禁止滚动/缩放/长按菜单、适配刘海屏安全区 */
:root {
  color-scheme: dark;
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  /* 按钮尺寸以屏幕短边为基准, 手机/平板/电脑都合适 */
  --u: min(1vw, 1vh);
  --btn-big: clamp(64px, calc(var(--u) * 20), 110px);
  --btn-small: clamp(46px, calc(var(--u) * 13), 74px);
  --ink: #e9ddff;
  --panel: rgba(18, 10, 28, 0.72);
  --edge: rgba(176, 140, 255, 0.45);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0d0812;
  color: var(--ink);
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  /* 防止页面被拖动、回弹、双击缩放、文字选中 */
  position: fixed; inset: 0;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
}

#app {
  position: fixed; left: 0; top: 0;
  width: 100%; height: 100%;          /* JS 会写入精确像素尺寸 */
  overflow: hidden;
  transform-origin: 0 0;
}
/* 强制横屏 (整体旋转 90°) 时, 安全区的方向也跟着转:
   游戏的左边 = 手机顶部(刘海), 右边 = 手机底部, 上边 = 手机右侧, 下边 = 手机左侧 */
body.rotated {
  --safe-l: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-left, 0px);
}

#game {
  position: absolute; left: 0; top: 0;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
}

/* ---------------- 顶部 HUD ---------------- */
#hud-top {
  position: absolute;
  left: calc(var(--safe-l) + 8px); right: calc(var(--safe-r) + 8px);
  top: calc(var(--safe-t) + 8px);
  display: flex; justify-content: space-between; align-items: flex-start;
  pointer-events: none;
  z-index: 10;
}
.hud-panel {
  font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace;
  background: var(--panel);
  border: 1px solid var(--edge);
  padding: 4px 7px; border-radius: 4px;
  white-space: pre;
}
#top-buttons { display: flex; gap: 6px; pointer-events: auto; }
.hud-btn {
  font: inherit; font-size: 13px; color: var(--ink);
  background: var(--panel); border: 1px solid var(--edge);
  border-radius: 4px; padding: 6px 10px; min-height: 34px;
  cursor: pointer;
}
.hud-btn.on { background: rgba(110, 70, 180, 0.8); }
.hud-btn:active { transform: translateY(1px); }

/* ---------------- 触屏操作层 ---------------- */
#touch-ui { position: absolute; inset: 0; pointer-events: none; z-index: 5; display: none; }
body.touch-mode #touch-ui { display: block; }

/* 左侧摇杆区域: 左半屏下部任意位置按下都会在手指处出现摇杆 */
#joy-zone {
  position: absolute;
  left: 0; bottom: 0;
  width: 45%; height: 70%;
  pointer-events: auto;
  touch-action: none;
}
#joy-base {
  position: absolute;
  width: calc(var(--btn-big) * 1.55); height: calc(var(--btn-big) * 1.55);
  margin-left: calc(var(--btn-big) * -0.775); margin-top: calc(var(--btn-big) * -0.775);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(120, 80, 190, 0.18), rgba(40, 20, 70, 0.35));
  border: 2px solid rgba(190, 160, 255, 0.35);
  /* 默认停在左下角 (考虑安全区) */
  left: calc(var(--safe-l) + var(--btn-big) * 1.15);
  top: calc(100% - var(--safe-b) - var(--btn-big) * 1.05);
  opacity: 0.55;
  transition: opacity .15s;
}
#joy-base.active { opacity: 1; transition: none; }
#joy-knob {
  position: absolute; left: 50%; top: 50%;
  width: 44%; height: 44%;
  margin-left: -22%; margin-top: -22%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #c9b2ff, #6b45b8);
  border: 2px solid rgba(255, 255, 255, 0.35);
  box-shadow: 0 0 12px rgba(150, 100, 255, 0.5);
}

/* 右侧射击区: 右半屏任意处按下并拖动, 拖动方向 = 射击方向 */
#aim-zone {
  position: absolute;
  right: 0; bottom: 0;
  width: 50%; height: 100%;
  pointer-events: auto;
  touch-action: none;
}
#aim-base {
  position: absolute;
  width: calc(var(--btn-big) * 1.45); height: calc(var(--btn-big) * 1.45);
  margin-left: calc(var(--btn-big) * -0.725); margin-top: calc(var(--btn-big) * -0.725);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 90, 120, 0.10), rgba(90, 20, 50, 0.32));
  border: 2px dashed rgba(255, 160, 180, 0.4);
  /* 默认停在右下角 (考虑安全区), 提示这里可以射击 */
  left: calc(100% - var(--safe-r) - var(--btn-big) * 1.1);
  top: calc(100% - var(--safe-b) - var(--btn-big) * 1.05);
  opacity: 0.5;
  transition: opacity .15s;
}
#aim-base.active { opacity: 1; transition: none; border-style: solid; }
#aim-knob {
  position: absolute; left: 50%; top: 50%;
  width: 40%; height: 40%;
  margin-left: -20%; margin-top: -20%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ffc2d0, #c23a5e);
  border: 2px solid rgba(255, 255, 255, 0.35);
  box-shadow: 0 0 12px rgba(255, 90, 120, 0.5);
}
#aim-hint {
  position: absolute;
  right: calc(var(--safe-r) + var(--btn-big) * 0.35);
  bottom: calc(var(--safe-b) + var(--btn-big) * 1.9);
  font-size: 12px; opacity: 0.45; pointer-events: none; white-space: nowrap;
}
#aim-base.active ~ #aim-hint { opacity: 0; }
.hidden { display: none !important; }

/* ---------------- 竖屏提示 ---------------- */
#rotate-hint {
  position: absolute; inset: 0; z-index: 50;
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  background: #0d0812; text-align: center; padding: 24px;
}
body.portrait #rotate-hint { display: flex; }
#rotate-hint p { margin: 0; font-size: 18px; }
#rotate-hint .sub, #loading .sub { font-size: 12px; opacity: 0.6; }
.phone-icon {
  width: 46px; height: 78px; border: 4px solid var(--ink); border-radius: 8px; margin-bottom: 18px;
  animation: rot 2s ease-in-out infinite;
}
@keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }

#loading {
  position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column;
  align-items: center; justify-content: center; background: #0d0812; gap: 6px;
}
#loading p { margin: 0; font-size: 22px; letter-spacing: 4px; }
#loading.done { display: none; }

/* ---------------- 第二阶段: 状态栏 / 死亡界面 ---------------- */
#hud-left { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
#status {
  display: flex; flex-direction: column; gap: 4px; white-space: normal;
  padding: 6px 8px; font: 12px/1.2 inherit; font-family: inherit;
}
#hearts { display: block; image-rendering: pixelated; }
#wave-info { opacity: 0.85; letter-spacing: 0.5px; }
#debug { pointer-events: auto; cursor: pointer; }

#death-overlay {
  position: absolute; inset: 0; z-index: 30;
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: radial-gradient(circle, rgba(40, 0, 18, 0.55), rgba(6, 2, 10, 0.88));
  pointer-events: auto;
}
#death-overlay.show { display: flex; animation: fadein .5s ease-out; }
#death-overlay .title { margin: 0; font-size: 30px; letter-spacing: 8px; color: #ff8a9a; text-shadow: 0 2px 0 #140b1f; }
#death-overlay .sub { margin: 0; font-size: 13px; opacity: 0.7; }
#btn-restart { font-size: 16px; padding: 10px 26px; min-height: 44px; margin-top: 8px; }
#victory-overlay {
  position: absolute; inset: 0; z-index: 30;
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: radial-gradient(circle, rgba(60, 40, 10, 0.45), rgba(6, 2, 10, 0.85));
  pointer-events: auto; text-align: center; padding: 0 16px;
}
#victory-overlay.show { display: flex; animation: fadein .5s ease-out; }
#victory-overlay .title { margin: 0; font-size: 28px; letter-spacing: 6px; color: #ffd27a; text-shadow: 0 2px 0 #140b1f; }
#victory-overlay .sub { margin: 0; font-size: 13px; opacity: 0.75; }
#victory-overlay .row { display: flex; gap: 12px; margin-top: 8px; }
#victory-overlay button { font-size: 16px; padding: 10px 22px; min-height: 44px; }
/* 选择角色 */
#char-select {
  position: absolute; inset: 0; z-index: 40;
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: radial-gradient(circle, rgba(40, 24, 70, 0.75), rgba(6, 2, 10, 0.94));
  pointer-events: auto; padding: 8px 16px;
}
#char-select.show { display: flex; animation: fadein .3s ease-out; }
#char-select .title { margin: 0; font-size: 22px; letter-spacing: 6px; color: #d8c2ff; text-shadow: 0 2px 0 #140b1f; }
#char-select .cards { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; max-width: 100%; }
#char-select .card {
  width: 168px; padding: 8px 10px 10px; border-radius: 10px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: rgba(20, 11, 31, 0.85); border: 2px solid #3b2963; color: #e6dcff; font: inherit; text-align: center;
}
#char-select .card.on { border-color: #ffd27a; box-shadow: 0 0 0 2px rgba(255, 210, 122, 0.25), 0 0 18px rgba(255, 210, 122, 0.25); }
#char-select .card canvas {
  width: 144px; height: 192px; image-rendering: pixelated;   /* 2 倍显示, 像素不变形 */
  background: radial-gradient(ellipse at 50% 92%, rgba(126, 240, 255, 0.18), rgba(0, 0, 0, 0) 60%);
}
#char-select .card .name { font-size: 17px; font-weight: bold; letter-spacing: 3px; color: #ffd27a; }
#char-select .card .tag { font-size: 12px; opacity: 0.8; line-height: 1.35; }
#char-select .card .skill { font-size: 12px; color: #7ef0ff; line-height: 1.35; }
#btn-start { font-size: 16px; padding: 9px 30px; min-height: 44px; }
@media (max-height: 420px) {
  #char-select { gap: 6px; }
  #char-select .title { font-size: 18px; }
  #char-select .card canvas { width: 72px; height: 96px; }
}
/* 竖屏强制横屏时, 横屏的"高度"其实是屏幕宽度 */
@media (max-width: 420px) {
  body.rotated #char-select { gap: 6px; }
  body.rotated #char-select .title { font-size: 18px; }
  body.rotated #char-select .card canvas { width: 72px; height: 96px; }
}
@media (min-height: 421px) and (max-height: 560px) {
  #char-select .card canvas { width: 108px; height: 144px; }
}

@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

/* 猩红债主: 已获得道具 */
#relics { color: #ff6a7a; font-size: 12px; letter-spacing: 0.5px; }

</style>
</head>

  <div id="app">
    <canvas id="game"></canvas>

    <!-- 顶部 HUD -->
    <div id="hud-top">
      <div id="hud-left">
        <div id="status" class="hud-panel">
          <canvas id="hearts" width="1" height="1"></canvas>
          <div id="wave-info"></div>
          <div id="relics" style="display:none"></div>
        </div>
        <div id="debug" class="hud-panel"></div>
      </div>
      <div id="top-buttons">
        <button id="btn-scene" class="hud-btn" type="button">素材</button>
        <button id="btn-sound" class="hud-btn on" type="button">音效</button>
        <button id="btn-light" class="hud-btn" type="button">光照</button>
        <button id="btn-fullscreen" class="hud-btn" type="button">全屏</button>
      </div>
    </div>

    <!-- 触屏操作层 (触屏设备显示, 电脑上隐藏) -->
    <div id="touch-ui">
      <div id="joy-zone">
        <div id="joy-base"><div id="joy-knob"></div></div>
      </div>
      <!-- 右侧: 按下并拖动 = 朝拖动方向持续射击 -->
      <div id="aim-zone">
        <div id="aim-base"><div id="aim-knob"></div></div>
        <div id="aim-hint">按住拖动射击</div>
      </div>
    </div>

    <!-- 死亡界面 -->
    <div id="death-overlay">
      <p class="title">你倒下了</p>
      <p class="sub">深渊还在等你</p>
      <button id="btn-restart" class="hud-btn" type="button">再来一次</button>
    </div>

    <!-- 选择角色 (开局) -->
    <div id="char-select">
      <p class="title">选择角色</p>
      <div class="cards"></div>
      <button id="btn-start" class="hud-btn" type="button">开始游戏</button>
    </div>

    <!-- 通关 (击败 Boss 房) -->
    <div id="victory-overlay">
      <p class="title">通关!</p>
      <p class="sub">可以继续探索剩下的房间, 或者重新开始一局</p>
      <div class="row">
        <button id="btn-continue" class="hud-btn" type="button">继续探索</button>
        <button id="btn-again" class="hud-btn" type="button">再来一局</button>
      </div>
    </div>

    <!-- 加载 -->
    <div id="loading"><p>逃离616</p><p class="sub" id="loading-text">加载素材…</p></div>
  </div>

// 素材加载: 读取 window.ASSET_MANIFEST, 加载 PNG; 缺失或失败时自动换成程序占位图
(function () {
  const images = {};      // manifest id -> HTMLImageElement
  const failed = [];

  function loadImage(id, src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => { images[id] = img; resolve(); };
      img.onerror = () => { failed.push(id); resolve(); };
      img.src = src;
    });
  }

  G.Assets = {
    images, failed,
    resolved: {},          // 角色 key -> {img, def, placeholder:boolean}

    async loadAll(onProgress) {
      const mf = window.ASSET_MANIFEST;
      const list = mf ? mf.extracted : [];
      if (!mf) console.warn('[assets] 未找到 assets/assets.js, 全部使用占位图');
      let done = 0;
      await Promise.all(list.map((it) =>
        loadImage(it.id, it.file).then(() => { done++; onProgress && onProgress(done, list.length); })
      ));
      // 解析角色表
      for (const [key, def] of Object.entries(G.SPRITES)) {
        const img = def.asset ? images[def.asset] : null;
        if (img) this.resolved[key] = { img, def, placeholder: false };
        else this.resolved[key] = { img: G.Placeholders.get(def.fallback || 'ph_small'), def, placeholder: true };
      }
      if (failed.length) console.warn('[assets] 加载失败, 已用占位图:', failed);
      return { total: list.length, loaded: list.length - failed.length, failed: failed.slice() };
    },

    get(key) { return this.resolved[key]; },
  };
})();

//
// 缩放规则: 保证至少能看到 VIEW_W x VIEW_H (16:9) 的世界范围,

(function () {
  const C = G.CONFIG;
  const canvas = document.getElementById('game');
  const app = document.getElementById('app');
  const ctx = canvas.getContext('2d', { alpha: false });

  const D = G.Display = {
    canvas, ctx,
    cssW: 0, cssH: 0, dpr: 1,
    scale: 1,             // 1 个世界单位 = 多少设备像素
    viewW: C.VIEW_W, viewH: C.VIEW_H,   // 当前实际可见的世界范围
    isTouch: matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window,
    portrait: false,
    onResize: [],

    rotated: false,       // 触屏竖屏时整体旋转 90°, 强制横屏显示
    screenW: 0, screenH: 0,

    resize() {
      const vv = window.visualViewport;
      const sw = Math.round(vv ? vv.width : window.innerWidth);
      const sh = Math.round(vv ? vv.height : window.innerHeight);
      D.screenW = sw; D.screenH = sh;
      // iPhone 开了"竖排方向锁定"、或在 App 内置浏览器里无法横屏时,
      // 不再拦截提示, 而是把整个游戏旋转 90° 铺满屏幕 (把手机向左横过来玩)
      D.rotated = D.isTouch && sh > sw;
      const w = D.rotated ? sh : sw, h = D.rotated ? sw : sh;
      app.style.width = w + 'px';
      app.style.height = h + 'px';
      app.style.transform = D.rotated ? `translateX(${sw}px) rotate(90deg)` : '';
      document.body.classList.toggle('rotated', D.rotated);
      const dpr = Math.min(window.devicePixelRatio || 1, C.MAX_DPR);
      D.cssW = w; D.cssH = h; D.dpr = dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      D.scale = Math.min(canvas.width / C.VIEW_W, canvas.height / C.VIEW_H);
      D.viewW = canvas.width / D.scale;
      D.viewH = canvas.height / D.scale;
      ctx.imageSmoothingEnabled = false;
      D.portrait = false;
      D.onResize.forEach((f) => f());
    },

    // 屏幕坐标 (clientX/Y) -> 游戏层本地坐标 (旋转时需要换算)
    toLocal(cx, cy) {
      return D.rotated ? { x: cy, y: D.screenW - cx } : { x: cx, y: cy };
    },

    // 屏幕坐标 (CSS px) -> 世界坐标
    screenToWorld(sx, sy, cam) {
      return { x: cam.x + (sx * D.dpr) / D.scale, y: cam.y + (sy * D.dpr) / D.scale };
    },

    fullscreenSupported() {
      const el = document.documentElement;
      return !!(el.requestFullscreen || el.webkitRequestFullscreen);
    },
    isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },

    async toggleFullscreen() {
      const el = document.documentElement;
      try {
        if (D.isFullscreen()) {

        } else if (D.fullscreenSupported()) {

  document.addEventListener('fullscreenchange', D.resize);
  document.addEventListener('webkitfullscreenchange', D.resize);

    // 每帧开始时调用: 汇总移动方向
    update() {
      let x = 0, y = 0;
      const k = I.keys;
      if (k.has('KeyA') || k.has('ArrowLeft')) x -= 1;
      if (k.has('KeyD') || k.has('ArrowRight')) x += 1;
      if (k.has('KeyW') || k.has('ArrowUp')) y -= 1;
      if (k.has('KeyS') || k.has('ArrowDown')) y += 1;
      if (x || y) { const l = Math.hypot(x, y); x /= l; y /= l; }
      if (I.joy.active) {
        const jx = I.joy.dx / I.joy.radius, jy = I.joy.dy / I.joy.radius;
        const l = Math.hypot(jx, jy);
        if (l > C.JOY_DEADZONE) {
          // 死区外线性映射到 0~1, 摇杆可以控制走路速度
          const m = Math.min(1, (l - C.JOY_DEADZONE) / (1 - C.JOY_DEADZONE));
          x = (jx / l) * m; y = (jy / l) * m;

      I.move.x = x; I.move.y = y;
    },
    // 每帧结束时调用: 清掉单帧按下标记
    endFrame() { for (const a of ACTIONS) I.pressed[a] = false; },

    press(a) { if (!I.held[a]) I.pressed[a] = true; I.held[a] = true; },
    release(a) { I.held[a] = false; },
  };
  document.body.classList.toggle('touch-mode', I.mode === 'touch');

  // ---------------- 键盘 ----------------
  const KEY_ACTION = {
    Space: 'dash', ShiftLeft: 'dash', ShiftRight: 'dash',
    KeyJ: 'attack', KeyE: 'interact',
  };
  window.addEventListener('keydown', (e) => {
    I.setMode('kbm');
    if (e.repeat) return;
    I.keys.add(e.code);
    const a = KEY_ACTION[e.code];
    if (a) I.press(a);
    if (e.code === 'KeyF') D.toggleFullscreen();
    if (G.onKey) G.onKey(e.code);
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => {
    I.keys.delete(e.code);
    const a = KEY_ACTION[e.code];
    if (a) I.release(a);

    resetJoy(); if (I.aim.active) resetAim();

  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse') return;
    I.mouse.x = e.clientX; I.mouse.y = e.clientY; I.mouse.inside = true;
  });
  canvas.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') I.mouse.inside = false; });
  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse') return;
    I.setMode('kbm');
    I.mouse.x = e.clientX; I.mouse.y = e.clientY; I.mouse.inside = true;
    if (e.button === 0) I.press('attack');
  });
  window.addEventListener('pointerup', (e) => {
    if (e.pointerType !== 'mouse') return;
    if (e.button === 0) I.release('attack');
  });

  window.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') I.setMode('touch'); }, true);

  // ---------------- 虚拟摇杆 ----------------
  const zone = document.getElementById('joy-zone');
  const base = document.getElementById('joy-base');
  const knob = document.getElementById('joy-knob');

  function resetJoy() {
    I.joy.active = false; I.joy.id = null; I.joy.dx = I.joy.dy = 0;
    base.classList.remove('active');
    base.style.left = base.style.top = '';
    knob.style.transform = '';
  }

  zone.addEventListener('pointerdown', (e) => {
    if (I.joy.active) return;
    e.preventDefault();
    // 用游戏层本地坐标计算 (画面被旋转 90° 时 getBoundingClientRect 不可用)
    const zr = { left: zone.offsetLeft, top: zone.offsetTop };
    zr.right = zr.left + zone.offsetWidth; zr.bottom = zr.top + zone.offsetHeight;
    const size = base.offsetWidth;
    I.joy.radius = size * 0.42;
    const p = D.toLocal(e.clientX, e.clientY);
    // 摇杆出现在手指处, 但保证整个圆在屏幕内
    const cx = Math.max(zr.left + size / 2 + 4, Math.min(p.x, zr.right - size / 2));
    const cy = Math.max(zr.top + size / 2, Math.min(p.y, zr.bottom - size / 2 - 4));
    Object.assign(I.joy, { active: true, id: e.pointerId, cx, cy, dx: 0, dy: 0 });
    base.style.left = (cx - zr.left) + 'px';
    base.style.top = (cy - zr.top) + 'px';

  });
  function moveJoy(e) {
    if (!I.joy.active || e.pointerId !== I.joy.id) return;
    const p = D.toLocal(e.clientX, e.clientY);

  zone.addEventListener('pointercancel', endJoy);
  zone.addEventListener('lostpointercapture', endJoy);

  // ---------------- 右侧射击区: 按下并拖动 -> 朝拖动方向连续射击 ----------------
  // 和左侧摇杆各自只认自己的那根手指 (pointerId), 两边同时操作互不干扰
  const AIM_DEAD = 14;   // 拖动超过多少像素才算有方向 (防误触); 没拖开时沿用上一次方向
  const azone = document.getElementById('aim-zone');
  const abase = document.getElementById('aim-base');
  const aknob = document.getElementById('aim-knob');

  function resetAim() {
    I.aim.active = false; I.aim.id = null;
    abase.classList.remove('active');
    abase.style.left = abase.style.top = '';
    aknob.style.transform = '';
    I.release('attack');
  }
  azone.addEventListener('pointerdown', (e) => {
    if (I.aim.active) return;
    e.preventDefault();
    const p = D.toLocal(e.clientX, e.clientY);
    const zl = azone.offsetLeft, zt = azone.offsetTop;
    Object.assign(I.aim, { active: true, has: false, id: e.pointerId, cx: p.x, cy: p.y });
    abase.style.left = (p.x - zl) + 'px';
    abase.style.top = (p.y - zt) + 'px';
    abase.classList.add('active');
    try { azone.setPointerCapture(e.pointerId); } catch (_) {}
    I.press('attack');
    if (navigator.vibrate) navigator.vibrate(8);
  });
  azone.addEventListener('pointermove', (e) => {
    if (!I.aim.active || e.pointerId !== I.aim.id) return;
    const p = D.toLocal(e.clientX, e.clientY);
    const dx = p.x - I.aim.cx, dy = p.y - I.aim.cy, l = Math.hypot(dx, dy);
    if (l >= AIM_DEAD) { I.aim.x = dx / l; I.aim.y = dy / l; I.aim.has = true; }
    // 圆钮最多拖到底座边缘, 方向仍按手指的真实位置计算
    const r = abase.offsetWidth * 0.42, k = l > r ? r / l : 1;
    aknob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
  });
  const endAim = (e) => { if (e.pointerId === I.aim.id) resetAim(); };
  azone.addEventListener('pointerup', endAim);
  azone.addEventListener('pointercancel', endAim);
  azone.addEventListener('lostpointercapture', endAim);

  // 统计当前触点数 (调试用)
  const touchIds = new Set();
  window.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') { touchIds.add(e.pointerId); I.activeTouches = touchIds.size; } }, true);
  const rm = (e) => { touchIds.delete(e.pointerId); I.activeTouches = touchIds.size; };
  window.addEventListener('pointerup', rm, true);
  window.addEventListener('pointercancel', rm, true);
})();

  <script>
// 音效: 项目里原本没有任何音频, 也没有音频素材。
// 这里用 Web Audio 实时合成很短的命中音 (不需要音频文件, 手机/电脑浏览器都支持)。
// - 浏览器要求必须在用户第一次点击/按键后才能出声, 所以在第一次交互时才创建 AudioContext
// - 同一种音效有最小间隔, 同时发声数量有上限, 连射打中一群怪也不会炸耳朵或卡顿
(function () {
  let ctx = null, master = null, noiseBuf = null, voices = 0;
  const last = {};
  const MAX_VOICES = 8;

  const S = G.Sfx = {
    enabled: true,
    volume: 0.5,

    unlock() {
      if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = S.volume; master.connect(ctx.destination);
        // 0.2 秒白噪声, 反复使用
        noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.2), ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ctx = null; }
    },

    // name: 'hit' 普通命中 | 'heavy' 命中精英 | 'wall' 子弹撞墙
    play(name, opt = {}) {
      if (!S.enabled || !ctx || ctx.state !== 'running') return;
      const now = ctx.currentTime;
      const gap = name === 'wall' ? 0.06 : name === 'burst' ? 0.07 : name === 'roar' ? 0.8 : name === 'boom' || name === 'warn' ? 0.12 : 0.035;
      if (last[name] && now - last[name] < gap) return;
      if (voices >= MAX_VOICES) return;
      last[name] = now;
      const pitch = opt.pitch || 1;
      if (name === 'hit' || name === 'heavy') {
        const heavy = name === 'heavy';
        // 1) 短促的方波"啪": 高频迅速滑到低频
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'square';
        o.frequency.setValueAtTime((heavy ? 260 : 620) * pitch, now);
        o.frequency.exponentialRampToValueAtTime((heavy ? 70 : 150) * pitch, now + (heavy ? 0.09 : 0.06));
        g.gain.setValueAtTime(heavy ? 0.22 : 0.16, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + (heavy ? 0.11 : 0.07));
        o.connect(g); g.connect(master);
        o.start(now); o.stop(now + 0.12);
        track(o);
        // 2) 一点高频噪声当"冲击质感"
        noise(now, heavy ? 0.06 : 0.04, heavy ? 900 : 2200, heavy ? 0.16 : 0.1);
      } else if (name === 'burst') {
        // 猩红爆发: 低沉的"嘭" + 噪声尾巴; 连锁越深音调越低
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(180 * pitch, now);
        o.frequency.exponentialRampToValueAtTime(40 * pitch, now + 0.18);
        g.gain.setValueAtTime(0.22, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        o.connect(g); g.connect(master); o.start(now); o.stop(now + 0.24); track(o);
        noise(now, 0.14, 500, 0.18);
        // 连锁越深叠加的层次越多 (有上限): 第 2 层清脆的"碎裂", 第 3 层更低的"轰"
        const layers = opt.layers || 1;
        if (layers >= 2) noise(now + 0.01, 0.06, 3000, 0.12);
        if (layers >= 3) {
          const o2 = ctx.createOscillator(), g2 = ctx.createGain();
          o2.type = 'sine'; o2.frequency.setValueAtTime(90, now); o2.frequency.exponentialRampToValueAtTime(35, now + 0.25);
          g2.gain.setValueAtTime(0.25, now); g2.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          o2.connect(g2); g2.connect(master); o2.start(now); o2.stop(now + 0.3); track(o2);
        }
      } else if (name === 'mark') {
        // 打上血债: 短促的高音 "叮"
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(1300, now); o.frequency.exponentialRampToValueAtTime(900, now + 0.08);
        g.gain.setValueAtTime(0.09, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        o.connect(g); g.connect(master); o.start(now); o.stop(now + 0.12); track(o);
      } else if (name === 'roar') {
        // Boss 怒吼: 低沉的锯齿波下滑 + 长噪声
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sawtooth'; o.frequency.setValueAtTime(110 * pitch, now); o.frequency.exponentialRampToValueAtTime(45 * pitch, now + 0.9);
        g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.22, now + 0.08); g.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
        o.connect(g); g.connect(master); o.start(now); o.stop(now + 1.05); track(o);
        noise(now, 0.8, 300, 0.12);
      } else if (name === 'boom') {
        // 冲撞撞墙 / 地刺爆发: 短促的低频"轰"
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(120 * pitch, now); o.frequency.exponentialRampToValueAtTime(35, now + 0.25);
        g.gain.setValueAtTime(0.3, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        o.connect(g); g.connect(master); o.start(now); o.stop(now + 0.32); track(o);
        noise(now, 0.12, 400, 0.16);
      } else if (name === 'warn') {
        // 攻击预警: 两声短促的高音
        for (const d of [0, 0.09]) {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'square'; o.frequency.setValueAtTime(880 * pitch, now + d);
          g.gain.setValueAtTime(0.05, now + d); g.gain.exponentialRampToValueAtTime(0.001, now + d + 0.06);
          o.connect(g); g.connect(master); o.start(now + d); o.stop(now + d + 0.07); track(o);
        }
      } else if (name === 'wall') {
        noise(now, 0.035, 1400, 0.05);
      }
    },
  };

  function noise(t, dur, hp, vol) {
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + 0.01);
    track(src);
  }
  function track(node) { voices++; node.onended = () => { voices = Math.max(0, voices - 1); }; }

  // 第一次交互时解锁音频 (iOS/安卓/桌面浏览器都需要)
  const unlock = () => S.unlock();
  window.addEventListener('pointerdown', unlock, true);
  window.addEventListener('keydown', unlock, true);
  window.addEventListener('touchend', unlock, true);
})();

  <script>
// 地图与碰撞: 网格瓦片 + 场景物件 (精灵) 。随机地图以后在这一层之上生成 tiles/objects 即可。
(function () {
  const T = G.CONFIG.TILE;

  function hash(x, y) {
    let h = (x * 374761393 + y * 668265263) ^ 0x5bd1e995;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  class World {
    // tiles: 字符串数组, '#' 墙, '.' 岩石地面, ',' 石板地面
    constructor(tiles) {
      this.rows = tiles;
      this.h = tiles.length;
      this.w = tiles[0].length;
      this.pxW = this.w * T;
      this.pxH = this.h * T;
      this.objects = [];   // {key, x, y, def, img, ...}
      this.decals = [];    // 贴在地面上的大块贴片 (烘焙进地面层)
      this.layer = null;   // 预渲染的地面+墙体
      this.closed = new Set();   // 关闭的房门格 (ty * w + tx): 碰撞上等同墙, 但不烘焙进地面层 (门开关时不用重新烘焙)
      this.tint = null;          // 房间整体色调 (多房间地牢里区分房间类型), 烘焙时叠加
    }

    tile(tx, ty) {
      if (tx < 0 || ty < 0 || tx >= this.w || ty >= this.h) return '#';
      return this.rows[ty][tx];
    }
    isWall(tx, ty) { return this.tile(tx, ty) === '#' || (this.closed.size > 0 && this.closed.has(ty * this.w + tx)); }
    setClosed(cells) { this.closed = new Set(cells.map(([x, y]) => y * this.w + x)); }

    add(key, tx, ty, extra = {}) {
      const r = G.Assets.get(key);
      const o = Object.assign({ key, x: (tx + 0.5) * T, y: (ty + 0.5) * T, def: r.def, img: r.img, placeholder: r.placeholder }, extra);
      this.objects.push(o);
      return o;
    }
    addDecal(key, x, y, w, h) { this.decals.push({ key, x, y, w, h }); }

    // ---------------- 预渲染地面层 ----------------
    bake() {
      const c = document.createElement('canvas');
      c.width = this.pxW; c.height = this.pxH;
      const g = c.getContext('2d');
      g.imageSmoothingEnabled = false;
      const A = G.Assets;
      const fa = A.get('floor_a').img, fb = A.get('floor_b').img, fbig = A.get('floor_big').img;
      const slab = A.get('floor_slab');
      const face = A.get('wall_face').img, top = A.get('wall_top').img;
      const usedBig = new Set();

      // 石板区域的对齐原点: 每 3x2 格铺一整块石板素材
      let slabOrigin = null;
      for (let y = 0; y < this.h && !slabOrigin; y++)
        for (let x = 0; x < this.w; x++) if (this.tile(x, y) === ',') { slabOrigin = { x, y }; break; }

      for (let y = 0; y < this.h; y++) {
        for (let x = 0; x < this.w; x++) {
          const t = this.tile(x, y), px = x * T, py = y * T;
          if (t === '.') {
            if (usedBig.has(x + ',' + y)) continue;
            // 偶尔铺一块 2x2 的大岩石地砖
            const canBig = hash(x, y) < 0.18 && this.tile(x + 1, y) === '.' && this.tile(x, y + 1) === '.' &&
              this.tile(x + 1, y + 1) === '.' && !usedBig.has((x + 1) + ',' + y);
            if (canBig) {
              g.drawImage(fbig, px, py, T * 2, T * 2);
              ['0,0', '1,0', '0,1', '1,1'].forEach((k) => { const [a, b] = k.split(','); usedBig.add((x + +a) + ',' + (y + +b)); });
            } else {
              g.drawImage(hash(x + 7, y + 3) < 0.5 ? fa : fb, px, py, T, T);
            }
          } else if (t === ',') {
            const img = slab.img;
            const ox = ((x - slabOrigin.x) % 3 + 3) % 3, oy = ((y - slabOrigin.y) % 2 + 2) % 2;
            const sw = img.width / 3, sh = img.height / 2;
            g.drawImage(img, ox * sw, oy * sh, sw, sh, px, py, T, T);
          }
        }
      }
      // 墙: 下方是地面 => 画立面 (岩石墙面素材); 否则画墙顶 (程序占位)
      // (烘焙只看地图字符, 不看关闭的房门; 房门由场景每帧单独绘制)
      const isW = (x, y) => this.tile(x, y) === '#';
      for (let y = 0; y < this.h; y++) {
        for (let x = 0; x < this.w; x++) {
          if (!isW(x, y)) continue;
          const px = x * T, py = y * T;
          if (!isW(x, y + 1)) {
            const s = face.height;                               // 取正方形切片, 避免拉伸
            const off = Math.floor(hash(x, 99) * Math.max(1, face.width - s));
            g.drawImage(face, off, 0, Math.min(s, face.width), s, px, py, T, T);
            // 墙脚阴影
            const gr = g.createLinearGradient(0, py + T, 0, py + T + 26);
            gr.addColorStop(0, 'rgba(8,4,16,0.55)'); gr.addColorStop(1, 'rgba(8,4,16,0)');
            g.fillStyle = gr; g.fillRect(px, py + T, T, 26);
          } else {
            g.drawImage(top, px, py, T, T);
          }
          // 墙顶边缘描边, 让墙体轮廓清楚
          g.fillStyle = '#7a5bb0';
          if (!isW(x - 1, y) && isW(x, y + 1)) g.fillRect(px, py, 3, T);
          if (!isW(x + 1, y) && isW(x, y + 1)) g.fillRect(px + T - 3, py, 3, T);
          if (!isW(x, y - 1)) g.fillRect(px, py, T, 3);
        }
      }
      // 贴片 (泥地、洞穴入口等)
      for (const d of this.decals) {
        const img = G.Assets.get(d.key).img;
        g.drawImage(img, d.x, d.y, d.w || img.width, d.h || img.height);
      }
      // 贴地装饰 (骨头、裂纹、孔洞...) 也烘焙进来, 每帧少画很多东西
      for (const o of this.objects) {
        if (!o.def.flat) continue;
        const [ax, ay] = o.def.anchor || [0.5, 0.5];
        g.drawImage(o.img, Math.round(o.x - o.img.width * ax), Math.round(o.y - o.img.height * ay));
      }
      // 房间色调 (精英房偏红、宝箱房偏金...), 只是一层半透明颜色, 不需要额外美术资源
      if (this.tint) { g.fillStyle = this.tint; g.fillRect(0, 0, c.width, c.height); }
      this.layer = c;
    }

    // 立体物件 (需要和角色一起按 y 排序)
    standing() { return this.objects.filter((o) => !o.def.flat); }

    // ---------------- 碰撞 ----------------
    // 圆形角色在网格墙 + 圆形障碍物之间移动 (分轴移动, 贴墙可滑动)
    moveCircle(e, dx, dy, r) {
      e.x += dx; this._resolveTiles(e, r, 'x', dx);
      e.y += dy; this._resolveTiles(e, r, 'y', dy);
      for (const o of this.objects) {
        const s = o.def.solid; if (!s) continue;
        const ox = o.x, oy = o.y + (s.oy || 0);
        const vx = e.x - ox, vy = e.y - oy, d = Math.hypot(vx, vy), min = r + s.r;
        if (d < min && d > 0.0001) { e.x = ox + (vx / d) * min; e.y = oy + (vy / d) * min; }
      }
      // 障碍物推开后可能又进墙, 再做一次墙体修正
      this._resolveTiles(e, r, 'x', 0); this._resolveTiles(e, r, 'y', 0);
    }
    _resolveTiles(e, r, axis) {
      const x0 = Math.floor((e.x - r) / T), x1 = Math.floor((e.x + r) / T);
      const y0 = Math.floor((e.y - r) / T), y1 = Math.floor((e.y + r) / T);
      for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
        if (!this.isWall(tx, ty)) continue;
        const nx = Math.max(tx * T, Math.min(e.x, tx * T + T));
        const ny = Math.max(ty * T, Math.min(e.y, ty * T + T));
        const vx = e.x - nx, vy = e.y - ny, d = Math.hypot(vx, vy);
        if (d >= r) continue;
        if (d > 0.0001) { e.x = nx + (vx / d) * r; e.y = ny + (vy / d) * r; }
        else if (axis === 'x') e.x = e.x < tx * T + T / 2 ? tx * T - r : tx * T + T + r;
        else e.y = e.y < ty * T + T / 2 ? ty * T - r : ty * T + T + r;
      }
    }
  }

  G.World = World;
  G.hash = hash;
})();

  <script>
// 角色像素美术 (临时素材, 程序逐像素绘制)
// - 原素材图里没有角色, 这里按地图色板手绘像素, 1 个美术像素 = 3 个世界单位, 与地图素材的像素密度一致
// - 启动时一次性生成所有帧到离屏 canvas, 运行时只做 drawImage, 不影响性能
// - 以后有正式角色图集时, 只需让 G.CharArt 返回同样结构的帧即可, 游戏逻辑不用改
(function () {
  const PX = 3;           // 美术像素 -> 世界单位
  const O = '#140b1f';    // 统一描边色 (与地图素材的深色描边接近)

  // ---------- 像素画布工具 ----------
  function Pix(w, h) {
    const g = new Array(w * h).fill(null);
    const P = {
      w, h,
      set(x, y, c) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < w && y < h) g[y * w + x] = c; },
      get(x, y) { return x >= 0 && y >= 0 && x < w && y < h ? g[y * w + x] : null; },
      hline(x0, x1, y, c) { for (let x = x0; x <= x1; x++) P.set(x, y, c); },
      rect(x, y, rw, rh, c) { for (let j = 0; j < rh; j++) for (let i = 0; i < rw; i++) P.set(x + i, y + j, c); },
      // 描边: 所有与实心像素 4 邻接的空像素涂成描边色
      outline(c = O) {
        const add = [];
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
          if (g[y * w + x]) continue;
          if (P.get(x - 1, y) || P.get(x + 1, y) || P.get(x, y - 1) || P.get(x, y + 1)) add.push([x, y]);
        }
        add.forEach(([x, y]) => P.set(x, y, c));
        return P;
      },
      flipX() {
        const n = Pix(w, h);
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) n.set(w - 1 - x, y, g[y * w + x]);
        return n;
      },
      canvas(white = false) {
        const c = document.createElement('canvas');
        c.width = w * PX; c.height = h * PX;
        const ctx = c.getContext('2d');
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
          const col = g[y * w + x]; if (!col) continue;
          ctx.fillStyle = white ? '#ffffff' : col;
          ctx.fillRect(x * PX, y * PX, PX, PX);
        }
        return c;
      },
    };
    return P;
  }
  const frame = (pix) => ({ img: pix.canvas(), white: pix.canvas(true), w: pix.w * PX, h: pix.h * PX });

  // ---------- 玩家: 兜帽流浪者 ----------
  const PC = {
    h0: '#4b3270', h1: '#6e4fa0', h2: '#9d82d0',      // 兜帽
    c0: '#271a42', c1: '#3b2963', c2: '#55408a',      // 斗篷
    s1: '#3f8fb0', s2: '#7fd0e6',                     // 围巾 (呼应荆棘的蓝)
    f: '#0e0816', e: '#8ff6ff',                        // 脸部阴影 / 发光眼
    b1: '#221830', b2: '#3a2c4a',                      // 靴子
    g: '#b7a5dc',                                       // 手套
  };
  const PW = 18, PH = 22;   // 含 1px 描边留白

  // dir: 'down' | 'up' | 'side'(朝右, 朝左时翻转); pose: 'idle' | 'walk' | 'cast'; f: 帧号
  function drawPlayer(dir, pose, f) {
    const p = Pix(PW, PH);
    const ox = 1;
    // 行走: 第 1/3 帧身体下沉 1px, 腿部交替
    const bob = pose === 'walk' ? (f % 2 === 1 ? 1 : 0) : (pose === 'idle' && f === 1 ? 1 : 0);
    const y0 = 1 + bob;
    const X = (x) => ox + x;

    // ---- 腿 (先画, 被斗篷盖住上半) ----
    const legY = 16 + 1;
    const leg = (x, lift, fwd = 0) => {
      const top = legY - lift;
      p.rect(X(x + fwd), top, 2, 2, PC.b1);
      p.rect(X(x + fwd), top + 2, 2, 1, PC.b2);
    };
    if (dir === 'side') {
      if (pose === 'walk' && f === 1) { leg(9, 0, 1); leg(5, 1, -1); }
      else if (pose === 'walk' && f === 3) { leg(9, 1, -1); leg(5, 0, 1); }
      else { leg(8, 0); leg(6, 0); }
    } else {
      const l = pose === 'walk' && f === 1 ? 1 : 0, r = pose === 'walk' && f === 3 ? 1 : 0;
      leg(4, l); leg(10, r);
    }

    // ---- 斗篷 ----
    const cloakRows = dir === 'side'
      ? [[4, 11], [4, 11], [4, 12], [3, 12], [3, 12], [3, 12], [3, 13]]
      : [[4, 11], [3, 12], [3, 12], [3, 12], [3, 12], [2, 13], [2, 13]];
    cloakRows.forEach(([a, b], i) => {
      const y = y0 + 9 + i;
      p.hline(X(a), X(b), y, PC.c1);
      p.set(X(a), y, PC.c0); p.set(X(b), y, PC.c0);
      if (dir === 'down') { p.set(X(7), y, PC.c0); p.set(X(8), y, PC.c0); if (i < 3) p.set(X(6), y, PC.c2); }
      if (dir === 'up') p.set(X(7 + (i % 2)), y, PC.c2);
      if (dir === 'side') { p.set(X(a + 1), y, PC.c0); if (i > 1) p.set(X(b - 1), y, PC.c2); }
    });
    // 斗篷下摆随步伐摆动
    if (pose === 'walk' && (f === 1 || f === 3)) {
      const yb = y0 + 15;
      const s = f === 1 ? 1 : -1;
      p.set(X(dir === 'side' ? 13 : (s > 0 ? 13 : 2)), yb, PC.c0);
    }

    // ---- 兜帽 ----
    const hoodRows = dir === 'side'
      ? [[6, 9], [5, 11], [4, 12], [3, 12], [3, 12], [3, 12], [4, 12], [5, 11]]
      : [[6, 9], [5, 10], [4, 11], [3, 12], [3, 12], [3, 12], [3, 12], [4, 11]];
    hoodRows.forEach(([a, b], i) => {
      const y = y0 + i;
      p.hline(X(a), X(b), y, PC.h1);
      p.set(X(a), y, PC.h0);
      if (i >= 5) p.hline(X(a), X(b), y, PC.h0);
      if (i >= 1 && i <= 3) p.set(X(a + 2), y, PC.h2);
    });
    p.hline(X(6), X(8), y0 + 1, PC.h2);
    // 脸
    if (dir === 'down') {
      p.hline(X(6), X(9), y0 + 3, PC.f);
      for (let y = 4; y <= 6; y++) p.hline(X(5), X(10), y0 + y, PC.f);
      p.set(X(6), y0 + 5, PC.e); p.set(X(9), y0 + 5, PC.e);
    } else if (dir === 'side') {
      for (let y = 3; y <= 6; y++) p.hline(X(9), X(12), y0 + y, PC.f);
      p.set(X(12), y0 + 3, PC.h1);
      p.set(X(11), y0 + 5, PC.e);
      p.set(X(2), y0 + 4, PC.h0);  // 兜帽后摆
    } else {
      p.hline(X(6), X(9), y0 + 5, PC.h0);  // 背面兜帽褶
    }
    // ---- 围巾 ----
    const sy = y0 + 8;
    if (dir === 'down') { p.hline(X(4), X(11), sy, PC.s1); p.set(X(5), sy, PC.s2); p.set(X(6), sy, PC.s2); p.rect(X(9), sy + 1, 2, 2, PC.s1); }
    else if (dir === 'up') { p.hline(X(4), X(11), sy, PC.s1); p.rect(X(5), sy + 1, 2, 3, PC.s1); p.set(X(5), sy + 1, PC.s2); }
    else { p.hline(X(4), X(11), sy, PC.s1); p.set(X(9), sy, PC.s2); p.rect(X(3), sy + 1, 2, pose === 'walk' ? 3 : 2, PC.s1); }

    // ---- 手 ----
    if (pose === 'cast') {
      if (dir === 'down') { p.rect(X(2), y0 + 9, 2, 2, PC.g); p.rect(X(12), y0 + 9, 2, 2, PC.g); }
      else if (dir === 'up') { p.rect(X(2), y0 + 8, 2, 2, PC.g); p.rect(X(12), y0 + 8, 2, 2, PC.g); }
      else { p.rect(X(13), y0 + 9, 2, 2, PC.g); }
    } else {
      const sw = pose === 'walk' ? (f === 1 ? 1 : f === 3 ? -1 : 0) : 0;
      if (dir === 'side') p.rect(X(10 + sw), y0 + 12, 2, 2, PC.g);
      else { p.set(X(2), y0 + 12 + Math.max(0, sw), PC.g); p.set(X(13), y0 + 12 + Math.max(0, -sw), PC.g); }
    }
    return p.outline();
  }

  // ---------- 敌人: 深渊黏液 ----------
  // 用血红/洋红色, 和紫色地面拉开对比, 一眼能认出是敌人
  const SC = { d: '#5c1435', b: '#9c2b58', l: '#d4507a', h: '#ffc6d8', e: '#ffe066', e2: '#fff6c2', m: '#2a0716' };
  const SW = 20, SH = 17;
  // rx, ry: 椭圆半径 (压扁/拉伸); lift: 离地高度 (像素); look: 眼睛偏移 -1/0/1
  // o: 可选 { pal: 调色板, w, h: 画布尺寸, crown: 头顶荆棘冠 } —— 精英黏液王复用同一个函数
  function drawSlime(rx, ry, lift, look, angry, o = {}) {
    const C = o.pal || SC, W = o.w || SW, H = o.h || SH;
    const p = Pix(W, H);
    const cx = W / 2 - 0.5, base = H - 2 - lift, cy = base - ry + 0.5;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const dx = (x - cx) / rx, dy = (y - cy) / ry;
      if (y > base) continue;
      if (dx * dx + dy * dy <= 1) {
        // 上亮下暗的体积感
        const t = (y - (cy - ry)) / (ry * 2);
        p.set(x, y, t < 0.32 ? C.l : t < 0.78 ? C.b : C.d);
      }
    }
    // 底部平一点, 像黏在地上
    for (let x = Math.ceil(cx - rx + 1); x <= Math.floor(cx + rx - 1); x++) if (p.get(x, base - 1)) p.set(x, base, C.d);
    // 高光
    const hx = Math.round(cx - rx * 0.45), hy = Math.round(cy - ry * 0.45);
    p.set(hx, hy, C.h); p.set(hx + 1, hy, C.h); p.set(hx, hy + 1, C.h);
    if (o.crown) {
      // 荆棘冠: 头顶一圈蓝色尖刺 (呼应地图里的荆棘)
      const top = Math.round(cy - ry);
      for (let i = -3; i <= 3; i++) {
        const x = Math.round(cx + i * rx * 0.24), hgt = i % 2 === 0 ? 3 : 2;
        for (let k = 0; k < hgt; k++) p.set(x, top - k + 1, k === hgt - 1 ? '#7fd0e6' : '#2f6f8f');
      }
      p.hline(Math.round(cx - rx * 0.75), Math.round(cx + rx * 0.75), top + 2, '#2f6f8f');
    }
    // 眼睛 (体型大的眼睛也大一点)
    const big = rx > 10;
    const ey = Math.round(cy - ry * 0.05), ex = Math.round(cx) + look * (big ? 2 : 1), gap = big ? 4 : 2;
    const eye = (x) => { p.set(x, ey, C.e); if (big) { p.set(x + 1, ey, C.e); p.set(x, ey + 1, C.e); p.set(x + 1, ey + 1, C.e2); } };
    eye(ex - gap - (big ? 1 : 0)); eye(ex + gap);
    if (angry) {
      p.set(ex - gap - 1, ey - 1, C.m); p.set(ex + gap + 1, ey - 1, C.m);
      if (!big) { p.set(ex - 2, ey, C.e2); p.set(ex + 2, ey, C.e2); }
    }
    p.hline(ex - (big ? 2 : 1), ex + (big ? 2 : 1), ey + (big ? 3 : 2), C.m);
    return p.outline();
  }

  // ---------- 敌人: 荆冠黏液王 (精英) ----------
  const EC = { d: '#3a0b2c', b: '#6e1a4c', l: '#a8346a', h: '#ffb0cc', e: '#ffd23f', e2: '#fff3b0', m: '#1c0414' };
  const EO = { pal: EC, w: 36, h: 30, crown: true };

  // ---------- 敌人: 虚空甲虫 (快速突进) ----------
  // 酸绿色甲壳, 小而快; 朝右绘制, 朝左时翻转
  const BC = { d: '#1f4a1c', b: '#3f8a2e', l: '#79c94a', h: '#d8ffb0', head: '#16261a', e: '#ff4a4a', leg: '#0f1a10' };
  function drawBeetle(f, wind) {
    const W = 18, H = 14, p = Pix(W, H);
    const cx = 7.5, cy = 7 - (wind ? 1 : 0), rx = 5.6, ry = 4.2;
    // 腿 (3 对, 两帧交替)
    const legs = [3, 7, 11];
    legs.forEach((lx, i) => {
      const up = (i + f) % 2 === 0 ? 0 : 1;
      p.set(lx, Math.round(cy - ry) - 1 + up, BC.leg); p.set(lx - 1, Math.round(cy - ry) - 2 + up, BC.leg);
      p.set(lx, Math.round(cy + ry) + 1 - up, BC.leg); p.set(lx - 1, Math.round(cy + ry) + 2 - up, BC.leg);
    });
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const dx = (x - cx) / rx, dy = (y - cy) / ry;
      if (dx * dx + dy * dy <= 1) p.set(x, y, dy < -0.35 ? BC.l : dy < 0.45 ? BC.b : BC.d);
    }
    // 甲壳中缝 + 高光
    p.hline(2, 12, Math.round(cy), BC.d);
    p.set(5, Math.round(cy - 2), BC.h); p.set(6, Math.round(cy - 2), BC.h); p.set(5, Math.round(cy - 3), BC.h);
    // 头 + 眼 + 颚
    p.rect(13, Math.round(cy) - 1, 2, 3, BC.head);
    p.set(14, Math.round(cy) - 1, BC.e); p.set(14, Math.round(cy) + 1, BC.e);
    p.set(15, Math.round(cy) - 2, BC.head); p.set(15, Math.round(cy) + 2, BC.head);
    if (wind) { p.set(16, Math.round(cy) - 2, BC.head); p.set(16, Math.round(cy) + 2, BC.head); }
    return p.outline();
  }

  // ---------- 敌人: 腐化之眼 (远程) ----------
  // 漂浮的眼球 + 下垂触须; lx/ly 为瞳孔朝向 (-1/0/1), charge 为蓄力发光
  const YC = { d: '#3c1438', b: '#6e2a62', l: '#a24e8e', s: '#efdbe6', s2: '#c9a9bd', i: '#ff7a2a', i2: '#ffe066', pu: '#1a0612', v: '#d0304a' };
  function drawEye(lx, ly, charge, wig) {
    const W = 18, H = 20, p = Pix(W, H);
    const cx = 8.5, cy = 7.5, R = 6.4;
    // 触须
    [5, 8.5, 12].forEach((tx, i) => {
      for (let k = 0; k < 5; k++) {
        const x = Math.round(tx + (k > 1 ? ((i + wig + k) % 2 ? 1 : -1) * (k > 3 ? 1 : 0.5) : 0));
        p.set(x, 13 + k, k < 2 ? YC.b : YC.d);
      }
    });
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const d = Math.hypot(x - cx, y - cy);
      if (d <= R) p.set(x, y, d > R - 1.3 ? (y < cy ? YC.l : YC.b) : (y > cy + 2 ? YC.s2 : YC.s));
    }
    // 血丝
    p.set(4, 6, YC.v); p.set(5, 9, YC.v); p.set(12, 5, YC.v);
    // 虹膜 + 瞳孔 (跟随朝向)
    const ix = Math.round(cx + lx * 1.8), iy = Math.round(cy + ly * 1.6);
    const ic = charge ? YC.i2 : YC.i;
    for (let y = -2; y <= 2; y++) for (let x = -2; x <= 2; x++) if (x * x + y * y <= 5) p.set(ix + x, iy + y, ic);
    p.set(ix, iy, YC.pu); p.set(ix + 1, iy, YC.pu);
    if (charge) { p.set(ix - 1, iy - 1, '#ffffff'); }
    else p.set(ix - 1, iy - 1, YC.i2);
    return p.outline();
  }

  // ---------- 生成全部帧 ----------
  const Art = {
    PX,
    Pix, frame, OUTLINE: O,     // 像素工具, 给其他文件里的角色 (例如 js/boss.js) 复用
    build() {
      const player = {};
      for (const dir of ['down', 'up', 'side']) {
        player[dir] = {
          idle: [0, 1].map((f) => frame(drawPlayer(dir, 'idle', f))),
          walk: [0, 1, 2, 3].map((f) => frame(drawPlayer(dir, 'walk', f))),
          cast: [frame(drawPlayer(dir, 'cast', 0))],
        };
      }
      // 朝左 = 朝右水平翻转 (预先生成, 避免运行时 scale(-1) 造成的半像素偏移)
      player.left = {};
      for (const pose of ['idle', 'walk', 'cast']) {
        player.left[pose] = player.side[pose].map((_, i) => frame(drawPlayer('side', pose, pose === 'walk' ? i : i).flipX()));
      }
      player.right = player.side;
      const slime = {
        idle: [frame(drawSlime(7, 5, 0, 0)), frame(drawSlime(7.6, 4.5, 0, 0))],
        idleL: [frame(drawSlime(7, 5, 0, -1)), frame(drawSlime(7.6, 4.5, 0, -1))],
        idleR: [frame(drawSlime(7, 5, 0, 1)), frame(drawSlime(7.6, 4.5, 0, 1))],
        hopL: [frame(drawSlime(6.2, 6.2, 2, -1)), frame(drawSlime(7.8, 4.3, 0, -1))],
        hopR: [frame(drawSlime(6.2, 6.2, 2, 1)), frame(drawSlime(7.8, 4.3, 0, 1))],
        windL: frame(drawSlime(8.6, 3.8, 0, -1, true)),
        windR: frame(drawSlime(8.6, 3.8, 0, 1, true)),
        lungeL: frame(drawSlime(7.6, 5.4, 3, -1, true)),
        lungeR: frame(drawSlime(7.6, 5.4, 3, 1, true)),
      };
      // 精英: 荆冠黏液王 (复用黏液绘制, 尺寸约 2 倍)
      const E = (rx, ry, lift, look, angry) => frame(drawSlime(rx, ry, lift, look, angry, EO));
      const elite = {
        idleL: [E(13, 9, 0, -1), E(13.8, 8.4, 0, -1)], idleR: [E(13, 9, 0, 1), E(13.8, 8.4, 0, 1)],
        moveL: [E(12, 10, 1, -1), E(14, 8, 0, -1)], moveR: [E(12, 10, 1, 1), E(14, 8, 0, 1)],
        windL: E(15.5, 7, 0, -1, true), windR: E(15.5, 7, 0, 1, true),
        jumpL: E(11.5, 11, 0, -1, true), jumpR: E(11.5, 11, 0, 1, true),
      };
      // 甲虫: 朝右绘制, 朝左翻转
      const beetle = { R: [0, 1].map((f) => frame(drawBeetle(f, false))), windR: frame(drawBeetle(0, true)) };
      beetle.L = [0, 1].map((f) => frame(drawBeetle(f, false).flipX()));
      beetle.windL = frame(drawBeetle(0, true).flipX());
      // 眼魔: 9 个瞳孔朝向 x 2 帧触须, 另有蓄力发光
      const eye = {};
      for (const ly of [-1, 0, 1]) for (const lx of [-1, 0, 1]) {
        eye[lx + ',' + ly] = [0, 1].map((w) => frame(drawEye(lx, ly, false, w)));
        eye[lx + ',' + ly + 'c'] = frame(drawEye(lx, ly, true, 0));
      }
      Art.player = player;
      Art.slime = slime;
      Art.elite = elite;
      Art.beetle = beetle;
      Art.eye = eye;
      Art.slimeColors = [SC.l, SC.b, SC.d, SC.h];
      Art.colors = {
        slime: [SC.l, SC.b, SC.d, SC.h],
        elite: [EC.l, EC.b, EC.d, '#4aa0bf', EC.h],
        beetle: [BC.l, BC.b, BC.d, BC.h],
        eye: [YC.l, YC.b, YC.s, YC.i],
      };
      return Art;
    },
  };
  G.CharArt = Art;
})();

  <script>
// 玩家: 八方向移动 (带加减速) / 四向朝向与行走动画 / 远程奥术飞弹 / 生命值与受击
(function () {
  const C = G.CONFIG;
  const DIRS = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 };

  function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; }

  class Player {
    constructor(x, y) { this.reset(x, y); }

    reset(x, y) {
      const P = G.COMBAT.player;
      Object.assign(this, {
        x, y, vx: 0, vy: 0, kbx: 0, kby: 0,
        hp: P.maxHp, maxHp: P.maxHp, dead: false,
        dir: 'down',                     // 精灵朝向 (四向)
        aim: { x: 0, y: 1 }, aimAng: Math.PI / 2, orbAng: Math.PI / 2,
        moving: false, animDist: 0, idleT: 0,
        fireCd: 0, castT: 0, recoil: 0, aimHold: 0,
        invuln: 0, flash: 0,
        dash: 0, dashDir: { x: 0, y: 0 },
        t: 0,
      });
    }

    get cx() { return this.x; }
    get cy() { return this.y - 28; }   // 身体中心 (发射点/受击点), y 是脚底

    update(dt, scene) {
      const I = G.Input, P = G.COMBAT.player, B = G.COMBAT.bolt;
      this.t += dt;
      this.fireCd = Math.max(0, this.fireCd - dt);
      this.castT = Math.max(0, this.castT - dt);
      this.aimHold = Math.max(0, this.aimHold - dt);
      this.invuln = Math.max(0, this.invuln - dt);
      this.flash = Math.max(0, this.flash - dt);
      this.recoil = Math.max(0, this.recoil - dt * 6);
      if (this.dead) { this.vx = this.vy = 0; return; }

      // ---- 移动: 速度平滑逼近目标速度, 起步/停步不突兀, 也不会有摇杆抖动 ----
      const mx = I.move.x, my = I.move.y;
      if (this.dash > 0) {
        this.dash -= dt;
        this.vx = this.dashDir.x * C.PLAYER_SPEED * 3.2;
        this.vy = this.dashDir.y * C.PLAYER_SPEED * 3.2;
        if (this.dash <= 0) { this.vx *= 0.3; this.vy *= 0.3; }
      } else {
        const tx = mx * C.PLAYER_SPEED, ty = my * C.PLAYER_SPEED;
        const rate = (Math.hypot(tx, ty) > 1 ? P.accel : P.decel) * dt;
        const dx = tx - this.vx, dy = ty - this.vy, d = Math.hypot(dx, dy);
        if (d <= rate) { this.vx = tx; this.vy = ty; } else { this.vx += (dx / d) * rate; this.vy += (dy / d) * rate; }
      }
      // 击退速度单独衰减
      const kd = Math.exp(-dt * 10);
      this.kbx *= kd; this.kby *= kd;
      const ox = this.x, oy = this.y;
      scene.world.moveCircle(this, (this.vx + this.kbx) * dt, (this.vy + this.kby) * dt, C.PLAYER_RADIUS);
      const moved = Math.hypot(this.x - ox, this.y - oy);
      this.moving = Math.hypot(this.vx, this.vy) > 25 && moved > 0.2;
      this.animDist = this.moving ? this.animDist + moved : 0;
      this.idleT = this.moving ? 0 : this.idleT + dt;

      // ---- 闪避 ----
      if (I.pressed.dash && scene.cooldown.dash === 0) {
        const l = Math.hypot(mx, my);
        this.dashDir = l > 0.1 ? { x: mx / l, y: my / l } : { x: this.aim.x, y: this.aim.y };
        this.dash = 0.16; scene.cooldown.dash = 0.6;
        this.invuln = Math.max(this.invuln, P.dashIframes);
        scene.fx.push({ type: 'dash', x: this.x, y: this.y, t: 0, life: 0.3 });
      }

      // ---- 瞄准: 电脑跟鼠标; 手机跟右侧拖动方向; 都没有输入时保持上一次的方向 ----
      let ax = null, ay = null;
      if (I.mode === 'kbm' && I.mouse.inside) {
        const m = G.Display.screenToWorld(I.mouse.x, I.mouse.y, scene.cam);
        ax = m.x - this.cx; ay = m.y - this.cy;
      } else if (I.aim.active && I.aim.has) {
        // 手机: 右侧拖动方向就是射击方向 (不自动瞄准、不追踪)
        ax = I.aim.x; ay = I.aim.y;
      }
      if (ax !== null && Math.hypot(ax, ay) > 0.001) {
        const l = Math.hypot(ax, ay);
        this.aim = { x: ax / l, y: ay / l };
        this.aimAng = Math.atan2(ay, ax);
      }
      // 灵球平滑转到瞄准方向 (不瞬间跳)
      this.orbAng += angDiff(this.aimAng, this.orbAng) * Math.min(1, dt * 16);

      // ---- 攻击: 按住持续发射 ----
      if (I.held.attack && this.fireCd === 0) {
        this.fireCd = B.interval;
        this.castT = 0.2;
        this.aimHold = 0.4;   // 射击后一小段时间保持面向瞄准方向, 连射时不会来回翻转
        this.recoil = 1;
        this.orbAng = this.aimAng;  // 发射瞬间对准, 保证子弹方向和指向一致
        const o = this.orbPos();
        // 道具事件: 开火 (例如寂静之弦把停火后的第一发变成贯穿箭); opts 为空就是普通子弹
        const fire = { cb: scene.combat, player: this, opts: {} };
        G.Items.emit('fire', fire);
        scene.combat.fireBolt(o.x, o.y, this.aim.x, this.aim.y, fire.opts);
      }

      // ---- 朝向: 施法/电脑瞄准时看瞄准方向, 否则看移动方向; 带滞回, 45° 附近不来回闪 ----
      let faceAng = null;
      if (this.aimHold > 0 || I.held.attack || (I.mode === 'kbm' && I.mouse.inside)) faceAng = this.aimAng;
      else if (this.moving) faceAng = Math.atan2(this.vy, this.vx);
      if (faceAng !== null) {
        const cur = DIRS[this.dir];
        if (Math.abs(angDiff(faceAng, cur)) > Math.PI / 4 + 0.17) {
          let best = this.dir, bd = 9;
          for (const k in DIRS) { const d = Math.abs(angDiff(faceAng, DIRS[k])); if (d < bd) { bd = d; best = k; } }
          this.dir = best;
        }
      }
    }

    orbPos() {
      const r = 24 - this.recoil * 5;
      return { x: this.cx + Math.cos(this.orbAng) * r, y: this.cy + 4 + Math.sin(this.orbAng) * r * 0.75 + Math.sin(this.t * 4) * 1.5 };
    }

    heal(n) { if (!this.dead) this.hp = Math.min(this.maxHp, this.hp + n); }

    hurt(dmg, fromX, fromY, scene) {
      if (this.dead || this.invuln > 0) return false;
      const P = G.COMBAT.player;
      this.hp = Math.max(0, this.hp - dmg);
      this.invuln = P.iframes; this.flash = 0.14;
      const dx = this.x - fromX, dy = this.y - fromY, l = Math.hypot(dx, dy) || 1;
      this.kbx = (dx / l) * P.knockback; this.kby = (dy / l) * P.knockback;
      scene.shake = Math.max(scene.shake, 7); scene.hurtFlash = 1;
      if (navigator.vibrate) navigator.vibrate(40);
      scene.combat.text(this.cx, this.cy - 26, '-' + dmg, '#ff6a6a');
      G.Items.emit('playerHurt', { cb: scene.combat, player: this, dmg, fromX, fromY });   // 道具事件: 玩家受伤
      if (this.hp <= 0) { this.dead = true; scene.onPlayerDeath(); }
      return true;
    }

    currentFrame() {
      const A = G.CharArt.player[this.dir];
      // 边走边射时保留行走动画 (不然像在滑行), 站定射击才用施法姿势
      if (this.moving) return A.walk[Math.floor(this.animDist / 17) % 4];
      if (this.castT > 0) return A.cast[0];
      return A.idle[Math.floor(this.idleT / 0.55) % 2];
    }

    // snap: 把世界坐标对齐到设备像素, 防止精灵和镜头之间 1px 抖动
    draw(ctx, snap) {
      if (this.dead) return;
      const f = this.currentFrame();
      const orb = this.orbPos();
      const behind = Math.sin(this.orbAng) < -0.25;   // 朝上瞄准时灵球在身后
      // 影子
      ctx.fillStyle = 'rgba(8,4,16,0.45)';
      ctx.beginPath(); ctx.ellipse(snap(this.x), snap(this.y), 16, 6, 0, 0, Math.PI * 2); ctx.fill();
      if (behind) this.drawOrb(ctx, orb, snap);
      const blink = this.invuln > 0 && this.flash <= 0 && Math.floor(this.t / 0.07) % 2 === 0;
      ctx.globalAlpha = blink ? 0.35 : 1;
      const x = snap(this.x - f.w / 2), y = snap(this.y - f.h + 3);
      ctx.drawImage(f.img, x, y);
      if (this.flash > 0) ctx.drawImage(f.white, x, y);
      ctx.globalAlpha = 1;
      if (!behind) this.drawOrb(ctx, orb, snap);
    }

    drawOrb(ctx, o, snap) {
      const s = 3, x = snap(o.x), y = snap(o.y), pulse = this.castT > 0 ? 1 : 0;
      ctx.fillStyle = 'rgba(126,240,255,0.25)';
      ctx.fillRect(x - s * (2 + pulse), y - s * (2 + pulse), s * (4 + 2 * pulse), s * (4 + 2 * pulse));
      ctx.fillStyle = '#3f8fb0'; ctx.fillRect(x - s * 1.5, y - s * 1.5, s * 3, s * 3);
      ctx.fillStyle = '#7ef0ff'; ctx.fillRect(x - s, y - s, s * 2, s * 2);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x - s, y - s, s, s);
    }
  }

  G.Player = Player;
  G.angDiff = angDiff;
})();

  <script>
// 道具系统 (通用): 道具注册表 + 战斗事件分发
//
// 一件道具 = 一个定义对象, 通过 G.Items.define() 登记:
//   {
//     id: 'bullet',               // 唯一 id
//     name: '血债',
//     set: 'crimson',             // 所属流派 (可选, 用于 grantSet)
//     desc: (cfg) => '...',       // 描述 (可读取数值配置生成, 改数值后描述自动更新)
//     icon: { rows: [...], pal: {...} },   // 像素图标 (可选)
//     cooldown: 0,                // 内置冷却 (秒, 可选): 两次触发之间的最短间隔
//     perFrame: 0,                // 每帧最多触发次数 (可选, 0 = 不限)
//     on: {                       // 监听的事件 -> 处理函数 (ctx 内容见下方 EVENTS)
//       beforeHit(ctx) {...}, kill(ctx) {...}, ...
//     },
//   }
//
// 战斗代码只调用 G.Items.emit(事件名, ctx), 不需要知道有哪些道具。
// 数值统一放在 js/config.js (例如 G.CRIMSON), 道具代码里只读取, 不写死数字。
(function () {
  // 支持的触发事件 (ctx 中都带 cb = 战斗系统, 方便调用 hurtEnemy / areaDamage / 特效)
  const EVENTS = {
    beforeHit: '玩家攻击命中敌人, 伤害结算之前 { enemy, source, dmg }  (可在这里给敌人加状态, 让致命一击也能触发)',
    hit: '敌人受到伤害之后 { enemy, source, dmg, killed }',
    kill: '敌人死亡 { enemy, source }  (每个敌人只会派发一次)',
    aoeHit: '范围伤害命中敌人, 伤害结算之前 { enemy, source, meta, x, y, radius }',
    playerHurt: '玩家受到伤害之后 { player, dmg, fromX, fromY }',
    pickup: '获得道具 { item }',
    explode: '道具效果引发的爆炸结算之后 { kind, x, y, radius, dmg, echo, replay(scale) }  (echo = 回响额外触发的副本)',
    // 第 15 版新增 (射术道具用; 只由战斗系统 / 玩家派发, 道具处理函数里不会再派发这三个事件)
    fire: '玩家按下射击、子弹生成之前 { cb, player, opts }  (处理函数可以改写 opts, 例如变成贯穿箭)',
    boltWall: '玩家子弹撞到墙 / 障碍物 { cb, bolt, x, y, reflect(), bounce }  (处理函数调用 reflect() 并设 bounce = true 让子弹反弹)',
    clash: '玩家子弹碰到敌方投射物 { cb, bolt, ebolt, consume }  (只有拥有监听该事件的道具时战斗系统才做这项检测)',
  };
  const MAX_DEPTH = 6;          // 事件嵌套上限: 道具触发里再触发事件, 超过这个深度直接丢弃 (防无限递归)

  const defs = {};              // id -> 定义
  const systems = [];           // 流派运行时
  const owned = new Set();
  let handlers = {};            // 事件 -> [已拥有道具的处理函数], 获得/重置道具时重建
  let depth = 0, frame = 0;
  const lastFire = {}, frameCount = {};

  const I = G.Items = {
    EVENTS,
    stats: { emitted: 0, dropped: 0, cooldownSkips: 0, perFrameSkips: 0 },   // dropped = 超过嵌套上限被丢弃的事件

    define(def) {
      if (defs[def.id]) console.warn('[items] 重复定义道具', def.id);
      defs[def.id] = def;
      return def;
    },
    get: (id) => defs[id],
    all: () => Object.values(defs),
    has: (id) => owned.has(id),
    wants: (type) => !!(handlers[type] && handlers[type].length),   // 是否有已拥有的道具监听这个事件 (没有就跳过相关检测, 省性能)
    owned: () => [...owned].map((id) => defs[id]),

    grant(id, silent) {
      const d = defs[id];
      if (!d || owned.has(id)) return false;
      owned.add(id); rebuild();
      if (!silent) G.Display.toast(`获得 ${d.name}: ${I.describe(d)}`, 2600);
      I.emit('pickup', { item: d });
      return true;
    },
    grantSet(set, silent) {
      for (const d of I.all()) if (d.set === set) I.grant(d.id, true);
      if (!silent) G.Display.toast(`已获得「${{ crimson: '猩红债主', relic: '通用道具', arsenal: '射术道具' }[set] || set}」全部道具`, 1500);
    },
    reset() { owned.clear(); rebuild(); for (const k in lastFire) delete lastFire[k]; },
    describe: (d) => (typeof d.desc === 'function' ? d.desc() : d.desc || ''),

    // 每帧开始时调用 (重置每帧触发计数)
    tick() { frame++; },

    // 派发事件: 只调用已拥有且监听了该事件的道具; 有嵌套深度保护、冷却和每帧上限
    emit(type, ctx) {
      const list = handlers[type];
      if (!list || !list.length) return;
      if (depth >= MAX_DEPTH) { I.stats.dropped++; return; }
      depth++;
      try {
        const now = performance.now() / 1000;
        for (const { d, fn } of list) {
          if (d.cooldown && lastFire[d.id] != null && now - lastFire[d.id] < d.cooldown) { I.stats.cooldownSkips++; continue; }
          if (d.perFrame) {
            const key = d.id + '@' + frame;
            if ((frameCount[key] || 0) >= d.perFrame) { I.stats.perFrameSkips++; continue; }
            frameCount[key] = (frameCount[key] || 0) + 1;
          }
          I.stats.emitted++;
          // 处理函数返回 true 表示"确实触发了效果", 用来计算冷却
          if (fn(ctx) === true && d.cooldown) lastFire[d.id] = now;
        }
      } finally { depth--; }
      // 清理旧的每帧计数, 避免对象无限增长
      if (frame % 120 === 0) for (const k in frameCount) if (!k.endsWith('@' + frame)) delete frameCount[k];
    },

    // 通用像素图标绘制 (掉落物 / 以后的道具界面都可以用)
    drawIcon(ctx, id, x, y, u) {
      const d = defs[id]; if (!d || !d.icon) return;
      const { rows, pal } = d.icon, w = rows[0].length, h = rows.length;
      rows.forEach((row, j) => [...row].forEach((ch, i) => {
        if (ch === '.' || !pal[ch]) return;
        ctx.fillStyle = pal[ch]; ctx.fillRect(x + (i - w / 2) * u, y + (j - h) * u, u, u);
      }));
    },

    // ---------- 流派运行时 (system) ----------
    // 有些流派需要自己的持续状态和绘制 (例如猩红债主的血债计时、爆发队列、特效)。
    // 它们注册为 system, 战斗系统在固定时机统一调用, 不需要知道具体是哪个流派:
    //   reset(clearAll) / update(cb, dt) / drawGround(ctx, cb, snap) / drawEnemy(ctx, e, snap, top) / drawTop(ctx, snap) / lights(cb)
    registerSystem(sys) { systems.push(sys); return sys; },
    run(method, ...args) { for (const s of systems) if (s[method]) s[method](...args); },
    lights(cb) { const out = []; for (const s of systems) if (s.lights) for (const L of s.lights(cb)) out.push(L); return out; },

    // 宝箱掉落: 掉落表在 G.ITEM_LOOT (js/config.js)
    // 已经获得、或已经掉在某处地上还没捡的道具不会再次掉落 (宝箱和房间奖励共用, 不会出现两件一样的)
    // onGround(id): 由地图系统提供 (多房间地牢会检查所有房间地上的掉落物)
    onGround: null,
    available(id) { return !!defs[id] && !owned.has(id) && !(I.onGround && I.onGround(id)); },
    onChestOpened(cb, chestKey, x, y) {
      for (const id of (G.ITEM_LOOT && G.ITEM_LOOT[chestKey]) || []) if (I.available(id)) cb._drop('item', x, y + 20, { item: id });
    },
  };

  function rebuild() {
    handlers = {};
    for (const id of owned) {
      const d = defs[id];
      for (const ev in d.on || {}) (handlers[ev] = handlers[ev] || []).push({ d, fn: d.on[ev] });
    }
  }

  // 快速测试: 网址末尾加 #crimson 开局直接获得猩红债主全部道具
  // #crimson = 猩红债主三件, #relics = 四件通用道具, #arsenal = 四件射术道具, #all = 全部
  I.startSets = { '#crimson': ['crimson'], '#relics': ['relic'], '#arsenal': ['arsenal'], '#all': ['crimson', 'relic', 'arsenal'] }[location.hash] || [];
  I.grantStart = (silent) => { for (const st of I.startSets) I.grantSet(st, silent); };
})();

  <script>
// 怪物行为: 每种怪物只写"它和别的怪不一样的部分"。
// 通用部分 (发现玩家 / 游荡 / 搜索 / 寻路 / 碰撞 / 受击 / 死亡 / 掉落) 都在 combat.js 里, 这里直接复用。
//
// 每种怪物提供:
//   init(e)                     -- 生成时的额外字段
//   think(e, dt, cb, p, per)    -- 'chase' 及自身特有状态下的决策, 返回 {mx, my, speed} (移动方向与速度)
//   frame(e)                    -- 当前帧 {f, lift}; lift 为离地绘制高度
//   drawGround(ctx, e, snap)    -- 可选: 画在地面上的预警 (蓄力圈、落点等)
//   light(e)                    -- 可选: 光照
// 每种怪物的数值来自 G.MONSTERS[type]
(function () {
  const C = G.CONFIG;
  const rand = (a, b) => a + Math.random() * (b - a);
  const unit = (x, y) => { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; };

  // 贴身接触伤害 (近战黏液、精英黏液王共用)
  function contactDamage(e, cb, p, M) {
    if (p.dead || e.air || e.cd > 0) return;
    if (Math.hypot(p.x - e.x, p.y - e.y) < e.r + C.PLAYER_RADIUS + 4) {
      if (p.hurt(M.damage, e.x, e.y, cb.scene)) e.cd = M.attackInterval;
    }
  }

  const AI = {};

  // ================= 1. 近战追击型: 深渊黏液 =================
  AI.slime = {
    hitH: 14,
    think(e, dt, cb, p, per) {
      const M = e.M;
      contactDamage(e, cb, p, M);
      const dir = cb.chaseDir(e, p, per, dt);
      // 贴近后放慢, 避免和玩家顶来顶去
      return dir ? { mx: dir.x, my: dir.y, speed: per.d < e.r + C.PLAYER_RADIUS + 10 ? M.speed * 0.4 : M.speed } : null;
    },
    frame(e) {
      const A = G.CharArt.slime, R = e.face > 0;
      if (e.state === 'dead') return { f: R ? A.windR : A.windL };
      if (e.cd > e.M.attackInterval - 0.25) return { f: R ? A.windR : A.windL };   // 刚咬到人时压扁一下
      if (Math.hypot(e.vx, e.vy) > 10) return { f: (R ? A.hopR : A.hopL)[Math.floor(e.hopT * 2) % 2] };
      return { f: (e.lastSeen ? (R ? A.idleR : A.idleL) : A.idle)[Math.floor(e.animT / 0.4) % 2] };
    },
    light: () => ({ r: 70, color: '255,90,120' }),
  };

  // ================= 2. 快速突进型: 虚空甲虫 =================
  AI.beetle = {
    hitH: 10,
    init(e) { e.dashDir = { x: 1, y: 0 }; },
    think(e, dt, cb, p, per) {
      const M = e.M;
      if (e.state === 'windup') {
        e.timer -= dt;
        // 前段跟着玩家转向, 最后 0.15 秒锁定方向 (留出躲闪时间)
        if (e.timer > 0.15) e.dashDir = unit(per.dx, per.dy);
        e.blink = e.timer < M.windup * 0.5;
        if (e.timer <= 0) { e.state = 'dash'; e.timer = M.dashTime; e.hitDone = false; e.blink = false; }
        return { mx: 0, my: 0, speed: 0 };
      }
      if (e.state === 'dash') {
        e.timer -= dt;
        if (!e.hitDone && !p.dead && Math.hypot(p.x - e.x, p.y - e.y) < e.r + C.PLAYER_RADIUS + 6) {
          e.hitDone = true;
          p.hurt(M.damage, e.x, e.y, cb.scene);
        }
        // 撞墙/撞障碍会提前停下并短暂眩晕
        if (e.timer <= 0 || e.blockedT > 0.06) {
          e.state = 'recover'; e.timer = e.blockedT > 0.06 ? 0.7 : 0.35; e.cd = M.attackInterval;
          if (e.blockedT > 0.06) cb.puff(e.x, e.y - 8, '#79c94a', 6);
        }
        return { mx: e.dashDir.x, my: e.dashDir.y, speed: M.dashSpeed, instant: true };
      }
      if (e.state === 'recover') {
        e.timer -= dt;
        if (e.timer <= 0) e.state = 'chase';
        return { mx: 0, my: 0, speed: 0 };
      }
      // chase: 快速接近; 进入范围且直线无阻挡 -> 蓄力冲刺
      if (per.canSee && e.cd === 0 && per.d < M.triggerRange && cb.los(e.x, e.y, p.x, p.y, true, e.r)) {
        e.state = 'windup'; e.timer = M.windup; e.dashDir = unit(per.dx, per.dy);
        return { mx: 0, my: 0, speed: 0 };
      }
      const dir = cb.chaseDir(e, p, per, dt);
      // 冷却中绕着玩家走, 而不是贴脸
      if (dir && e.cd > 0 && per.d < 150) {
        const s = e.id % 2 ? 1 : -1;
        return { mx: -dir.y * s, my: dir.x * s, speed: e.M.speed * 0.7 };
      }
      return dir ? { mx: dir.x, my: dir.y, speed: M.speed } : null;
    },
    frame(e) {
      const A = G.CharArt.beetle, R = (e.state === 'windup' || e.state === 'dash' ? e.dashDir.x : e.face) > 0;
      if (e.state === 'windup' || e.state === 'dead') return { f: R ? A.windR : A.windL };
      const moving = Math.hypot(e.vx, e.vy) > 10;
      return { f: (R ? A.R : A.L)[moving ? Math.floor(e.animT * (e.state === 'dash' ? 24 : 12)) % 2 : 0] };
    },
    drawGround(ctx, e) {
      if (e.state !== 'windup') return;
      const M = e.M, k = 1 - e.timer / M.windup, L = M.dashSpeed * M.dashTime;
      const nx = -e.dashDir.y, ny = e.dashDir.x, w = e.r;
      ctx.fillStyle = `rgba(150,255,110,${0.1 + k * 0.2})`;
      ctx.beginPath();
      ctx.moveTo(e.x + nx * w, e.y + ny * w); ctx.lineTo(e.x + nx * w + e.dashDir.x * L, e.y + ny * w + e.dashDir.y * L);
      ctx.lineTo(e.x - nx * w + e.dashDir.x * L, e.y - ny * w + e.dashDir.y * L); ctx.lineTo(e.x - nx * w, e.y - ny * w);
      ctx.fill();
    },
    light: () => ({ r: 55, color: '140,255,110' }),
  };

  // ================= 3. 远程攻击型: 腐化之眼 =================
  AI.eye = {
    hitH: 34,        // 漂浮在半空, 受击/发射点比地面高
    init(e) { e.strafe = Math.random() < 0.5 ? 1 : -1; e.strafeT = rand(1.2, 2.4); e.look = { x: 0, y: 1 }; },
    think(e, dt, cb, p, per) {
      const M = e.M;
      if (per.d > 1) e.look = unit(per.dx, per.dy);
      if (e.state === 'aim') {
        e.timer -= dt;
        e.blink = e.timer < M.windup * 0.5;
        if (e.timer <= 0) {
          e.blink = false;
          // 朝"发射这一刻"玩家身体的位置射出直线弹, 之后不追踪
          const sx = e.x, sy = e.y - this.hitH;
          const d = unit(p.cx - sx, p.cy - sy);
          cb.fireEnemyBolt(sx, sy, d.x, d.y, { speed: M.projSpeed, range: M.projRange, r: M.projRadius, dmg: M.damage, h: this.hitH, color: 'eye' });
          e.state = 'chase'; e.cd = M.attackInterval * rand(0.85, 1.15);
        }
        return { mx: 0, my: 0, speed: 0 };
      }
      // 能看到玩家、冷却好了、弹道不被挡 -> 蓄力瞄准
      if (per.canSee && e.cd === 0 && per.d < M.projRange * 0.9 && cb.los(e.x, e.y, p.x, p.y, true, 4)) {
        e.state = 'aim'; e.timer = M.windup;
        return { mx: 0, my: 0, speed: 0 };
      }
      if (!per.canSee) { const dir = cb.chaseDir(e, p, per, dt); return dir ? { mx: dir.x, my: dir.y, speed: M.speed } : null; }
      // 保持距离: 太近后退, 太远靠近, 合适就横向绕圈走位
      e.strafeT -= dt;
      if (e.strafeT <= 0 || e.blockedT > 0.3) { e.strafe *= -1; e.strafeT = rand(1.2, 2.4); e.blockedT = 0; }
      const to = unit(per.dx, per.dy), side = { x: -to.y * e.strafe, y: to.x * e.strafe };
      let mx = side.x, my = side.y, speed = M.speed * 0.7;
      if (per.d < M.keepMin) { mx = -to.x * 0.8 + side.x * 0.6; my = -to.y * 0.8 + side.y * 0.6; speed = M.speed; }
      else if (per.d > M.keepMax) { const dir = cb.chaseDir(e, p, per, dt) || to; mx = dir.x; my = dir.y; speed = M.speed; }
      const u = unit(mx, my);
      return { mx: u.x, my: u.y, speed };
    },
    frame(e) {
      const A = G.CharArt.eye;
      const lx = Math.abs(e.look.x) > 0.38 ? Math.sign(e.look.x) : 0, ly = Math.abs(e.look.y) > 0.38 ? Math.sign(e.look.y) : 0;
      const key = lx + ',' + ly;
      const lift = 12 + Math.round(Math.sin(e.animT * 3) * 2) * 3;   // 上下漂浮 (按像素步进, 不糊)
      if (e.state === 'aim') return { f: A[key + 'c'], lift };
      return { f: A[key][Math.floor(e.animT * 4) % 2], lift };
    },
    drawGround(ctx, e, snap) {
      if (e.state !== 'aim') return;
      const k = 1 - e.timer / e.M.windup;
      ctx.strokeStyle = `rgba(255,140,60,${0.25 + k * 0.5})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(snap(e.x), snap(e.y - this.hitH), 18 + (1 - k) * 14, 0, Math.PI * 2); ctx.stroke();
    },
    light: (e) => ({ r: e.state === 'aim' ? 120 : 70, color: '255,140,60', oy: -34 }),
  };

  // ================= 4. 精英: 荆冠黏液王 =================
  // 特殊机制: 跳跃重砸 —— 蓄力时地面出现落点红圈, 起跳后空中无法被命中, 落地造成范围伤害并向四周放出一圈弹幕
  AI.elite = {
    hitH: 30,
    init(e) { e.enraged = false; e.target = null; e.z = 0; e.cd2 = 1.5; },
    think(e, dt, cb, p, per) {
      const M = e.M;
      if (!e.enraged && e.hp <= e.maxHp / 2) {
        e.enraged = true; e.speedMul = 1.25;
        cb.text(e.x, e.y - 80, '狂暴!', '#ff8a5a');
        G.Display.toast(`${M.name} 狂暴了! 弹幕增加`, 1500);
      }
      contactDamage(e, cb, p, M);
      if (e.state === 'windup') {
        e.timer -= dt;
        // 落点前段跟随玩家, 最后 0.3 秒锁定
        if (e.timer > 0.3 && !p.dead) e.target = { x: p.x, y: p.y };
        e.blink = e.timer < M.windup * 0.4;
        if (e.timer <= 0) {
          e.state = 'jump'; e.timer = M.jumpTime; e.air = true; e.blink = false;
          e.jumpFrom = { x: e.x, y: e.y };
        }
        return { mx: 0, my: 0, speed: 0 };
      }
      if (e.state === 'jump') {
        e.timer -= dt;
        const k = 1 - Math.max(0, e.timer) / M.jumpTime;
        e.z = Math.sin(k * Math.PI) * 120;
        const to = { x: e.target.x - e.x, y: e.target.y - e.y }, rem = Math.hypot(to.x, to.y);
        const sp = Math.min(rem / Math.max(0.016, e.timer), 900);
        if (e.timer <= 0) { this.land(e, cb, p); return { mx: 0, my: 0, speed: 0 }; }
        const u = unit(to.x, to.y);
        return { mx: rem > 2 ? u.x : 0, my: rem > 2 ? u.y : 0, speed: sp, instant: true };
      }
      if (e.state === 'recover') {
        e.timer -= dt;
        if (e.timer <= 0) e.state = 'chase';
        return { mx: 0, my: 0, speed: 0 };
      }
      if (per.canSee && e.cd2 === 0 && per.d < M.slamRange) {
        e.state = 'windup'; e.timer = M.windup; e.target = { x: p.x, y: p.y };
        return { mx: 0, my: 0, speed: 0 };
      }
      const dir = cb.chaseDir(e, p, per, dt);
      return dir ? { mx: dir.x, my: dir.y, speed: M.speed * (e.speedMul || 1) } : null;
    },
    land(e, cb, p) {
      const M = e.M;
      e.air = false; e.z = 0; e.state = 'recover'; e.timer = 0.7; e.cd2 = M.slamInterval;
      cb.scene.shake = Math.max(cb.scene.shake, 10);
      cb.rings.push({ x: e.x, y: e.y, r: M.slamRadius, t: 0, life: 0.45 });
      if (!p.dead && Math.hypot(p.x - e.x, p.y - e.y) < M.slamRadius + C.PLAYER_RADIUS) p.hurt(M.slamDamage, e.x, e.y, cb.scene);
      const n = e.enraged ? M.burstEnraged : M.burst, off = Math.random() * Math.PI;
      for (let i = 0; i < n; i++) {
        const a = off + (i / n) * Math.PI * 2;
        cb.fireEnemyBolt(e.x + Math.cos(a) * e.r, e.y - 16 + Math.sin(a) * e.r * 0.6, Math.cos(a), Math.sin(a),
          { speed: M.projSpeed, range: M.projRange, r: M.projRadius, dmg: M.projDamage, h: 16, color: 'elite' });
      }
      for (let i = 0; i < 16; i++) cb.puff(e.x + rand(-40, 40), e.y + rand(-10, 10), '#6e1a4c', 1);
    },
    frame(e) {
      const A = G.CharArt.elite, R = e.face > 0;
      if (e.state === 'windup' || e.state === 'dead' || e.state === 'recover') return { f: R ? A.windR : A.windL };
      if (e.state === 'jump') return { f: R ? A.jumpR : A.jumpL, lift: Math.round(e.z / 3) * 3 };
      if (Math.hypot(e.vx, e.vy) > 8) return { f: (R ? A.moveR : A.moveL)[Math.floor(e.hopT * 2) % 2] };
      return { f: (R ? A.idleR : A.idleL)[Math.floor(e.animT / 0.5) % 2] };
    },
    drawGround(ctx, e, snap) {
      if ((e.state !== 'windup' && e.state !== 'jump') || !e.target) return;
      const M = e.M;
      const k = e.state === 'windup' ? 1 - e.timer / M.windup : 1;
      ctx.fillStyle = `rgba(255,60,80,${0.08 + k * 0.14})`;
      ctx.strokeStyle = `rgba(255,80,90,${0.4 + k * 0.5})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(snap(e.target.x), snap(e.target.y), M.slamRadius, M.slamRadius * 0.55, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(snap(e.target.x), snap(e.target.y), M.slamRadius * k, M.slamRadius * 0.55 * k, 0, 0, Math.PI * 2); ctx.stroke();
    },
    light: (e) => ({ r: e.state === 'windup' ? 170 : 120, color: '255,70,110' }),
  };

  G.MonsterAI = AI;
})();
