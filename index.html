  <script>
// 多房间地牢 (第一版): 固定 3x3 房间布局, 房间之间用门连接
//
// 每个房间是一张独立的 G.World 地图 (墙 / 障碍物 / 碰撞规则和原来完全一样), 进入时才烘焙地面层。
// 战斗系统同一时间只处理当前房间: 切换房间时 combat.setWorld() 换地图, 所以敌人不可能跑到别的房间。
// 房间状态: spawned 是否已刷过怪 / cleared 是否已清理 / drops 离开时留在地上的掉落物
//
// 布局、敌人数量、房间奖励、房间色调都在 js/config.js 的 G.DUNGEON 里; Boss 本身在 js/boss.js。
(function () {
  const C = G.CONFIG, T = C.TILE;
  const DIRS = { left: [0, -1], right: [0, 1], up: [-1, 0], down: [1, 0] };   // [行, 列] 偏移
  const OPP = { left: 'right', right: 'left', up: 'down', down: 'up' };
  const SIDE_NAME = { left: '西', right: '东', up: '北', down: '南' };

  // ---------------- 房间地图 ----------------
  // 生成房间: 上方两行墙 (墙顶 + 立面), 左右下各一行墙; 门 2 格宽, 开在每面墙的中间
  function blankRoom(W, H) {
    const g = [];
    for (let y = 0; y < H; y++) {
      const row = [];
      for (let x = 0; x < W; x++) row.push(x === 0 || x === W - 1 || y <= 1 || y === H - 1 ? '#' : '.');
      g.push(row);
    }
    return g;
  }
  function genDoorCells(W, H, side) {
    const a = Math.floor((H + 1) / 2) - 1, b = W / 2 - 1;
    return {
      left: [[0, a], [0, a + 1]],
      right: [[W - 1, a], [W - 1, a + 1]],
      up: [[b, 0], [b + 1, 0], [b, 1], [b + 1, 1]],
      down: [[b, H - 1], [b + 1, H - 1]],
    }[side];
  }
  // 第一阶段手绘地图 (宝箱房) 的门: 选在原地图没有障碍物的墙段上
  const LEGACY_DOORS = {
    left: [[0, 8], [0, 9]],
    up: [[17, 0], [18, 0], [17, 1], [18, 1]],
    down: [[14, 17], [15, 17]],
    right: [[29, 8], [29, 9]],
  };

  const fill = (g, x0, y0, x1, y1, ch) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) g[y][x] = ch; };

  // 战斗房的内部障碍样式 (22x14; 门道: 左右门在第 6~7 行, 上下门在第 10~11 列, 这些通道保持畅通)
  const STYLES = {
    A: {   // 石柱阵: 四块 2x2 岩墙
      tiles(g) { fill(g, 5, 4, 6, 5, '#'); fill(g, 15, 4, 16, 5, '#'); fill(g, 5, 9, 6, 10, '#'); fill(g, 15, 9, 16, 10, '#'); },
      objects: [['skull_pile', 2, 3], ['skull_pile', 19, 11], ['pillar_a', 13, 8], ['pillar_b', 8, 5]],
      urns: [[3, 10], [18, 3], [13, 11], [8, 2]],     // 可破坏石瓮的位置 (避开门道)
    },
    B: {   // 中央石台 + 四根柱子
      tiles(g) { fill(g, 9, 6, 12, 7, '#'); },
      objects: [['pillar_a', 5, 4], ['pillar_b', 16, 4], ['pillar_b', 5, 10], ['pillar_a', 16, 10], ['torch_stand', 8, 5], ['torch_stand', 13, 5]],
      urns: [[2, 3], [19, 11], [7, 11], [14, 2]],
    },
    C: {   // 断墙 + 仙人掌
      tiles(g) { fill(g, 3, 4, 7, 4, '#'); fill(g, 14, 10, 18, 10, '#'); fill(g, 18, 2, 18, 3, '#'); fill(g, 4, 10, 4, 12, '#'); },
      objects: [['cactus_a', 8, 9], ['cactus_b', 13, 4], ['cactus_a', 13, 9], ['cactus_b', 7, 2]],
      urns: [[2, 3], [16, 11], [19, 4], [6, 9]],
    },
    D: {   // 荆棘丛
      tiles() {},
      objects: [['thornwall_a', 6, 4], ['thornwall_b', 15, 4], ['thornwall_b', 6, 10], ['thornwall_a', 15, 10],
        ['thorn_m1', 9, 9], ['thorn_m2', 12, 4], ['thorn_s1', 3, 11], ['thorn_s2', 18, 3], ['thorn_l1', 17, 11]],
      urns: [[3, 3], [19, 10], [8, 12], [13, 8]],
    },
  };

  // 随机但固定的点缀 (骨头、裂纹、花草、蘑菇), 只放在空地上, 不挡路
  function scatter(w, seed, n) {
    const flats = ['bone', 'bones', 'skull', 'crack', 'plant_purple', 'flower_blue', 'crack', 'bone'];
    for (let i = 0; i < n; i++) {
      const x = 1 + Math.floor(G.hash(seed, i) * (w.w - 2)), y = 2 + Math.floor(G.hash(i, seed) * (w.h - 3));
      if (w.tile(x, y) === '#') continue;
      w.add(flats[Math.floor(G.hash(seed + i, 7) * flats.length)], x, y);
    }
  }
  // 北墙火把 (避开门所在的列)
  function wallTorches(w, xs) { for (const x of xs) w.add('torch_wall', x, 1, { y: 2 * T - 8 }); }

  function buildRoomWorld(room) {
    let g, W, H;
    if (room.style === 'legacy') {
      g = G.LegacyRoom.buildMap().map((r) => r.split(''));
      W = g[0].length; H = g.length;
    } else {
      W = room.kind === 'boss' ? 26 : room.kind === 'start' ? 18 : 22;
      H = room.kind === 'boss' ? 16 : room.kind === 'start' ? 12 : 14;
      g = blankRoom(W, H);
      if (room.kind === 'start') fill(g, 6, 4, 11, 7, ',');                 // 石板平台 (出生点)
      else if (room.kind === 'boss') {
        fill(g, 3, 3, 4, 4, '#'); fill(g, 21, 3, 22, 4, '#'); fill(g, 3, 12, 4, 13, '#'); fill(g, 21, 12, 22, 13, '#');
        fill(g, 10, 6, 15, 9, ',');                                           // 中央祭坛石板
      } else if (STYLES[room.style]) STYLES[room.style].tiles(g);
    }
    // 开门: 把门所在的墙格改成地面 (关门时用 world.closed 挡住, 不改地图)
    room.doorCells = {};
    for (const side in room.doors) {
      const cells = room.style === 'legacy' ? LEGACY_DOORS[side] : genDoorCells(W, H, side);
      for (const [x, y] of cells) g[y][x] = '.';
      room.doorCells[side] = cells;
    }
    const w = new G.World(g.map((r) => r.join('')));
    w.tint = G.DUNGEON.look[room.kind].tint;
    const seed = room.r * 17 + room.c * 5 + 3;

    if (room.style === 'legacy') {
      G.LegacyRoom.populate(w);
      for (const o of w.objects) if (o.chest) { o.closedKey = o.key; o.openKey = o.chest; }
    } else if (room.kind === 'start') {
      w.add('torch_stand', 5, 4); w.add('torch_stand', 12, 4); w.add('torch_stand', 5, 8); w.add('torch_stand', 12, 8);
      w.add('sign_a', 3, 9); w.add('mushroom_a', 15, 9); w.add('mushroom_b', 2, 3);
      wallTorches(w, [3, 14]);
      scatter(w, seed, 5);
    } else if (room.kind === 'boss') {
      [['pillar_a', 7, 5], ['pillar_b', 18, 5], ['pillar_b', 7, 11], ['pillar_a', 18, 11]].forEach(([k, x, y]) => w.add(k, x, y));
      [['torch_stand', 9, 5], ['torch_stand', 16, 5], ['torch_stand', 9, 10], ['torch_stand', 16, 10]].forEach(([k, x, y]) => w.add(k, x, y));
      [['skull_pile', 2, 2], ['skull_pile', 23, 2], ['skull_pile', 23, 14], ['thorn_l2', 2, 14]].forEach(([k, x, y]) => w.add(k, x, y));
      wallTorches(w, [5, 20]);
      scatter(w, seed, 10);
    } else {
      for (const [k, x, y] of STYLES[room.style].objects) w.add(k, x, y);
      // 普通战斗房: 少量可破坏石瓮 (生命值 / 掉落概率在 G.BREAKABLE)
      const B = G.BREAKABLE;
      if (room.kind === 'combat') for (const [x, y] of (STYLES[room.style].urns || []).slice(0, B.perRoom)) w.add('urn', x, y, { hp: B.hp, maxHp: B.hp, breakable: true });
      wallTorches(w, [4, 17]);
      w.add('mushroom_' + (G.hash(seed, 1) < 0.5 ? 'a' : 'b'), 1, 12, { x: 1.7 * T });
      scatter(w, seed, 8);
    }
    room.W = W; room.H = H;
    return w;
  }

  // ---------------- 地牢 ----------------
  const D = G.Dungeon = {
    rooms: [], cur: null, cool: 0,

    // 生成 (或重开时重新生成) 9 个房间的状态; 地图本身在第一次进入时才创建
    build() {
      const L = G.DUNGEON.layout, rows = L.length, cols = L[0].length;
      this.rooms = []; this.cur = null; this.cool = 0;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const def = L[r][c];
        this.rooms.push({ id: r * cols + c, r, c, kind: def.kind, style: def.style || null, doors: {}, depth: -1,
          world: null, spawned: false, cleared: def.kind === 'start' || def.kind === 'treasure', drops: [], visited: false });
      }
      // 相邻房间全部用门连接
      for (const room of this.rooms) for (const side in DIRS) {
        const [dr, dc] = DIRS[side], r = room.r + dr, c = room.c + dc;
        if (r >= 0 && c >= 0 && r < rows && c < cols) room.doors[side] = r * cols + c;
      }
      // 离起始房的步数 (决定战斗房的敌人数量)
      const [sr, sc] = G.DUNGEON.start, start = this.rooms[sr * cols + sc], q = [start];
      start.depth = 0;
      while (q.length) {
        const a = q.shift();
        for (const s in a.doors) { const b = this.rooms[a.doors[s]]; if (b.depth < 0) { b.depth = a.depth + 1; q.push(b); } }
      }
      for (const room of this.rooms) {
        const look = G.DUNGEON.look[room.kind];
        room.name = look.name + (room.kind === 'combat' ? ` ${'ABC'[room.r]}${room.c + 1}` : '');
        const byD = G.DUNGEON.combatByDepth;
        room.comp = room.kind === 'combat' ? byD[Math.min(byD.length - 1, Math.max(0, room.depth - 1))]
          : room.kind === 'elite' ? G.DUNGEON.elite : room.kind === 'boss' ? G.DUNGEON.bossRoom : null;
      }
      this.startId = start.id;
      // 道具去重: 任何房间地上还没捡的道具, 宝箱和房间奖励都不会再给一次
      G.Items.onGround = (id) => this.rooms.some((r) => r.drops.some((d) => d.kind === 'item' && d.item === id && !d.dead)) ||
        (!!this.scene && this.scene.combat.drops.some((d) => d.kind === 'item' && d.item === id && !d.dead));
      const vo = document.getElementById('victory-overlay'); if (vo) vo.classList.remove('show');
      return start;
    },

    world(room) { if (!room.world) room.world = buildRoomWorld(room); return room.world; },
    clearedCount() { return this.rooms.filter((r) => r.cleared && r.comp).length; },
    combatTotal() { return this.rooms.filter((r) => r.comp).length; },

    // 起始房出生点 (石板平台中央)
    spawnPoint(room) { return room.kind === 'start' ? { x: 9 * T, y: 6.2 * T } : { x: room.W * T / 2, y: room.H * T / 2 }; },

    // 从某一侧的门进入时, 玩家站的位置: 门内侧一点点 (不在门的触发区里, 不会立刻又切回去)
    entryPoint(room, side) {
      const cells = room.doorCells[side], W = room.W, H = room.H;
      const mx = cells.reduce((s, [x]) => s + x + 0.5, 0) / cells.length, my = cells.reduce((s, [, y]) => s + y + 0.5, 0) / cells.length;
      if (side === 'left') return { x: 1.75 * T, y: my * T + 10 };
      if (side === 'right') return { x: (W - 1.75) * T, y: my * T + 10 };
      if (side === 'up') return { x: mx * T, y: 2.9 * T };
      return { x: mx * T, y: (H - 1.6) * T };
    },

    // 玩家是否走进了某扇门的出口区域 (门格范围内并且贴近地图边缘)
    doorZone(room, side, p) {
      const cells = room.doorCells[side], W = room.W, H = room.H;
      const xs = cells.map(([x]) => x), ys = cells.map(([, y]) => y);
      const inX = p.x > Math.min(...xs) * T && p.x < (Math.max(...xs) + 1) * T;
      const inY = p.y > Math.min(...ys) * T && p.y < (Math.max(...ys) + 1) * T;
      if (side === 'left') return inY && p.x < 0.7 * T;
      if (side === 'right') return inY && p.x > (W - 0.7) * T;
      if (side === 'up') return inX && p.y < 1.25 * T;
      return inX && p.y > (H - 0.7) * T;
    },

    // 进入房间。from = 玩家从新房间的哪一侧进入 (null = 出生在起始房)
    enter(scene, id, from) {
      const p = scene.player, cb = scene.combat, old = this.cur;
      this.scene = scene;
      if (old && old !== this.rooms[id]) {
        old.drops = cb.drops.filter((d) => !d.dead);   // 没捡的魂晶/爱心/道具留在原房间
        old.world.layer = null;                         // 释放上一个房间的地面层画布
      }
      const room = this.cur = this.rooms[id];
      const w = this.world(room);
      if (!w.layer) w.bake();
      room.visited = true;
      // 没清理的房间: 进门后关门, 直到清理完毕
      w.setClosed(room.cleared ? [] : Object.values(room.doorCells).flat());
      scene.world = w;
      cb.setWorld(w, room.drops); room.drops = [];
      // 摆放玩家 (清掉速度/击退/闪避, 防止带着惯性卡进墙里)
      const pos = from ? this.entryPoint(room, from) : this.spawnPoint(room);
      p.x = pos.x; p.y = pos.y; p.vx = p.vy = p.kbx = p.kby = 0; p.dash = 0;
      w.moveCircle(p, 0, 0, C.PLAYER_RADIUS);
      p.fireCd = Math.max(p.fireCd, G.DUNGEON.fireLock);       // 刚进门的一小段时间不能开火
      scene.spawn = { x: p.x, y: p.y };                         // 掉进坑洞后回到本房间入口
      scene.fx = []; scene.near = null; scene.fade = 1;
      scene.snapCamera();
      this.cool = G.DUNGEON.doorCooldown;
      // 第一次进入战斗房: 刷怪 (已清理的房间不会再刷)
      if (!room.cleared && !room.spawned && room.comp) {
        room.spawned = true;
        cb.spawnRoom(room.comp);
        const tip = room.kind === 'boss' ? `${room.name} · ${G.MONSTERS.boss.name} 出现了!` : room.kind === 'elite' ? `${room.name} · 精英 ${G.MONSTERS.elite.name} 坐镇` : `${room.name} · 消灭所有敌人开启出口`;
        G.Display.toast(tip, 1800);
      } else if (from) G.Display.toast(room.name + (room.comp ? ' (已清理)' : ''), 1000);
    },

    update(scene, dt) {
      const room = this.cur, p = scene.player, cb = scene.combat;
      if (!room) return;
      this.cool -= dt;
      // 清理: 刷过怪且敌人全部死亡 (死亡动画结束后才从列表移除)
      if (!room.cleared && room.spawned && cb.enemies.length === 0 && !p.dead) {
        room.cleared = true;
        room.world.setClosed([]); cb._buildBlocked();
        G.Display.toast(room.kind === 'boss' ? `击败了 ${G.MONSTERS.boss.name}! 房间已清理` : `${room.name} 已清理 · 出口开启`, 1600);
        if (G.Sfx) G.Sfx.play('pickup');
        for (const s in room.doorCells) {
          const c = this.doorCenter(room, s);
          scene.fx.push({ type: 'ring', x: c.x, y: c.y, color: G.DUNGEON.look[this.rooms[room.doors[s]].kind].glow, t: 0, life: 0.6, r: 90 });
        }
        this.settle(scene, room);
      }
      // 过门 (房间已清理、玩家活着、冷却结束)
      if (room.cleared && !p.dead && this.cool <= 0) {
        for (const side in room.doors) {
          if (this.doorZone(room, side, p)) { this.enter(scene, room.doors[side], OPP[side]); return; }
        }
      }
    },

    // 房间清理结算 (每个房间只结算一次)。注意: 清理本身不给魂晶, 魂晶只来自击杀和打碎石瓮。
    //   普通战斗房: 按概率给 生命 / 道具 / 什么都没有;  精英房: 必定 生命 或 道具
    //   宝箱房: 没有清理奖励 (只有原来的宝箱);  Boss 房: 显示通关提示
    // 奖励是掉在地上的拾取物 (不会过期), 没捡就离开会留在这个房间, 重开时全部重置
    settle(scene, room) {
      if (room.rewarded) return;
      room.rewarded = true;
      if (room.kind === 'boss') { this.victory(); room.reward = 'victory'; return; }
      const R = G.DUNGEON.rewards[room.kind];
      if (!R || Math.random() >= R.chance) { room.reward = 'none'; return; }
      const cb = scene.combat, pos = this.rewardSpot(scene);
      let item = null;
      if (Math.random() < R.item) {
        const pool = G.Items.all().filter((d) => G.Items.available(d.id));
        if (pool.length) item = pool[Math.floor(Math.random() * pool.length)].id;
      }
      if (item) cb._drop('item', pos.x, pos.y, { item, reward: true });
      else cb._drop('heart', pos.x, pos.y, { life: 1e9, reward: true });   // 奖励生命不会消失
      room.reward = item ? 'item:' + item : 'heart';
      scene.fx.push({ type: 'ring', x: pos.x, y: pos.y - 10, color: item ? '255,90,110' : '255,150,170', t: 0, life: 0.7, r: 80 });
      G.Display.toast(item ? `清理奖励: ${G.Items.get(item).name}` : '清理奖励: 生命', 1600);
    },

    // 奖励掉落位置: 房间中央附近、离玩家最近的一个空地格
    rewardSpot(scene) {
      const room = this.cur, cb = scene.combat, w = room.world, p = scene.player;
      const cx = room.W / 2, cy = room.H / 2 + 0.5;
      let best = null, bd = 1e9;
      for (let y = 2; y < w.h - 1; y++) for (let x = 1; x < w.w - 1; x++) {
        if (cb.blocked[y * w.w + x]) continue;
        const q = { x: (x + 0.5) * T, y: (y + 0.5) * T };
        if (w.objects.some((o) => o.def.solid && Math.hypot(o.x - q.x, o.y - q.y) < o.def.solid.r + 24)) continue;
        const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy) * 3 + Math.hypot(q.x - p.x, q.y - p.y) / T;
        if (d < bd) { bd = d; best = q; }
      }
      return best || { x: p.x, y: p.y };
    },

    victory() {
      const vo = document.getElementById('victory-overlay');
      if (vo) { vo.querySelector('.title').textContent = G.DUNGEON.victoryText; vo.classList.add('show'); }
      else G.Display.toast(G.DUNGEON.victoryText, 2500);
    },

    doorCenter(room, side) {
      const cells = room.doorCells[side];
      const xs = cells.map(([x]) => x), ys = cells.map(([, y]) => y);
      return { x: (Math.min(...xs) + Math.max(...xs) + 1) / 2 * T, y: (Math.min(...ys) + Math.max(...ys) + 1) / 2 * T };
    },

    // 门的光源 (开着 = 邻居房间颜色的微光; 关着 = 暗红封印)
    lights() {
      const room = this.cur, out = []; if (!room) return out;
      const t = performance.now() / 1000;
      for (const side in room.doorCells) {
        const c = this.doorCenter(room, side), nb = this.rooms[room.doors[side]];
        if (room.cleared) out.push({ x: c.x, y: c.y, r: 150 + Math.sin(t * 2 + c.x) * 8, a: 0.75, color: G.DUNGEON.look[nb.kind].glow });
        else out.push({ x: c.x, y: c.y, r: 110, a: 0.5, color: '200,30,60' });
      }
      return out;
    },

    // 画门 (在地面层之后、角色之前)
    drawDoors(ctx) {
      const room = this.cur; if (!room) return;
      const A = G.Assets, face = A.get('wall_face').img, top = A.get('wall_top').img, t = performance.now() / 1000;
      for (const side in room.doorCells) {
        const cells = room.doorCells[side], nb = this.rooms[room.doors[side]], glow = G.DUNGEON.look[nb.kind].glow;
        if (!room.cleared) {
          // 关闭: 用墙体素材封住门洞, 再画一道脉动的暗红封印
          for (const [x, y] of cells) {
            const below = side === 'up' && y === 1;
            if (below) { const s = face.height; ctx.drawImage(face, 0, 0, Math.min(s, face.width), s, x * T, y * T, T, T); }
            else ctx.drawImage(top, x * T, y * T, T, T);
          }
          const a = 0.55 + Math.sin(t * 4) * 0.25;
          ctx.fillStyle = `rgba(230,40,70,${a})`;
          const xs = cells.map(([x]) => x), ys = cells.map(([, y]) => y);
          const x0 = Math.min(...xs) * T, x1 = (Math.max(...xs) + 1) * T, y0 = Math.min(...ys) * T, y1 = (Math.max(...ys) + 1) * T;
          if (side === 'left' || side === 'right') {
            const cx = side === 'left' ? x1 - 8 : x0 + 4;
            ctx.fillRect(cx, y0 + 6, 4, y1 - y0 - 12);
            for (let yy = y0 + 14; yy < y1 - 10; yy += 18) ctx.fillRect(cx - 4, yy, 12, 4);
          } else {
            const cy = side === 'up' ? y1 - 8 : y0 + 4;
            ctx.fillRect(x0 + 6, cy, x1 - x0 - 12, 4);
            for (let xx = x0 + 14; xx < x1 - 10; xx += 18) ctx.fillRect(xx, cy - 4, 4, 12);
          }
        } else {
          // 开启: 门洞向外渐暗 (像通往下一个房间的走廊), 门槛上一条邻居房间颜色的光
          const xs = cells.map(([x]) => x), ys = cells.map(([, y]) => y);
          const x0 = Math.min(...xs) * T, x1 = (Math.max(...xs) + 1) * T, y0 = Math.min(...ys) * T, y1 = (Math.max(...ys) + 1) * T;
          let gr;
          if (side === 'left') gr = ctx.createLinearGradient(x1, 0, x0, 0);
          else if (side === 'right') gr = ctx.createLinearGradient(x0, 0, x1, 0);
          else if (side === 'up') gr = ctx.createLinearGradient(0, y1, 0, y0);
          else gr = ctx.createLinearGradient(0, y0, 0, y1);
          gr.addColorStop(0, 'rgba(5,2,10,0)'); gr.addColorStop(1, 'rgba(5,2,10,0.85)');
          ctx.fillStyle = gr; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
          const a = 0.45 + Math.sin(t * 2.5) * 0.15;
          ctx.fillStyle = `rgba(${glow},${a})`;
          if (side === 'left') ctx.fillRect(x1 - 4, y0 + 4, 4, y1 - y0 - 8);
          else if (side === 'right') ctx.fillRect(x0, y0 + 4, 4, y1 - y0 - 8);
          else if (side === 'up') ctx.fillRect(x0 + 4, y1 - 4, x1 - x0 - 8, 4);
          else ctx.fillRect(x0 + 4, y0, x1 - x0 - 8, 4);
        }
      }
    },

    sideName: (s) => SIDE_NAME[s],
  };
})();

</script>
  <script>
// 测试场景: 第一阶段的地图 (布局/素材/碰撞完全不变) + 第二阶段的玩家与基础战斗
(function () {
  const C = G.CONFIG, T = C.TILE;

  function buildMap() {
    const W = 30, H = 18;
    const g = [];
    for (let y = 0; y < H; y++) {
      const row = [];
      for (let x = 0; x < W; x++) row.push(x === 0 || x === W - 1 || y <= 1 || y === H - 1 ? '#' : '.');
      g.push(row);
    }
    const fill = (x0, y0, x1, y1, ch) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) g[y][x] = ch; };
    fill(21, 3, 26, 6, ',');      // 石板平台 (6x4 = 两块完整石板素材)
    fill(9, 8, 11, 10, '#');      // 中间的岩块
    fill(1, 2, 1, 3, '#');        // 左上角墙垛
    fill(27, 11, 28, 16, '#');    // 右下墙体
    return g.map((r) => r.join(''));
  }

  function populate(w) {
    // 贴片: 泥地小径、洞穴入口 (世界像素坐标)
    w.addDecal('dirt_patch', 2.6 * T, 3.4 * T, 200, 130);
    w.addDecal('dirt_patch', 13.3 * T, 8.6 * T, 200, 130);
    w.addDecal('dirt_patch', 13.4 * T, 13.6 * T, 160, 104);
    w.addDecal('cave', 13 * T, 1 * T - 16, 136, 84);

    // 洞穴两侧的柱子
    w.add('pillar_a', 12, 2, { y: 3 * T - 4 });
    w.add('pillar_b', 15, 2, { y: 3 * T - 4 });
    // 墙挂火把 (挂在北墙立面上)
    w.add('torch_wall', 5, 1, { y: 2 * T - 8 });
    w.add('torch_wall', 20, 1, { y: 2 * T - 8 });
    w.add('torch_wall', 9, 10, { y: 11 * T - 8 });
    // 石板平台: 立式火把 + 宝箱
    w.add('torch_stand', 21, 3); w.add('torch_stand', 26, 3);
    w.add('chest_closed', 23, 4, { chest: 'chest_open' });
    w.add('chest2_closed', 7, 4, { chest: 'chest2_open' });
    w.add('lantern', 8, 4);
    // 指示牌
    w.add('sign_a', 4, 7); w.add('sign_b', 18, 9);
    // 荆棘丛群
    [['thorn_l1', 3, 12], ['thorn_m1', 5, 13], ['thorn_s1', 2, 14], ['thorn_l3', 6, 15], ['thorn_s2', 4, 15],
     ['thorn_m2', 20, 15], ['thorn_l2', 22, 15], ['thorn_l4', 24, 14], ['thornwall_a', 25, 9], ['thornwall_b', 26, 9],
     ['cactus_a', 14, 5], ['cactus_b', 19, 11]].forEach(([k, x, y]) => w.add(k, x, y));
    // 蘑菇 (冷色微光)
    w.add('mushroom_a', 1, 9, { x: 1.7 * T }); w.add('mushroom_b', 2, 10); w.add('mushroom_a', 25, 12);
    w.add('mushroom_b', 12, 15);
    // 地表装饰
    [['bone', 6, 9], ['bones', 15, 11], ['skull', 17, 6], ['crack', 11, 5], ['crack', 22, 11],
     ['plant_purple', 13, 12], ['flower_blue', 8, 14], ['plant_purple', 19, 4], ['flower_blue', 10, 3],
     ['bone', 24, 8], ['skull', 3, 10]].forEach(([k, x, y]) => w.add(k, x, y));
    w.add('skull_pile', 16, 15);
    // 孔洞 / 陷阱 (掉进去会回到出生点)
    w.add('hole_a', 18, 13); w.add('trap_b', 8, 12); w.add('hole_b', 26, 7, { x: 26.6 * T });
  }

  // 第一阶段的手绘地图: 波次模式下是整张关卡, 多房间地牢里作为宝箱房 (js/dungeon.js 在它的墙上开门)
  G.LegacyRoom = { buildMap, populate };

  const S = G.SceneTest = {
    world: null,
    player: null,
    combat: null,
    cam: { x: 0, y: 0 },
    fx: [],                 // 临时视觉效果 (技能圈、闪避残影)
    cooldown: { dash: 0 },
    near: null,             // 可交互物件
    fade: 0,
    shake: 0,               // 屏幕震动强度
    hurtFlash: 0,           // 受击红色暗角
    rangeA: 0,              // 攻击范围圈的透明度
    deathT: -1,
    light: null, lightCtx: null,
    spawn: { x: 9.5 * T, y: 5.5 * T },

    init() {
      this.dungeon = G.DUNGEON.enabled ? G.Dungeon : null;
      let w;
      if (this.dungeon) {
        // 多房间地牢: 先生成房间状态, 战斗系统从起始房开始
        const start = this.dungeon.build();
        w = this.world = this.dungeon.world(start);
        this.spawn = this.dungeon.spawnPoint(start);
      } else {
        w = this.world = new G.World(buildMap());
        populate(w);
        w.bake();
      }
      this.player = new G.Player(this.spawn.x, this.spawn.y);
      this.combat = new G.Combat(this);
      this.cam.x = this.player.x - G.Display.viewW / 2;
      this.cam.y = this.player.y - G.Display.viewH / 2;
      this.light = document.createElement('canvas');
      this.lightCtx = this.light.getContext('2d');
      document.getElementById('btn-restart').addEventListener('click', () => this.restart());
      // 通关提示: 继续探索 (关掉提示) / 再来一局
      document.getElementById('btn-continue').addEventListener('click', () => document.getElementById('victory-overlay').classList.remove('show'));
      document.getElementById('btn-again').addEventListener('click', () => this.restart());
      this.hud = new G.Hud(this);
      // 记住宝箱的初始状态, 重开时恢复 (宝箱现在会掉落猩红债主道具)
      for (const o of w.objects) if (o.chest) { o.closedKey = o.key; o.openKey = o.chest; }
      G.Items.grantStart();
      if (this.dungeon) this.dungeon.enter(this, this.dungeon.startId, null);
      else this.snapCamera();
    },

    // 镜头直接对准玩家 (切换房间时用, 不做平滑跟随)
    snapCamera() {
      const D = G.Display, p = this.player, w = this.world;
      this.cam.x = clampCam(p.x - D.viewW / 2, w.pxW, D.viewW);
      this.cam.y = clampCam(p.y - 30 - D.viewH / 2, w.pxH, D.viewH);
    },

    restart() {
      if (this.dungeon) {
        // 新的一局: 9 个房间全部重新生成 (清理状态、敌人、宝箱、地上的掉落物都恢复初始), 回到起始房
        const start = this.dungeon.build();
        this.world = this.dungeon.world(start);
        this.spawn = this.dungeon.spawnPoint(start);
      }
      this.player.reset(this.spawn.x, this.spawn.y);
      this.combat.reset();
      // 新的一局: 道具清空, 宝箱复原
      G.Items.reset(); G.Items.run('reset', true);
      G.Items.grantStart(true);
      for (const o of this.world.objects) if (o.closedKey) { o.key = o.closedKey; o.chest = o.openKey; o.img = G.Assets.get(o.closedKey).img; }
      if (this.dungeon) this.dungeon.enter(this, this.dungeon.startId, null);
      this.fx = []; this.deathT = -1; this.fade = 1; this.hurtFlash = 0;
      document.getElementById('death-overlay').classList.remove('show');
      document.getElementById('victory-overlay').classList.remove('show');
    },

    onPlayerDeath() {
      this.deathT = 0;
      const p = this.player;
      for (let i = 0; i < 24; i++) {
        const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 160;
        this.combat.addPart({ x: p.x, y: p.y - 20, z: 10, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, vz: 120 + Math.random() * 160, g: 600,
          life: 0.6 + Math.random() * 0.5, t: 0, c: ['#6e4fa0', '#3b2963', '#3f8fb0', '#8ff6ff'][i % 4], s: i % 3 ? 3 : 6 });
      }
    },

    update(dt) {
      const I = G.Input, p = this.player, w = this.world;
      for (const k in this.cooldown) this.cooldown[k] = Math.max(0, this.cooldown[k] - dt);

      // 死亡后: 世界继续运行一会儿再显示重来界面; 任意攻击键也能重来
      if (p.dead) {
        this.deathT += dt;
        if (this.deathT > 0.9) document.getElementById('death-overlay').classList.add('show');
        if (this.deathT > 1.2 && (I.pressed.attack || I.pressed.interact)) this.restart();
      }

      p.update(dt, this);

      // ---- 交互: 靠近宝箱 ----
      this.near = null;
      if (!p.dead) for (const o of w.objects) {
        if (!o.chest) continue;
        if (Math.hypot(o.x - p.x, o.y - p.y) < 80) { this.near = o; break; }
      }
      // 电脑按 E 打开; 手机没有交互按钮, 走到宝箱跟前自动打开
      const autoOpen = I.mode === 'touch' && this.near && Math.hypot(this.near.x - p.x, this.near.y - p.y) < 62;
      if (this.near && (I.pressed.interact || autoOpen)) {
        const r = G.Assets.get(this.near.chest);
        const closedKey = this.near.key;
        this.near.img = r.img; this.near.key = this.near.chest; this.near.chest = null;
        G.Items.onChestOpened(this.combat, closedKey, this.near.x, this.near.y);
        this.fx.push({ type: 'ring', x: this.near.x, y: this.near.y - 20, color: '255,200,90', t: 0, life: 0.5, r: 70 });
        G.Display.toast('宝箱打开了', 1200);
      }

      // ---- 掉进孔洞 => 扣 1 点生命并回到出生点 (闪避可以飞过坑) ----
      if (!p.dead && p.dash <= 0) {
        for (const o of w.objects) {
          if (!o.def.hole) continue;
          if (Math.hypot(o.x - p.x, o.y - p.y) < o.def.hole) {
            p.x = this.spawn.x; p.y = this.spawn.y; p.vx = p.vy = p.kbx = p.kby = 0; this.fade = 1;
            p.invuln = 0;
            p.hurt(1, p.x, p.y + 1, this);
            G.Display.toast('掉进了坑洞! 回到出生点', 1500);
            break;
          }
        }
      }
      this.fade = Math.max(0, this.fade - dt * 2);

      this.combat.update(dt);
      // 多房间: 清理检测 / 开门 / 过门切换房间 (切换后本帧用新房间继续)
      if (this.dungeon) { this.dungeon.update(this, dt); }
      const wNow = this.world;

      for (const f of this.fx) f.t += dt;
      this.fx = this.fx.filter((f) => f.t < f.life);
      this.shake = Math.max(0, this.shake - dt * 30);
      this.hurtFlash = Math.max(0, this.hurtFlash - dt * 2.5);
      const showRange = !p.dead && (I.held.attack || p.castT > 0);
      this.rangeA += ((showRange ? 1 : 0) - this.rangeA) * Math.min(1, dt * 8);

      // ---- 镜头: 平滑跟随, 限制在地图内 (地图比视野小时居中) ----
      const D = G.Display;
      const tx = clampCam(p.x - D.viewW / 2, wNow.pxW, D.viewW);
      const ty = clampCam(p.y - 30 - D.viewH / 2, wNow.pxH, D.viewH);
      const k = 1 - Math.pow(0.0005, dt);
      this.cam.x += (tx - this.cam.x) * k;
      this.cam.y += (ty - this.cam.y) * k;
      this.hud.update();
    },

    render(ctx) {
      const D = G.Display, s = D.scale, w = this.world, p = this.player;
      // 屏幕震动只影响绘制, 不改变镜头本身
      const sh = this.shake > 0.3 ? this.shake : 0;
      const cam = { x: this.cam.x + (Math.random() - 0.5) * sh, y: this.cam.y + (Math.random() - 0.5) * sh };
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#0d0812';
      ctx.fillRect(0, 0, D.canvas.width, D.canvas.height);

      // 镜头对齐到设备像素, 精灵也对齐到设备像素 => 精灵相对镜头不会 1px 抖动
      const ox = Math.round(cam.x * s), oy = Math.round(cam.y * s);
      const snap = (v) => Math.round(v * s) / s;
      ctx.setTransform(s, 0, 0, s, -ox, -oy);
      ctx.imageSmoothingEnabled = false;

      // 地面层 (只画可见部分)
      const sx = Math.max(0, cam.x), sy = Math.max(0, cam.y);
      const sw = Math.min(w.pxW - sx, D.viewW + 2), shh = Math.min(w.pxH - sy, D.viewH + 2);
      if (sw > 0 && shh > 0) ctx.drawImage(w.layer, sx, sy, sw, shh, sx, sy, sw, shh);
      if (this.dungeon) this.dungeon.drawDoors(ctx);

      // 交互提示圈
      if (this.near) {
        ctx.strokeStyle = 'rgba(255,210,120,0.8)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(this.near.x, this.near.y - 6, 34, 14, 0, 0, Math.PI * 2); ctx.stroke();
      }
      this.combat.drawGround(ctx, snap);

      // 攻击范围圈 (按住攻击时显示)
      if (this.rangeA > 0.02) {
        const R = G.COMBAT.bolt.range;
        ctx.save();
        ctx.globalAlpha = this.rangeA * 0.55;
        ctx.strokeStyle = '#7ef0ff'; ctx.lineWidth = 2; ctx.setLineDash([10, 10]);
        ctx.beginPath(); ctx.arc(snap(p.cx), snap(p.cy), R, 0, Math.PI * 2); ctx.stroke();
        // 射击方向指示线: 子弹会沿这条线直线飞出 (不追踪)
        const o = p.orbPos();
        ctx.globalAlpha = this.rangeA * 0.8;
        ctx.setLineDash([6, 8]); ctx.strokeStyle = '#bff8ff';
        ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x + p.aim.x * R, o.y + p.aim.y * R); ctx.stroke();
        ctx.restore();
      }

      // 立体物件 + 角色 + 敌人 按脚底 y 排序
      const list = w.standing().filter((o) => o.x > cam.x - 200 && o.x < cam.x + D.viewW + 200 && o.y > cam.y - 50 && o.y < cam.y + D.viewH + 250)
        .map((o) => ({ y: o.y, o }));
      list.push({ y: p.y, draw: (c) => p.draw(c, snap) });
      for (const d of this.combat.drawables(snap)) list.push(d);
      list.sort((a, b) => a.y - b.y);
      for (const it of list) {
        if (it.draw) { it.draw(ctx); continue; }
        const o = it.o, [ax, ay] = o.def.anchor || [0.5, 1];
        const jx = o.hitT > 0 ? Math.round((Math.random() - 0.5) * 5) : 0;   // 可破坏障碍物受击时抖一下
        ctx.drawImage(o.img, Math.round(o.x - o.img.width * ax) + jx, Math.round(o.y - o.img.height * ay));
      }

      // 效果
      for (const f of this.fx) {
        const k = f.t / f.life;
        if (f.type === 'ring') {
          ctx.strokeStyle = `rgba(${f.color},${1 - k})`; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.ellipse(f.x, f.y, f.r * k, f.r * k * 0.55, 0, 0, Math.PI * 2); ctx.stroke();
        } else if (f.type === 'dash') {
          ctx.fillStyle = `rgba(160,120,255,${0.35 * (1 - k)})`;
          ctx.beginPath(); ctx.ellipse(f.x, f.y, 22, 9, 0, 0, Math.PI * 2); ctx.fill();
        }
      }
      this.combat.drawTop(ctx, snap);

      if (C.LIGHTING) this.renderLighting(ctx, ox, oy);

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      // Boss 血条 (屏幕空间, 画在光照之上)
      for (const e of this.combat.enemies) if (e.AI.drawHud && e.state !== 'dead') e.AI.drawHud(ctx, e, D);
      // 受击红色暗角
      if (this.hurtFlash > 0 || (p.hp <= 2 && !p.dead)) {
        const a = Math.max(this.hurtFlash * 0.55, p.hp <= 2 && !p.dead ? 0.18 + Math.sin(performance.now() / 180) * 0.06 : 0);
        const W = D.canvas.width, H = D.canvas.height;
        const gr = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.7);
        gr.addColorStop(0, 'rgba(160,0,30,0)'); gr.addColorStop(1, `rgba(160,0,30,${a})`);
        ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
      }
      // 鼠标准星 (电脑)
      if (G.Input.mode === 'kbm' && G.Input.mouse.inside) {
        const mx = G.Input.mouse.x * D.dpr, my = G.Input.mouse.y * D.dpr, r = 7 * D.dpr;
        ctx.strokeStyle = 'rgba(220,200,255,0.9)'; ctx.lineWidth = 1.5 * D.dpr;
        ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI * 2);
        ctx.moveTo(mx - r * 1.8, my); ctx.lineTo(mx - r * 0.6, my); ctx.moveTo(mx + r * 0.6, my); ctx.lineTo(mx + r * 1.8, my);
        ctx.stroke();
      }
      if (this.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${this.fade})`; ctx.fillRect(0, 0, D.canvas.width, D.canvas.height); }
    },

    // 暗黑氛围: 低分辨率黑暗层 + 光源挖洞, 再叠加彩色辉光
    renderLighting(ctx, ox, oy) {
      const D = G.Display, s = D.scale, w = this.world;
      const lw = Math.ceil(D.canvas.width * C.LIGHT_RES), lh = Math.ceil(D.canvas.height * C.LIGHT_RES);
      if (this.light.width !== lw || this.light.height !== lh) { this.light.width = lw; this.light.height = lh; }
      const lc = this.lightCtx, k = C.LIGHT_RES, t = performance.now() / 1000;
      lc.globalCompositeOperation = 'source-over';
      const dark = this.dungeon && this.dungeon.cur ? G.DUNGEON.look[this.dungeon.cur.kind].dark : 0.78;   // 每类房间的黑暗程度不同
      lc.fillStyle = `rgba(6,3,14,${dark})`;
      lc.fillRect(0, 0, lw, lh);
      lc.globalCompositeOperation = 'destination-out';
      const lights = [{ x: this.player.x, y: this.player.y - 30, r: this.player.dead ? 200 : 300, a: 1 }];
      for (const o of w.objects) {
        const L = o.def.light; if (!L) continue;
        const fl = L.warm ? 1 + Math.sin(t * 9 + o.x) * 0.04 + Math.sin(t * 23 + o.y) * 0.03 : 1 + Math.sin(t * 2 + o.x) * 0.05;
        lights.push({ x: o.x, y: o.y + L.oy, r: L.r * fl, a: L.warm ? 1 : 0.7, color: L.warm ? '255,150,60' : '90,170,255' });
      }
      for (const L of this.combat.lights()) lights.push(L);
      if (this.dungeon) for (const L of this.dungeon.lights()) lights.push(L);
      const vis = [];
      for (const L of lights) {
        const sx = (L.x * s - ox) * k, sy = (L.y * s - oy) * k, sr = L.r * s * k;
        if (sx < -sr || sy < -sr || sx > lw + sr || sy > lh + sr) continue;
        const gr = lc.createRadialGradient(sx, sy, 0, sx, sy, sr);
        gr.addColorStop(0, `rgba(0,0,0,${L.a})`); gr.addColorStop(0.55, `rgba(0,0,0,${L.a * 0.6})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
        lc.fillStyle = gr; lc.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
        if (L.color) vis.push({ L, sx: sx / k, sy: sy / k, sr: sr / k });
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(this.light, 0, 0, D.canvas.width, D.canvas.height);
      ctx.imageSmoothingEnabled = false;
      // 辉光
      ctx.globalCompositeOperation = 'lighter';
      for (const v of vis) {
        const r = v.sr * 0.55;
        const gr = ctx.createRadialGradient(v.sx, v.sy, 0, v.sx, v.sy, r);
        gr.addColorStop(0, `rgba(${v.L.color},0.22)`); gr.addColorStop(1, `rgba(${v.L.color},0)`);
        ctx.fillStyle = gr; ctx.fillRect(v.sx - r, v.sy - r, r * 2, r * 2);
      }
      ctx.globalCompositeOperation = 'source-over';
    },
  };

  function clampCam(v, mapSize, view) {
    if (mapSize <= view) return (mapSize - view) / 2;
    return Math.max(0, Math.min(mapSize - view, v));
  }
})();

</script>
  <script>
// 素材浏览: 在游戏内检查所有提取出来的精灵 + 占位素材 (拖动或滚轮翻页)
(function () {
  const S = G.SceneGallery = {
    scroll: 0, maxScroll: 0, drag: null,

    init() {
      const c = G.Display.canvas;
      c.addEventListener('wheel', (e) => { if (G.scene === S) { S.scroll += e.deltaY; e.preventDefault(); } }, { passive: false });
      const ly = (e) => G.Display.toLocal(e.clientX, e.clientY).y;
      c.addEventListener('pointerdown', (e) => { if (G.scene === S) S.drag = { y: ly(e), s: S.scroll, id: e.pointerId }; });
      window.addEventListener('pointermove', (e) => { if (S.drag && e.pointerId === S.drag.id) S.scroll = S.drag.s - (ly(e) - S.drag.y) * G.Display.dpr; });
      window.addEventListener('pointerup', () => (S.drag = null));
    },

    update(dt) {
      const k = G.Input.keys;
      if (k.has('KeyS') || k.has('ArrowDown')) S.scroll += 900 * dt;
      if (k.has('KeyW') || k.has('ArrowUp')) S.scroll -= 900 * dt;
      S.scroll += G.Input.move.y * 900 * dt;
      S.scroll = Math.max(0, Math.min(S.maxScroll, S.scroll));
    },

    render(ctx) {
      const D = G.Display, dpr = D.dpr;
      const W = D.canvas.width, H = D.canvas.height;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#140c1e'; ctx.fillRect(0, 0, W, H);
      ctx.imageSmoothingEnabled = false;
      const mf = window.ASSET_MANIFEST || { extracted: [], skipped: [] };
      const zoom = Math.max(1, Math.round(dpr * 1.2));
      const pad = 14 * dpr, cell = 120 * dpr;
      const cols = Math.max(1, Math.floor((W - pad) / (cell + pad)));
      let x = pad, y = 60 * dpr - S.scroll, i = 0;
      ctx.fillStyle = '#e9ddff'; ctx.font = `${14 * dpr}px sans-serif`; ctx.textBaseline = 'top';
      ctx.fillText(`已提取素材 ${mf.extracted.length} 个 (来自说明图, 已去背景/网格/文字)`, pad, y - 34 * dpr);
      const items = mf.extracted.map((it) => ({ name: it.name, img: G.Assets.images[it.id], sub: it.id }));
      items.push({ name: '墙顶(程序占位)', img: G.Placeholders.get('ph_wall_top'), ph: true });
      if (G.CharArt.player) {
        const P = G.CharArt.player, A = G.CharArt.slime;
        [['主角-正面(临时)', P.down.idle[0]], ['主角-背面(临时)', P.up.idle[0]], ['主角-侧面(临时)', P.right.walk[1]],
         ['主角-施法(临时)', P.down.cast[0]], ['深渊黏液(临时)', A.idleR[0]], ['黏液-蓄力', A.windR]]
          .forEach(([name, f]) => items.push({ name, img: f.img, ph: true }));
      }
      for (const it of items) {
        const cx = x + (i % cols) * (cell + pad), cy = y + Math.floor(i / cols) * (cell + 34 * dpr);
        i++;
        if (cy > H || cy + cell < 0) continue;
        ctx.fillStyle = it.ph ? '#2a1830' : '#1f1430'; ctx.fillRect(cx, cy, cell, cell);
        if (it.img) {
          const sc = Math.min(zoom, (cell - 8) / it.img.width, (cell - 8) / it.img.height);
          const w = it.img.width * sc, h = it.img.height * sc;
          ctx.drawImage(it.img, cx + (cell - w) / 2, cy + (cell - h) / 2, w, h);
        } else { ctx.fillStyle = '#f55'; ctx.fillText('加载失败', cx + 6, cy + 6); }
        ctx.fillStyle = it.ph ? '#ffb070' : '#cbb8f0'; ctx.font = `${11 * dpr}px sans-serif`;
        ctx.fillText(it.name, cx, cy + cell + 4 * dpr, cell);
      }
      let endY = y + Math.ceil(items.length / cols) * (cell + 34 * dpr) + 10 * dpr;
      ctx.fillStyle = '#ffb070'; ctx.font = `${13 * dpr}px sans-serif`;
      ctx.fillText('未提取 (无法可靠分离):', pad, endY); endY += 22 * dpr;
      ctx.font = `${12 * dpr}px sans-serif`; ctx.fillStyle = '#cbb8f0';
      for (const s of mf.skipped) { ctx.fillText(`· ${s.name}: ${s.reason}`, pad, endY, W - pad * 2); endY += 20 * dpr; }
      S.maxScroll = Math.max(0, endY + S.scroll - H + 40 * dpr);
    },
  };
})();

  // 从精灵图切帧, 按 scale 倍放大 (最近邻), 同时生成受击闪白用的白色剪影
  function sheetFrames(img, cw, ch, scale = PX) {
    const cut = (col, row) => {
      const c = document.createElement('canvas'); c.width = cw * scale; c.height = ch * scale;
      const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
      g.drawImage(img, col * cw, row * ch, cw, ch, 0, 0, cw * scale, ch * scale);
      const w = document.createElement('canvas'); w.width = c.width; w.height = c.height;
      const wg = w.getContext('2d'); wg.drawImage(c, 0, 0);
      wg.globalCompositeOperation = 'source-in'; wg.fillStyle = '#ffffff'; wg.fillRect(0, 0, w.width, w.height);
      return { img: c, white: w, w: c.width, h: c.height };
    };
    const out = {};
    [['down', 0], ['left', 1], ['right', 2], ['up', 3]].forEach(([dir, row]) => {
      const f = [0, 1, 2, 3].map((col) => cut(col, row));
      out[dir] = { idle: [f[0], f[0]], walk: [f[0], f[1], f[2], f[3]], cast: [f[0]] };
    });
    out.side = out.right;
    return out;
  }
  function loadImage(src) {
    return new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  }

    { id: 'wanderer', name: '流浪者', tagline: '披着兜帽的深渊旅人。', skill: '暂无专属技能 (使用基础奥术飞弹)', frames: () => R.defaultFrames },

    async load() {
      R.defaultFrames = G.CharArt.player;
      const img = await loadImage(JIEAN_SHEET);
      // 皆安的原图是 24x32 一格 (头身比更大), 按 2 倍放大后身高约 62, 和流浪者 (约 63) 一样高

      else { LIST.splice(LIST.findIndex((c) => c.id === 'jiean'), 1); console.warn('[roster] 皆安的精灵图加载失败'); }
    },
    get: (id) => LIST.find((c) => c.id === id),
    // 切换角色: 只换玩家帧 (G.CharArt.player), 其他系统不需要知道
    apply(id) {
      const c = R.get(id) || LIST[0];
      R.current = c.id;
      G.CharArt.player = c.frames();
    },
  };

  // ---------------- 选角界面 ----------------
  const UI = G.CharSelect = {
    open: false, sel: 0, timer: 0, onDone: null,

    show(onDone) {
      const el = document.getElementById('char-select'), box = el.querySelector('.cards');
      UI.onDone = onDone; UI.open = true; UI.sel = Math.max(0, LIST.findIndex((c) => c.id === R.current));
      box.innerHTML = '';
      LIST.forEach((c, i) => {
        const card = document.createElement('button');
        card.type = 'button'; card.className = 'card'; card.dataset.i = i;
        card.innerHTML = `<canvas width="72" height="96"></canvas><div class="name">${c.name}</div><div class="tag">${c.tagline}</div><div class="skill">${c.skill}</div>`;
        card.addEventListener('click', () => { UI.select(i); });
        box.appendChild(card);
      });
      UI.select(UI.sel);
      el.classList.add('show');
      // 卡片里的角色原地走路 (正面四帧循环)
      let f = 0;
      clearInterval(UI.timer);
      UI.timer = setInterval(() => {
        f = (f + 1) % 4;
        box.querySelectorAll('.card').forEach((card, i) => {
          const fr = LIST[i].frames().down.walk[f], cv = card.querySelector('canvas'), g = cv.getContext('2d');
          g.clearRect(0, 0, cv.width, cv.height); g.imageSmoothingEnabled = false;
          g.drawImage(fr.img, Math.round((cv.width - fr.w) / 2), cv.height - fr.h);
        });
      }, 180);
    },
    select(i) {
      UI.sel = i;
      document.querySelectorAll('#char-select .card').forEach((c, k) => c.classList.toggle('on', k === i));
    },
    confirm() {
      if (!UI.open) return;
      R.apply(LIST[UI.sel].id);
      UI.open = false; clearInterval(UI.timer);
      document.getElementById('char-select').classList.remove('show');
      if (UI.onDone) UI.onDone(LIST[UI.sel]);
    },
  };
  document.getElementById('btn-start').addEventListener('click', () => UI.confirm());
  // 键盘: 左右选择, 回车 / 空格开始
  window.addEventListener('keydown', (e) => {
    if (!UI.open) return;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') UI.select((UI.sel + LIST.length - 1) % LIST.length);
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') UI.select((UI.sel + 1) % LIST.length);
    else if (e.code === 'Enter' || e.code === 'Space') UI.confirm();
    else return;
    e.preventDefault(); e.stopPropagation();
  }, true);
})();

      `敌人 ${G.SceneTest.combat ? G.SceneTest.combat.enemies.map((e) => e.type[0] + e.state[0]).join(' ') : '-'}  子弹 ${G.SceneTest.combat ? G.SceneTest.combat.bolts.length : 0}\n` +
      `素材 ${loadInfo ? loadInfo.loaded + '/' + loadInfo.total : '-'}  ` +
      (I.mode === 'touch' ? '左侧摇杆移动 右侧按住拖动=朝该方向射击' : 'WASD移动 鼠标瞄准 左键/J攻击(可按住) 空格闪避 E打开 B素材 L光照 F全屏');
  }

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000 || 0);  // 切后台回来不会瞬移
    last = now;
    frames++; fpsT += dt; dbgT += dt;
    if (fpsT >= 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
    if (D.portrait || document.hidden) return;      // 竖屏/后台时暂停
    I.update();
    if (!G.CharSelect.open) G.scene.update(dt);
    G.scene.render(D.ctx);
    I.endFrame();
    if (dbgT > 0.25) { dbgT = 0; updateDebug(); }
  }

  async function start() {
    D.resize();
    if (!D.fullscreenSupported()) document.getElementById('btn-fullscreen').textContent = '全屏?';
    document.getElementById('btn-light').classList.toggle('on', C.LIGHTING);
    const txt = document.getElementById('loading-text');
    loadInfo = await G.Assets.loadAll((d, t) => (txt.textContent = `加载素材 ${d}/${t}`));
    G.CharArt.build();          // 生成角色/敌人像素帧
    await G.Roster.load();      // 角色名单 (切好其他角色的精灵图)
    G.SceneTest.init();
    G.SceneGallery.init();
    setScene(G.SceneTest);
    document.getElementById('loading').classList.add('done');
    // 开局先选角色: 选好之前场景只绘制不更新 (玩家不能移动, 怪物不行动)
    G.CharSelect.show(() => { G.SceneTest.fade = 1; });
    if (loadInfo.failed.length) D.toast(`有 ${loadInfo.failed.length} 个素材加载失败, 已使用占位图`);
    requestAnimationFrame((t) => { last = t; frame(t); });
  }
  start();
})();

</script>
</body>
</html>
