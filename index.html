  <script>
// Boss: 深渊之主 —— 独立的外形、四种攻击和三个阶段
//
// 接入方式和其他怪物一样 (G.MonsterAI.boss + G.MONSTERS.boss), 通用部分 (寻路、受击、死亡、掉落、道具事件) 全部复用 combat.js。
// 额外用到 combat.js 的几个通用开关:
//   e.shield  无敌 (怒吼时子弹被弹开, 不触发道具效果)
//   e.dmgMul  受伤倍率 (冲撞撞墙眩晕时 ×1.5)
//   e.hpFloor 血量下限 (一次大伤害不会跳过阶段, 停在阶段线上等怒吼)
//
// 攻击 (数值都在 js/config.js 的 G.MONSTERS.boss):
//   charge 深渊冲撞: 红色通道预警, 最后一小段锁定方向 -> 直线冲到撞墙为止 -> 眩晕 (输出窗口)
//   fan    扇形弹幕: 扇形瞄准线预警 -> 2~3 波扇形子弹, 每波错开半个间隔
//   erupt  深渊裂地: 玩家脚下和周围出现逐渐填满的红圈 -> 地刺爆发
//   spin   螺旋弹幕 (二阶段起): 原地旋转放出 3~4 条弹臂, 臂之间有大空隙
// 阶段: 100% -> 66% 深渊苏醒 (召唤腐化之眼, 加入螺旋) -> 33% 狂怒 (变红、加速、连冲两次、召唤甲虫)
(function () {
  const C = G.CONFIG, T = C.TILE;
  const rand = (a, b) => a + Math.random() * (b - a);
  const unit = (x, y) => { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; };
  const PH = (e) => e.M.phases[e.phase];

  // ---------------- 像素外形 ----------------
  // 悬浮的暗紫巨影: 蓝色荆棘王冠 + 正中一只猩红巨眼 + 两只利爪 + 破碎飘动的下摆; 狂怒阶段整体变红
  const PALS = [
    { d: '#1e1030', m: '#33204f', l: '#4f3478', h: '#7458a8', sc: '#e6d4f2', iris: '#c8163c', glow: '#ff3355', vein: '#6a1838', c0: '#2f6f8f', c1: '#4aa0bf', c2: '#9fe8ff', claw: '#d6c6ea', horn: '#8a7aa8' },
    { d: '#2a0c1e', m: '#4a1432', l: '#6e1f46', h: '#9a3a64', sc: '#ffe0e6', iris: '#ff2a48', glow: '#ffd23f', vein: '#c8163c', c0: '#8f2f4a', c1: '#d04a6a', c2: '#ffc0cc', claw: '#f0d0dc', horn: '#a86a80' },
  ];
  let ART = null;
  function buildArt() {
    const A = G.CharArt, out = [];
    for (const P of PALS) {
      out.push({
        idle: [A.frame(draw(A, P, 'idle', 0)), A.frame(draw(A, P, 'idle', 1))],
        wind: A.frame(draw(A, P, 'wind', 0)),
        charge: A.frame(draw(A, P, 'charge', 1)),
        dazed: A.frame(draw(A, P, 'dazed', 0)),
        roar: A.frame(draw(A, P, 'roar', 1)),
      });
    }
    A.colors.boss = [PALS[0].l, PALS[0].h, PALS[0].iris, PALS[0].c1, PALS[1].l];   // 受击/死亡碎片颜色
    return out;
  }
  function draw(A, P, pose, wob) {
    const W = 56, H = 52, p = A.Pix(W, H), cx = 27.5, cy = 28;
    const hot = pose === 'wind' || pose === 'charge' || pose === 'roar';
    // 下摆: 破碎的长条, 两帧交替飘动
    for (let x = 10; x <= 45; x += 2) {
      const len = 3 + ((x * 7 + wob * 5) % 6);
      for (let y = 40; y < 40 + len; y++) p.set(x, y, y > 40 + len - 2 ? P.d : P.m);
      p.set(x + 1, 40, P.m); p.set(x + 1, 41, P.d);
    }
    // 身体: 椭圆, 左上受光
    for (let y = 11; y <= 44; y++) for (let x = 6; x <= 49; x++) {
      const nx = (x - cx) / 19.5, ny = (y - cy) / 15.5;
      if (nx * nx + ny * ny > 1) continue;
      const L = -nx * 0.45 - ny * 0.75;
      p.set(x, y, L > 0.62 ? P.h : L > 0.18 ? P.l : L > -0.38 ? P.m : P.d);
    }
    // 身上的血管裂纹 (从眼睛向外), 蓄力时发亮
    const vein = hot ? P.glow : P.vein;
    [[[16, 24], [13, 27], [11, 31], [12, 35]], [[39, 24], [42, 27], [44, 31], [43, 35]], [[22, 32], [20, 37], [21, 41]], [[33, 32], [35, 37], [34, 41]]]
      .forEach((pts) => { for (let i = 0; i < pts.length - 1; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)); for (let k = 0; k <= n; k++) p.set(Math.round(x0 + (x1 - x0) * k / n), Math.round(y0 + (y1 - y0) * k / n), vein); } });
    // 两只弯角
    for (const s of [-1, 1]) {
      const hx = s < 0 ? 13 : 42;
      [[0, 0], [-1, -1], [-2, -2], [-2, -3], [-3, -4], [-3, -5], [-4, -6], [-4, -7], [-3, -8]].forEach(([dx, dy], i) => {
        const X = hx + (s < 0 ? dx : -dx);       // 向外弯曲
        p.set(X, 14 + dy, i > 6 ? '#ffffff' : P.claw);
        if (i < 6) p.set(X + (s < 0 ? 1 : -1), 14 + dy, P.horn);
      });
    }
    // 荆棘王冠
    for (let x = 17; x <= 38; x++) { p.set(x, 13, P.c0); p.set(x, 14, P.c0); }
    [[17, 3], [20, 5], [23, 7], [26, 9], [29, 9], [32, 7], [35, 5], [38, 3]].forEach(([x, h]) => {
      for (let k = 0; k < h; k++) p.set(x, 12 - k, k === h - 1 ? P.c2 : P.c1);
      p.set(x + 1, 12, P.c1);
    });
    // 手臂 + 三根长爪: 预警/怒吼时举起, 冲撞时向后收, 眩晕时垂下
    const up = pose === 'wind' || pose === 'roar' ? -8 : pose === 'charge' ? 3 : pose === 'dazed' ? 5 : 0;
    for (const s of [-1, 1]) {
      const bx = s < 0 ? 6 : 49;
      for (let i = 0; i < 10; i++) {
        const x = bx + s * Math.floor(i / 4) + s * (pose === 'charge' ? 1 : 0), y = 25 + up + i;
        p.set(x, y, P.m); p.set(x - s, y, P.l); p.set(x + s, y, P.d);
      }
      const tx = bx + s * 3, ty = 35 + up;
      for (const [dx, len] of [[-1, 4], [0, 5], [1, 4]]) for (let k = 0; k < len; k++) p.set(tx + dx * s + (k > 2 ? dx * s : 0), ty + k, k === len - 1 ? '#ffffff' : P.claw);
    }
    // 巨眼
    const ex = 27.5, ey = 24, eRy = pose === 'roar' ? 7 : 6;
    if (pose === 'dazed') {
      for (let x = 19; x <= 36; x++) p.set(x, 24 + (x % 3 === 0 ? 1 : 0), '#140b1f');
      p.set(18, 23, '#140b1f'); p.set(37, 23, '#140b1f');
    } else {
      for (let y = 16; y <= 32; y++) for (let x = 16; x <= 39; x++) {
        const nx = (x - ex) / 10, ny = (y - ey) / eRy;
        if (nx * nx + ny * ny <= 1) p.set(x, y, hot ? '#ffffff' : P.sc);
      }
      const ir = pose === 'roar' ? 3.2 : 4.4;
      for (let y = 17; y <= 31; y++) for (let x = 18; x <= 37; x++) if (Math.hypot(x - ex, y - ey) <= ir) p.set(x, y, hot ? P.glow : P.iris);
      for (let y = 20; y <= 28; y++) { p.set(27, y, '#140b1f'); p.set(28, y, '#140b1f'); }   // 竖瞳
      p.set(24, 21, '#ffffff'); p.set(25, 21, '#ffffff');
    }
    // 嘴: 一排獠牙, 怒吼时张大
    const m0 = pose === 'roar' ? 33 : 35, m1 = pose === 'roar' ? 39 : 37;
    for (let y = m0; y <= m1; y++) for (let x = 18; x <= 37; x++) p.set(x, y, '#140b1f');
    for (let x = 18; x <= 37; x += 2) { p.set(x, m0, P.claw); if (pose === 'roar') { p.set(x, m0 + 1, P.claw); p.set(x + 1, m1, P.claw); p.set(x + 1, m1 - 1, P.claw); } else p.set(x + 1, m1, P.claw); }
    return p.outline();
  }

  // ---------------- 小工具 ----------------
  // 冲撞通道长度: 从 Boss 沿 dir 走到墙 / 大障碍物为止
  function laneLen(e, cb, dir) {
    const w = cb.world;
    for (let d = 20; d < 1600; d += 12) {
      const x = e.x + dir.x * d, y = e.y + dir.y * d;
      if (w.isWall(Math.floor(x / T), Math.floor(y / T))) return d;
      for (const o of w.objects) { const s = o.def.solid; if (s && s.r >= 18 && Math.hypot(x - o.x, y - (o.y + (s.oy || 0))) < s.r + e.r * 0.5) return d; }
    }
    return 1600;
  }
  function fire(e, cb, ang, o) {
    cb.fireEnemyBolt(e.x + Math.cos(ang) * 30, e.y - 28 + Math.sin(ang) * 18, Math.cos(ang), Math.sin(ang),
      { speed: o.speed, range: o.range, r: o.r, dmg: o.damage, h: 28, color: 'boss' });
  }
  function contact(e, cb, p) {
    if (p.dead || e.cd > 0) return;
    if (Math.hypot(p.x - e.x, p.y - e.y) < e.r + C.PLAYER_RADIUS + 4 && p.hurt(e.M.damage, e.x, e.y, cb.scene)) e.cd = e.M.attackInterval;
  }

  const AI = {
    hitH: 74,
    screenBar: true,          // 不画头顶血条, 在屏幕底部画 Boss 血条

    init(e) {
      e.phase = 0; e.zones = []; e.cd2 = 1.2; e.lastAtk = null; e.dmgMul = 0; e.shield = false;
      e.hpFloor = e.maxHp * e.M.phases[1].at;
      e.introDone = false; e.strafe = 1; e.strafeT = 2;
    },

    think(e, dt, cb, p, per) {
      const M = e.M;
      this.updateZones(e, dt, cb, p);
      if (!e.introDone) { e.introDone = true; this.roar(e, cb, p, 0, true); }
      // 阶段: 血量被 hpFloor 卡在阶段线上 -> 怒吼进入下一阶段
      if (e.state !== 'roar' && e.phase < M.phases.length - 1 && e.hp <= e.maxHp * M.phases[e.phase + 1].at + 0.001) {
        this.roar(e, cb, p, e.phase + 1, false);
      }
      const st = e.state;
      if (st !== 'roar' && st !== 'dazed' && st !== 'charge') contact(e, cb, p);
      const stay = { mx: 0, my: 0, speed: 0 };

      if (st === 'roar') {
        e.timer -= dt;
        const R = M.roar;
        if (!e.roarIntro && !e.didSummon && e.timer < R.time * 0.45) { e.didSummon = true; this.summon(e, cb, p); }
        if (e.timer <= 0) { e.shield = false; e.state = 'chase'; e.cd2 = 0.7; }
        return stay;
      }
      if (st === 'recover') { e.timer -= dt; if (e.timer <= 0) { e.state = 'chase'; e.cd2 = rand(...PH(e).gap); } return stay; }

      // ---- 1. 深渊冲撞 ----
      if (st === 'chargeWind') {
        const A = M.charge;
        e.timer -= dt;
        if (e.timer > A.lock && !p.dead) e.dir = unit(p.x - e.x, p.y - e.y);   // 最后 lock 秒锁定方向
        e.lane = laneLen(e, cb, e.dir);
        e.blink = e.timer < e.windT * 0.45;
        if (e.timer <= 0) { e.state = 'charge'; e.timer = A.maxTime; e.hitDone = false; e.blink = false; e.lastPos = null; e.stuckN = 0; cb.scene.shake = Math.max(cb.scene.shake, 4); }
        return stay;
      }
      if (st === 'charge') {
        const A = M.charge;
        e.timer -= dt;
        if (!e.hitDone && !p.dead && Math.hypot(p.x - e.x, p.y - e.y) < e.r + C.PLAYER_RADIUS + 6) {
          e.hitDone = true; p.hurt(A.damage, e.x - e.dir.x * 40, e.y - e.dir.y * 40, cb.scene);
        }
        // 冲刺残影
        if (Math.random() < 0.6) cb.addPart({ x: e.x + rand(-20, 20), y: e.y - rand(10, 70), z: 0, vx: -e.dir.x * 60, vy: -e.dir.y * 60, vz: 0, g: 0, life: 0.25, t: 0, c: e.phase >= 2 ? '#6e1f46' : '#4f3478', s: 6 });
        // 撞墙判定: 沿冲撞方向几乎没有前进 (贴着墙滑动也算撞上)
        if (e.lastPos) {
          const prog = (e.x - e.lastPos.x) * e.dir.x + (e.y - e.lastPos.y) * e.dir.y;
          e.stuckN = prog < A.speed * dt * 0.35 ? (e.stuckN || 0) + 1 : 0;
        }
        e.lastPos = { x: e.x, y: e.y };
        if (e.stuckN >= 2 || e.timer <= 0) { this.impact(e, cb, e.stuckN >= 2); return stay; }
        return { mx: e.dir.x, my: e.dir.y, speed: A.speed, instant: true };
      }
      if (st === 'dazed') {
        e.timer -= dt;
        if (e.timer <= 0) { e.dmgMul = 0; e.state = 'chase'; e.cd2 = rand(...PH(e).gap) * 0.7; }
        return stay;
      }

      // ---- 2. 扇形弹幕 ----
      if (st === 'fanWind') {
        e.timer -= dt;
        if (e.timer > M.fan.windup * 0.4 && !p.dead) e.aim = Math.atan2(p.y - 28 - (e.y - 28), p.x - e.x);
        e.blink = e.timer < M.fan.windup * 0.35;
        if (e.timer <= 0) { e.state = 'fan'; e.wave = 0; e.timer = 0; e.blink = false; }
        return stay;
      }
      if (st === 'fan') {
        const F = M.fan, waves = F.waves[e.phase], n = F.count[e.phase];
        e.timer -= dt;
        if (e.timer <= 0) {
          if (e.wave >= waves) { e.state = 'recover'; e.timer = 0.45; return stay; }
          if (!p.dead) e.aim = Math.atan2(p.y - e.y, p.x - e.x);   // 每波重新对准, 但波与波错开半个间隔
          // 偶数波 n 发; 奇数波少一发、整体错开半个间隔, 正好补在上一波的空隙里 (两波之间要横向走位)
          const step = (F.spread * Math.PI / 180) / (n - 1), odd = e.wave % 2 === 1, cnt = odd ? n - 1 : n;
          for (let i = 0; i < cnt; i++) fire(e, cb, e.aim - (F.spread * Math.PI / 360) + (odd ? step / 2 : 0) + i * step, F);
          e.wave++; e.timer = F.gap;
          if (G.Sfx) G.Sfx.play('heavy', { pitch: 1.6 });
        }
        return stay;
      }

      // ---- 3. 深渊裂地 (施法后 Boss 继续行动, 红圈自己倒计时) ----
      if (st === 'erupt') {
        e.timer -= dt;
        if (e.timer <= 0) { e.state = 'chase'; e.cd2 = M.erupt.warn + rand(...PH(e).gap) * 0.6; }
        return stay;
      }

      // ---- 4. 螺旋弹幕 ----
      if (st === 'spinWind') {
        e.timer -= dt;
        e.blink = e.timer < M.spin.windup * 0.4;
        if (e.timer <= 0) { e.state = 'spin'; e.timer = M.spin.time; e.spinT = 0; e.blink = false; e.spinA = Math.random() * Math.PI * 2; e.spinDir = Math.random() < 0.5 ? 1 : -1; }
        return stay;
      }
      if (st === 'spin') {
        const S = M.spin, arms = S.arms[e.phase];
        e.timer -= dt; e.spinT -= dt; e.spinA += S.rotSpeed * e.spinDir * dt;
        if (e.spinT <= 0) {
          e.spinT = S.rate;
          for (let i = 0; i < arms; i++) fire(e, cb, e.spinA + (i / arms) * Math.PI * 2, S);
        }
        if (e.timer <= 0) { e.state = 'recover'; e.timer = 0.5; }
        return stay;
      }

      // ---- 平时: 和玩家保持中距离, 绕着走; 冷却好了就出招 ----
      if (e.cd2 === 0 && !p.dead) { this.attack(e, cb, p); return stay; }
      const [dmin, dmax] = M.keepDist, sp = M.speed * (PH(e).speedMul || 1);
      e.strafeT -= dt; if (e.strafeT <= 0) { e.strafe *= -1; e.strafeT = rand(1.5, 2.5); }
      if (per.d > dmax || !per.canSee) { const d = cb.chaseDir(e, p, per, dt); return d ? { mx: d.x, my: d.y, speed: sp } : null; }
      if (per.d < dmin) return { mx: -per.dx / per.d, my: -per.dy / per.d, speed: sp * 0.7 };
      return { mx: (-per.dy / per.d) * e.strafe, my: (per.dx / per.d) * e.strafe, speed: sp * 0.55 };
    },

    // 选招: 当前阶段可用的攻击里随机, 不连续用同一招
    attack(e, cb, p) {
      const M = e.M, pool = PH(e).attacks.filter((a) => a !== e.lastAtk);
      const a = pool[Math.floor(Math.random() * pool.length)];
      e.lastAtk = a;
      if (G.Sfx) G.Sfx.play('warn');
      if (a === 'charge') {
        e.chargeLeft = e.phase >= 2 ? M.charge.repeatP3 : 1;
        this.startCharge(e, p, M.charge.windup);
      } else if (a === 'fan') {
        e.state = 'fanWind'; e.timer = M.fan.windup; e.aim = Math.atan2(p.y - e.y, p.x - e.x);
      } else if (a === 'erupt') {
        const E = M.erupt, n = E.count[e.phase], w = cb.world;
        e.state = 'erupt'; e.timer = E.cast;
        const pts = [{ x: p.x, y: p.y }];
        for (let k = 0; k < 40 && pts.length < n; k++) {
          const q = { x: p.x + rand(-E.spread, E.spread), y: p.y + rand(-E.spread, E.spread) * 0.8 };
          if (w.isWall(Math.floor(q.x / T), Math.floor(q.y / T))) continue;
          if (pts.every((o) => Math.hypot(o.x - q.x, o.y - q.y) > E.radius * 1.3)) pts.push(q);   // 圈与圈之间留出空地
        }
        for (const q of pts) e.zones.push({ x: q.x, y: q.y, r: E.radius, t: 0, warn: E.warn + rand(0, 0.15), done: false });
      } else if (a === 'spin') {
        e.state = 'spinWind'; e.timer = M.spin.windup;
      }
    },
    startCharge(e, p, windup) {
      e.state = 'chargeWind'; e.timer = windup; e.windT = windup; e.lane = 0;
      e.dir = unit(p.x - e.x, p.y - e.y);
    },

    // 冲撞结束: 撞到墙/柱子 -> 震屏 + 碎石 + 眩晕 (三阶段第一次撞墙后马上再冲一次)
    impact(e, cb, hitWall) {
      const M = e.M, A = M.charge;
      if (hitWall) {
        cb.scene.shake = Math.max(cb.scene.shake, 14);
        if (G.Sfx) G.Sfx.play('boom');
        cb.rings.push({ x: e.x + e.dir.x * e.r, y: e.y + e.dir.y * e.r * 0.6, r: 110, t: 0, life: 0.4, color: '200,170,255', w: 8 });
        for (let i = 0; i < 14; i++) {
          const a = Math.atan2(-e.dir.y, -e.dir.x) + rand(-1.2, 1.2), sp = rand(80, 260);
          cb.addPart({ x: e.x + e.dir.x * e.r, y: e.y, z: rand(10, 50), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, vz: rand(100, 240), g: 700, life: rand(0.4, 0.7), t: 0, c: ['#2e1d45', '#4b3270', '#6e4fa0', '#9d82d0'][i % 4], s: i % 3 ? 3 : 6 });
        }
      }
      e.chargeLeft--;
      if (e.chargeLeft > 0) { this.startCharge(e, cb.scene.player, A.windup * 0.7); return; }
      if (hitWall) {
        e.state = 'dazed'; e.timer = e.phase >= 2 ? A.dazedP3 : A.dazed; e.dmgMul = A.dazedDmgMul;
        cb.text(e.x, e.y - 130, '眩晕!', '#ffd23f');
      } else { e.state = 'recover'; e.timer = 0.5; }
    },

    // 怒吼: 开场 / 阶段转换。无敌 + 冲击波推开玩家 (不扣血) + 召唤
    roar(e, cb, p, phase, intro) {
      const M = e.M, R = M.roar;
      e.phase = phase; e.state = 'roar'; e.timer = intro ? R.intro : R.time; e.roarIntro = intro; e.didSummon = false;
      e.shield = true; e.dmgMul = 0; e.blink = false; e.zones = e.zones.filter((z) => z.t < z.warn);
      e.hpFloor = phase + 1 < M.phases.length ? e.maxHp * M.phases[phase + 1].at : null;
      cb.scene.shake = Math.max(cb.scene.shake, intro ? 8 : 12);
      if (G.Sfx) G.Sfx.play('roar', { pitch: phase >= 2 ? 1.25 : 1 });
      for (let i = 0; i < 3; i++) cb.rings.push({ x: e.x, y: e.y, r: R.radius * (0.5 + i * 0.3), t: -i * 0.12, life: 0.6, color: phase >= 2 ? '255,90,60' : '200,60,120', w: 10 });
      if (!intro && !p.dead) {
        const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
        if (d < R.radius) { p.kbx += (dx / d) * R.push; p.kby += (dy / d) * R.push; }
      }
      const name = PH(e).name;
      G.Display.toast(intro ? `${M.name} 降临!` : `${M.name} · ${name}`, 1800);
      if (!intro) cb.text(e.x, e.y - 140, name + '!', phase >= 2 ? '#ff8a5a' : '#ff6a9a');
    },

    // 召唤小怪: 出现在 Boss 周围的空地, 进场就追玩家
    summon(e, cb, p) {
      const S = PH(e).summon; if (!S) return;
      for (const type in S) for (let i = 0; i < S[type]; i++) {
        let x = e.x, y = e.y;
        for (let k = 0; k < 12; k++) {
          const a = rand(0, Math.PI * 2), r = rand(110, 170), tx = e.x + Math.cos(a) * r, ty = e.y + Math.sin(a) * r * 0.8;
          if (!cb.blocked[Math.floor(ty / T) * cb.world.w + Math.floor(tx / T)]) { x = tx; y = ty; break; }
        }
        const m = cb.spawn(type, x, y);
        m.roomAggro = true; m.state = 'chase'; m.lastSeen = { x: p.x, y: p.y }; m.summoned = true;
        cb.puff(x, y - 10, '#c8163c', 8);
      }
    },

    // 地刺红圈: 倒计时结束时爆发, 玩家在圈内受伤
    updateZones(e, dt, cb, p) {
      const E = e.M.erupt;
      for (const z of e.zones) {
        z.t += dt;
        if (!z.done && z.t >= z.warn) {
          z.done = true;
          if (!p.dead && Math.hypot(p.x - z.x, (p.y - z.y) / 0.8) < z.r + C.PLAYER_RADIUS * 0.5) p.hurt(E.damage, z.x, z.y - 1, cb.scene);
          cb.scene.shake = Math.max(cb.scene.shake, 4);
          if (G.Sfx) G.Sfx.play('boom', { pitch: 1.4 });
          for (let i = 0; i < 10; i++) {
            const a = rand(0, Math.PI * 2), sp = rand(40, 140);
            cb.addPart({ x: z.x + rand(-20, 20), y: z.y, z: rand(0, 20), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.5, vz: rand(160, 300), g: 800, life: rand(0.35, 0.6), t: 0, c: i % 2 ? '#c8163c' : '#3a1430', s: i % 3 ? 3 : 6 });
          }
        }
      }
      e.zones = e.zones.filter((z) => z.t < z.warn + 0.45);
    },

    // Boss 倒下: 召唤物一起溃散, 场上的敌方子弹消失
    onDeath(e, cb) {
      e.zones = []; e.shield = false;
      cb.ebolts = [];
      for (const m of cb.enemies) if (m !== e && m.state !== 'dead') cb.killEnemy(m, 'bossDeath');
      cb.scene.shake = Math.max(cb.scene.shake, 22);
      if (G.Sfx) G.Sfx.play('roar', { pitch: 0.7 });
      for (let i = 0; i < 4; i++) cb.rings.push({ x: e.x, y: e.y, r: 160 + i * 70, t: -i * 0.1, life: 0.7, color: i % 2 ? '255,210,120' : '230,30,70', w: 12 });
      for (let i = 0; i < 40; i++) {
        const a = rand(0, Math.PI * 2), sp = rand(80, 360);
        cb.addPart({ x: e.x, y: e.y - 50, z: rand(10, 40), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, vz: rand(120, 320), g: 600, life: rand(0.6, 1.1), t: 0, c: ['#c8163c', '#7458a8', '#4aa0bf', '#ffd23f'][i % 4], s: i % 3 ? 3 : 6 });
      }
    },

    frame(e) {
      if (!ART) ART = buildArt();
      const A = ART[e.phase >= 2 ? 1 : 0], st = e.state;
      const bob = Math.round(Math.sin(e.animT * 2.4) * 5 / 3) * 3;
      if (st === 'roar' || st === 'dead') return { f: A.roar, lift: 18 + bob };
      if (st === 'chargeWind' || st === 'fanWind' || st === 'spinWind' || st === 'erupt' || st === 'spin' || st === 'fan') return { f: A.wind, lift: 16 + bob };
      if (st === 'charge') return { f: A.charge, lift: 9 };
      if (st === 'dazed') return { f: A.dazed, lift: 4 };
      return { f: A.idle[Math.floor(e.animT / 0.3) % 2], lift: 14 + bob };
    },

    // 地面预警: 冲撞通道 / 扇形瞄准线 / 螺旋蓄力圈 / 地刺红圈
    drawGround(ctx, e, snap) {
      const M = e.M, t = performance.now() / 1000;
      for (const z of e.zones) {
        const x = snap(z.x), y = snap(z.y);
        if (!z.done) {
          const k = Math.min(1, z.t / z.warn);
          ctx.fillStyle = `rgba(200,20,60,${0.10 + k * 0.18})`;
          ctx.strokeStyle = `rgba(255,70,90,${0.45 + k * 0.5})`; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.ellipse(x, y, z.r, z.r * 0.8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = `rgba(255,60,80,${0.25 + k * 0.2})`;
          ctx.beginPath(); ctx.ellipse(x, y, z.r * k, z.r * 0.8 * k, 0, 0, Math.PI * 2); ctx.fill();
        } else {
          // 爆发: 一圈像素地刺, 快速升起后消退
          const k = (z.t - z.warn) / 0.45, hgt = (k < 0.3 ? k / 0.3 : 1 - (k - 0.3) / 0.7) * 46;
          ctx.fillStyle = `rgba(40,8,24,${0.6 * (1 - k)})`;
          ctx.beginPath(); ctx.ellipse(x, y, z.r, z.r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
          for (let i = 0; i < 9; i++) {
            const a = (i / 9) * Math.PI * 2 + z.x, rr = i === 0 ? 0 : z.r * 0.6;
            const sx = x + Math.cos(a) * rr, sy = y + Math.sin(a) * rr * 0.8, h = hgt * (i === 0 ? 1.3 : 0.8);
            for (let j = 0; j < h; j += 3) {
              const wdt = Math.max(3, Math.round((1 - j / h) * 4) * 3);
              ctx.fillStyle = j > h - 6 ? '#ff8aa8' : j > h * 0.5 ? '#c8163c' : '#5a1430';
              ctx.fillRect(snap(sx - wdt / 2), snap(sy - j), wdt, 3);
            }
          }
        }
      }
      if (e.state === 'chargeWind' && e.dir) {
        const k = 1 - e.timer / e.windT, locked = e.timer <= M.charge.lock, w = M.charge.width;
        ctx.save(); ctx.translate(snap(e.x), snap(e.y)); ctx.rotate(Math.atan2(e.dir.y, e.dir.x));
        ctx.fillStyle = `rgba(220,20,60,${0.10 + k * 0.18})`; ctx.fillRect(0, -w / 2, e.lane, w);
        ctx.fillStyle = locked ? 'rgba(255,90,110,0.95)' : `rgba(255,80,100,${0.4 + k * 0.4})`;
        ctx.fillRect(0, -w / 2, e.lane, 3); ctx.fillRect(0, w / 2 - 3, e.lane, 3);
        // 通道里流动的箭头, 指出冲撞方向
        for (let d = ((t * 260) % 90); d < e.lane - 20; d += 90) {
          for (let i = 0; i < 4; i++) { ctx.fillRect(d - i * 3, -i * 6 - 3, 3, 6); ctx.fillRect(d - i * 3, i * 6 - 3, 3, 6); }
        }
        ctx.restore();
      }
      if (e.state === 'fanWind') {
        const F = M.fan, n = F.count[e.phase], k = 1 - e.timer / F.windup, step = (F.spread * Math.PI / 180) / (n - 1);
        ctx.save(); ctx.strokeStyle = `rgba(255,80,110,${0.25 + k * 0.5})`; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
        for (let i = 0; i < n; i++) {
          const a = e.aim - F.spread * Math.PI / 360 + i * step;
          ctx.beginPath(); ctx.moveTo(e.x, e.y - 28); ctx.lineTo(e.x + Math.cos(a) * 420 * (0.4 + k * 0.6), e.y - 28 + Math.sin(a) * 420 * (0.4 + k * 0.6)); ctx.stroke();
        }
        ctx.restore();
      }
      if (e.state === 'spinWind') {
        const k = 1 - e.timer / M.spin.windup;
        ctx.strokeStyle = `rgba(255,80,110,${0.3 + k * 0.6})`; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(snap(e.x), snap(e.y), 220 * (1 - k) + 50, (220 * (1 - k) + 50) * 0.55, 0, 0, Math.PI * 2); ctx.stroke();
      }
    },

  <script>
// 战斗系统 (通用部分): 刷怪 / 玩家子弹 / 敌方投射物 / 发现-游荡-搜索 / 寻路 / 碰撞 / 受击 / 死亡 / 掉落 / 粒子
// 每种怪物自己的行为在 js/monsters.js (G.MonsterAI), 数值在 js/config.js (G.MONSTERS)
(function () {
  const C = G.CONFIG, T = C.TILE;
  const rand = (a, b) => a + Math.random() * (b - a);
  const randi = (a, b) => Math.floor(rand(a, b + 1));
  const fmtDmg = (v) => String(Math.round(v * 10) / 10);   // 伤害数字: 小数伤害 (如 0.4) 保留一位

  // 在关卡里可以刷怪的位置 (格子坐标), 都是空地; 精英只在宽敞的位置出现
  const SPAWNS = [[17, 7], [23, 8], [5, 10], [20, 12], [14, 14], [24, 11], [12, 12], [19, 3], [3, 6], [8, 15]];
  const ELITE_SPAWNS = [[17, 7], [14, 14], [20, 12], [5, 10]];
  // 敌方投射物配色: [外圈, 内圈, 核心, 光照]
  const EB_COLORS = { eye: ['rgba(255,110,40,0.35)', '#ff7a2a', '#ffe066', '255,140,60'], elite: ['rgba(255,60,110,0.35)', '#d4306a', '#ffc0d4', '255,70,110'],
    boss: ['rgba(200,20,60,0.4)', '#a0123c', '#ff8aa8', '230,30,70'] };
  const isBig = (e) => e && (e.type === 'elite' || e.type === 'boss');   // 大型敌人: 更重的受击音效 / 震屏

  let NEXT_ID = 1;

  class Combat {
    constructor(scene) {
      this.scene = scene;
      this.world = scene.world;
      this._buildBlocked();
      this.reset();
    }

    reset() {
      this.enemies = []; this.bolts = []; this.ebolts = []; this.drops = [];
      this.parts = []; this.texts = []; this.splats = []; this.rings = []; this.impacts = [];
      this.partBudget = G.COMBAT.hitfx.particleBudget;
      G.Items.run('reset', false);   // 各流派的运行时状态清空 (已获得的道具由场景决定是否保留)
      this.flow = null; this.flowT = 0; this.flowTile = -1;
      this.wave = 0; this.waveT = 0; this.kills = 0; this.souls = 0;
      if (this.waveMode()) this.spawnWave(true);
    }

    // 波次模式 = 旧的单房间无限波次; 多房间地牢里由房间负责刷怪 (G.DUNGEON.enabled)
    waveMode() { return !(G.DUNGEON && G.DUNGEON.enabled); }

    // 切换房间: 换成另一张地图, 清空只属于上一个房间的东西 (子弹、粒子、寻路场、各流派运行时)
    // 击杀数 / 魂晶 / 道具都保留; 掉落物由场景按房间保存后再放回来
    setWorld(world, drops) {
      this.world = world;
      this._buildBlocked();
      this.enemies = []; this.bolts = []; this.ebolts = []; this.drops = drops || [];
      this.parts = []; this.texts = []; this.splats = []; this.rings = []; this.impacts = [];
      this.flow = null; this.flowT = 0; this.flowTile = -1; this.waveT = 0;
      G.Items.run('reset', false);
    }

    // ---------------- 刷怪 ----------------
    spawnWave(first) {
      const W = G.COMBAT.waves, p = this.scene.player;
      const comp = this.wave < W.length ? W[this.wave] : W[W.length - 2 + ((this.wave - W.length) % 2)];
      const far = (q) => Math.hypot(q.x - p.x, q.y - p.y) > (first ? 420 : 360);
      const toPts = (list) => list.map(([x, y]) => ({ x: (x + 0.5) * T, y: (y + 0.5) * T })).filter(far).sort(() => Math.random() - 0.5);
      if (comp.elite) {
        const ep = toPts(ELITE_SPAWNS)[0] || toPts(SPAWNS)[0];
        if (ep) this._aggro(this.spawn('elite', ep.x, ep.y));
      }
      this._spawnGroups(comp, this._spawnCenters(far));
      this.wave++;
      if (!first) G.Display.toast(comp.elite ? `第 ${this.wave} 波 · 精英 ${G.MONSTERS.elite.name} 出现!` : `第 ${this.wave} 波怪物出现了`, 1600);
    }

    // 房间刷怪 (多房间地牢): comp = { slime, beetle, eye, elite, boss }
    // 精英 / Boss 放在离玩家最远的宽敞位置, 普通怪成群刷在其余空地上; 全部都在当前房间的地图里
    spawnRoom(comp) {
      const p = this.scene.player;
      const far = (q) => Math.hypot(q.x - p.x, q.y - p.y) > (G.DUNGEON.spawnMinDist || 380);
      const centers = this._spawnCenters(far);
      // Boss: 出现在房间中央附近的空地 (离两扇门都远, 开场有一段登场怒吼)
      if (comp.boss) {
        const w = this.world, cx = w.w / 2, cy = w.h / 2;
        let best = null, bd = 1e9;
        for (const q of this._spawnCenters(() => true)) { const d = Math.hypot(q.x / T - cx, q.y / T - cy); if (d < bd) { bd = d; best = q; } }
        if (best) this._aggro(this.spawn('boss', best.x, best.y));
      }
      const big = [];
      for (let i = 0; i < (comp.elite || 0); i++) big.push(null);
      const byFar = centers.slice().sort((a, b) => Math.hypot(b.x - p.x, b.y - p.y) - Math.hypot(a.x - p.x, a.y - p.y));
      big.forEach((ov, i) => {
        const c = byFar[i % Math.max(1, byFar.length)]; if (!c) return;
        this._aggro(this.spawn('elite', c.x, c.y, ov));
        const k = centers.indexOf(c); if (k >= 0 && centers.length > 1) centers.splice(k, 1);   // 普通怪不刷在精英身上
      });
      this._spawnGroups(comp, centers);
      for (const e of this.enemies) if (G.DUNGEON.roomAggro) { e.roomAggro = true; e.state = 'chase'; e.lastSeen = { x: p.x, y: p.y }; }
    }

    _aggro(e) {
      const p = this.scene.player;
      if (G.COMBAT.waveAggro) { e.state = 'chase'; e.lastSeen = { x: p.x, y: p.y }; e.lostT = -6; }   // 6 秒内看不到玩家也不放弃追击
      return e;
    }

    // 普通怪按"群"刷出: 打乱顺序后每 3~5 只围着一个空地中心散开 (怪物多时连锁更容易打出来)
    _spawnGroups(comp, centers) {
      const list = [];
      for (const type of ['slime', 'beetle', 'eye']) for (let n = 0; n < (comp[type] || 0); n++) list.push(type);
      list.sort(() => Math.random() - 0.5);
      const [g0, g1] = G.COMBAT.groupSize, spread = G.COMBAT.groupSpread;
      let ci = 0, left = 0, c = null;
      for (const type of list) {
        if (left <= 0) { c = centers[ci++ % Math.max(1, centers.length)]; left = randi(g0, g1); }

        let x = c.x, y = c.y;
        for (let k = 0; k < 8; k++) {
          const tx = c.x + rand(-spread, spread), ty = c.y + rand(-spread, spread);

      }
    }

    // 刷怪中心: 地图上所有"四周也是空地"的格子 (远离玩家), 打乱顺序
    _spawnCenters(far) {
      const w = this.world, out = [];
      for (let y = 1; y < w.h - 1; y++) for (let x = 1; x < w.w - 1; x++) {
        const ok = [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].every(([dx, dy]) => !this.blocked[(y + dy) * w.w + x + dx]);
        const q = { x: (x + 0.5) * T, y: (y + 0.5) * T };

      out.sort(() => Math.random() - 0.5);

      for (const q of out) if (picked.every((o) => Math.hypot(o.x - q.x, o.y - q.y) > 200)) picked.push(q);

    spawn(type, x, y, overrides) {
      const M = overrides ? Object.assign({}, G.MONSTERS[type], overrides) : G.MONSTERS[type], AI = G.MonsterAI[type];
      const e = {
        id: NEXT_ID++, type, M, AI,
        x, y, vx: 0, vy: 0, kbx: 0, kby: 0, r: M.radius,
        hp: M.hp, maxHp: M.hp, state: 'wander', timer: rand(0.2, 1.5), cd: 0, cd2: 0,
        home: { x, y }, goal: null, face: Math.random() < 0.5 ? -1 : 1,
        lastSeen: null, lostT: 0, alertT: 0, flash: 0, hpShowT: 0, blink: false, air: false,
        hopT: Math.random(), animT: Math.random() * 2, hitDone: false, blockedT: 0,
        stuckT: 0, stuckRef: { x, y }, side: null, deathT: 0, spawnT: 0.5,
        hitT: 0, stun: 0, sinceHit: 99, hpLag: M.hp, hpLagT: 0, lastText: null,   // 命中反馈: 定格 / 硬直 / 血条残影 / 合并伤害数字
      };
      if (AI.init) AI.init(e);
      this.enemies.push(e);
      return e;
    }

    // ---------------- 投射物 ----------------
    // o (可选, 给道具生成的子弹用): { shard: true 小子弹, dmg, range, life (秒), speed, ignore (不会命中的敌人 id) }
    // 第 15 版的可选字段: lance 贯穿箭 / pierce 最多命中几个敌人 / radius 命中半径 / reflected 反射弹
    fireBolt(x, y, dx, dy, o) {

      const b = Object.assign({ x, y, vx: dx * sp, vy: dy * sp, dist: 0, age: 0, trail: [], bounces: 0 }, o);
      if (b.pierce) b.hitIds = new Set();
      this.bolts.push(b);

      for (let i = 0; i < 3; i++) this.addPart({ x, y, z: 0, vx: dx * 120 + rand(-60, 60), vy: dy * 120 + rand(-60, 60), vz: 0, g: 0, life: 0.15, t: 0, c: '#bff8ff', s: 3 });
    }

    // 敌方直线投射物 (不追踪): o = { speed, range, r, dmg, h (离地高度), color }
    fireEnemyBolt(x, y, dx, dy, o) {
      this.ebolts.push({ x, y, vx: dx * o.speed, vy: dy * o.speed, dist: 0, range: o.range, r: o.r, dmg: o.dmg, h: o.h || 20, col: EB_COLORS[o.color] || EB_COLORS.eye, t: 0 });
    }

    text(x, y, str, color) {
      if (this.texts.length >= G.COMBAT.hitfx.maxTexts) this.texts.shift();   // 超出上限时丢掉最旧的
      const t = { x, y, str, color, t: 0, pop: 1 };
      this.texts.push(t);
      return t;
    }

    // 粒子统一入口: 每帧有生成预算, 总数有上限, 大量命中时自动减量而不是卡顿
    addPart(q) {
      if (this.partBudget <= 0 || this.parts.length >= G.COMBAT.hitfx.maxParticles) return false;
      this.partBudget--;
      this.parts.push(q);
      return true;
    }

    // ---------------- 视线 / 寻路 / 移动 ----------------
    // 地面坐标之间的视线; withObjects=true 时也把障碍物/坑洞算进去 (用于判断能否直线走过去)
    los(x0, y0, x1, y1, withObjects, pad = 0) {
      const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 12);
      for (let i = 1; i < n; i++) {
        const x = x0 + ((x1 - x0) * i) / n, y = y0 + ((y1 - y0) * i) / n;
        if (this.world.isWall(Math.floor(x / T), Math.floor(y / T))) return false;

      if (withObjects) {
        for (const o of this.world.objects) {
          const s = o.def.solid, hr = o.def.hole;
          if (!s && !hr) continue;
          const ox = o.x, oy = o.y + (s ? s.oy || 0 : 0), rr = (s ? s.r : hr) + pad;

    // 寻路用的阻挡格: 墙、大障碍物中心所在格、坑洞格
    _buildBlocked() {
      const w = this.world;

      for (let y = 0; y < w.h; y++) for (let x = 0; x < w.w; x++) if (w.isWall(x, y)) this.blocked[y * w.w + x] = 1;

    _updateFlow(px, py) {

      const start = Math.floor(py / T) * W + Math.floor(px / T);
      if (this.flow && start === this.flowTile && this.flowT > 0) return;
      this.flowTile = start; this.flowT = 0.3;
      const dist = this.flow && this.flow.length === W * H ? this.flow : new Int16Array(W * H);
      dist.fill(-1);

          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          const j = ny * W + nx;
          if (dist[j] >= 0 || this.blocked[j]) continue;
          if (dx && dy && (this.blocked[y * W + nx] || this.blocked[ny * W + x])) continue;

        }

    }

    _flowDir(e) {
      const w = this.world, W = w.w;
      const x = Math.floor(e.x / T), y = Math.floor(e.y / T);
      let best = null, bd = 1e9;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= w.h) continue;
        const d = this.flow[ny * W + nx];
        if (d < 0) continue;
        if (dx && dy && (this.blocked[y * W + nx] || this.blocked[ny * W + x])) continue;
        if (d < bd) { bd = d; best = { x: (nx + 0.5) * T, y: (ny + 0.5) * T }; }
      }
      if (!best) return null;

    }

    chaseDir(e, p, per, dt) {
      let dir;
      if (per.canSee && this.los(e.x, e.y, p.x, p.y, true, e.r - 2)) dir = { x: per.dx / per.d, y: per.dy / per.d };
      else dir = this.flow ? this._flowDir(e) : null;
      if (e.side && e.side.t > 0) { e.side.t -= dt; dir = e.side.dir; }
      e.stuckT += dt;
      if (e.stuckT > 0.6) {

    // 敌人移动: 墙 + 障碍物用世界碰撞, 另外避开坑洞 (空中时可以越过坑洞)
    _move(e, dx, dy) {
      this.world.moveCircle(e, dx, dy, e.r);
      if (e.air) return;
      for (const o of this.world.objects) {
        const hr = o.def.hole; if (!hr) continue;
